[package]
name = "journals"
version = "0.1.0"
edition = "2021"
description = "The memory backbone: journal trees for people and their families, kept as YAML in one git repository (docs/memory_backbone.md)"

# The model — files, paths, lines, periods, summaries, the tree and every
# operation on it — is plain code over bytes and builds and tests in seconds.
# Only `store` touches git, through zend-vfs.
[dependencies]
# Diaries (`src/diaries/`): passphrase stretching, key derivation, sealing,
# random ids and nonces, and keys wiped when dropped.
argon2           = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
hkdf             = "0.12"
journal-core     = { path = "../journal-core" }
rand             = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
serde_yaml       = { workspace = true }
sha2             = "0.10"
thiserror        = { workspace = true }
tracing          = { workspace = true }
zend-vfs         = { path = "../zend-vfs" }
zeroize          = "1"

[dev-dependencies]
tempfile = { workspace = true }
