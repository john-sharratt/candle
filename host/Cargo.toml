[package]
name = "host"
version = "0.1.0"
edition = "2021"
description = "The process a daemon runs in: one model, one engine, one HTTP server, its tenants beside each other"

[lib]
name = "host"
path = "src/lib.rs"

# Depends on neither daemon: `zend` and `npcd` each depend on this, and only
# `motherd` links both (`docs/shared_model_host.md` §3.7).
[dependencies]
anyhow     = { workspace = true }
clap       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tracing    = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures    = { workspace = true }

# The same axum `web` builds its router from, so the routers unify.
axum       = { version = "0.7", features = ["macros", "ws"] }
tokio      = { version = "1", features = ["full"] }
sha2       = "0.10"
# The shared front-end, compiled in (`ui::COMMON`).
include_dir = { version = "0.7" }
# The model download (`download`).
reqwest    = { version = "0.12", features = ["stream"] }
# `disk`: the substrate's volume, for fault mode (`docs/replicated_substrate.md` §7.7).
sysinfo    = { version = "0.31", default-features = false, features = ["system", "disk"] }
# Card readings for `/v1/telemetry`: a runtime link against the installed
# driver — see `telemetry::device`.
nvml-wrapper = "0.12"

web                 = { path = "../web" }
# The cluster a daemon joins with `--cluster` (`docs/replicated_substrate.md`).
cluster             = { path = "../cluster" }
# What a member holds of each origin, as replication and its substrate share it.
applied-set         = { path = "../applied-set" }
# A response served off a socket ends only after the events it caused are on
# it: its body is wrapped to flush them first (§6.4).
http-body           = "1"
bytes               = "1"
# A member dials each gateway over `wss`, verifying its certificate against the
# Mozilla roots built into the binary.
cluster-dial        = { path = "../cluster-dial" }
# `--agent`: the agent in this process, beside the tenants (§11.5).
agent               = { path = "../agent" }
zend-vfs            = { path = "../zend-vfs" }
tokio-rustls        = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The requests a gateway sends over a member's socket, served as the TLS
# entrance serves a connection.
hyper               = { version = "1", features = ["server", "client", "http1"] }
hyper-util          = { version = "0.1", features = ["server", "server-auto", "http1", "http2", "tokio"] }
tower               = { version = "0.5" }
http-body-util      = "0.1"
candle              = { workspace = true, features = ["cuda"] }
candle-conversation = { path = "../candle-conversation", features = ["hub"] }

[build-dependencies]
embed-watch = { path = "../embed-watch" }

[dev-dependencies]
tempfile = { workspace = true }
tower    = { version = "0.5" }
tokio    = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

[features]
default = []
# Zero-cost scoped timing of the hot path; `/v1/profile` reports whether it
# was built in.
profile = ["candle-conversation/profile"]
