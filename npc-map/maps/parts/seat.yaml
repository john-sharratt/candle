id: seat
kind: seat
name: seat
# No `short`: "twelve seats" already says everything a level description
# needs, and a clause repeated in every room that has a chair is how a
# generated page starts sounding generated.
long: >
  A seat. Sitting claims nothing and blocks nobody. What it affords is talking
  to whoever else is here, which is the only route by which something a Maker
  learned and never wrote down reaches the Maker who needs it.
