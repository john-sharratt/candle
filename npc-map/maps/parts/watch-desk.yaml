id: watch-desk
kind: station
name: watch desk
short: >
  The whole cast can be read across from it, and what disagrees reported.
long: >
  A desk that reads and never writes, and therefore claims nobody. It reaches
  every character at once and looks for what does not agree — two records of
  the same event, a belief nobody could hold alongside a memory, a name used
  two ways. It reports; it does not correct, because correcting means holding
  a character and holding a character means a station. This is the only work
  on its level that gets better the busier the level is, since there is more
  to disagree with.
tools:
  - cast.read_all
  - cast.report_disagreement
