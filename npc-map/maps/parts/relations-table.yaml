id: relations-table
kind: fixture
name: the relations table
short: >
  What stands between two characters is settled at it, by both their holders,
  and lands in both their records.
long: >
  What stands between two characters — an old debt, a betrayal, a marriage —
  lives in both their records, so neither holder can write it alone and
  neither can be trusted to write it for the other. Both sit here and settle
  it, and the result is written into both at once. It takes two: one Maker at
  this table can do nothing.
tools:
  - character.settle_relation
