id: gallery-rail
kind: fixture
name: the rail
short: >
  The rail overlooks the map without reaching it, so the geography can be
  argued about by somebody who is not holding it.
long: >
  A rail above the map table. From it the whole geography can be seen and
  talked about, and nothing on it can be changed. That is the point: a Maker
  who wants to argue about a border does not have to take the map to do it,
  and whoever is holding the map can hear the argument.
