id: concordance-table
kind: fixture
name: the concordance table
short: >
  A boundary between two eras is settled at it, by both their holders at once.
long: >
  A table for the one thing a chronicle terminal will not do. Where two eras
  meet belongs to both of them, so neither holder can decide it alone and
  neither can be trusted to decide it for the other. Both sit here, agree the
  boundary, and it lands in both records at once. It takes two: one Maker at
  this table can do nothing.
tools:
  - chronicle.settle_boundary
