id: likeness-table
kind: fixture
name: the likeness table
short: >
  What kin, a faction or a generation must share in the face is settled at it.
long: >
  Kin, a faction and a generation each have to look like themselves, and no
  easel on its own can decide what that means. Two or more Makers holding
  members of the same group settle it here, and it binds every face in the
  group afterwards.
