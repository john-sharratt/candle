id: road-table
kind: fixture
name: the road table
short: >
  What runs between two places is settled at it, by the Makers holding each
  end.
long: >
  A road runs between two places and belongs to both, so it belongs to neither
  survey desk. The Makers holding each end sit here and settle what runs
  between them and what happened on it. It takes two: one Maker at this table
  can do nothing.
