id: structure-board
kind: fixture
name: the structure board
short: >
  A piece laid out as its scenes, so its shape can be argued about before a word
  of it is written well.
long: >
  A board where a piece is broken into its moving parts and pinned up where
  somebody else can see them. A scene is somebody wanting something specific,
  something standing in the way, and it going wrong; what follows is the
  reaction, the choice between bad options, and the decision that starts the
  next scene. Laid out this way, a piece that is merely nice reveals itself
  immediately: no want, no obstacle, nothing at stake. The test for a want is
  whether you could photograph the moment it is satisfied. If you cannot, it is
  not a want, it is a mood.
tools:
  - structure.lay_out_scenes
  - structure.test_the_want
  - structure.find_the_slack
