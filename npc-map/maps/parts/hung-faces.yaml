id: hung-faces
kind: fixture
name: the hung faces
plural: the hung faces
short: >
  Every finished portrait hangs the length of the wall, so twenty paces shows
  everything the world already looks like.
long: >
  Every finished portrait, hung. It is the answer to the hardest problem on
  this level: a face is judged against the ones beside it, and the only way to
  know what the world already looks like is to stand back and look at all of
  it at once.
