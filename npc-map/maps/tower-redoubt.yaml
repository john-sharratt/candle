# The Redoubt — a tower, and the one Companions of this world muster from.
#
# A building in Battle Cities beside the Creator's Vault. The vault is where the
# world is written; this is where it is lived in.
id: tower-redoubt
kind: building
name: The Redoubt
within: battle-cities
arrival: tower-redoubt/muster-hall
summary: >
  A walking fortress with a drill under it and a foundry in it. Companions are
  outfitted here, sent out from here, and recalled back to here.
character: >
  Every part of it is either making something, defending something or about to
  move, and the parts that are quiet are the ones nobody has needed yet.
lacks:
  - anywhere to write the record down
# Where a recall lands. The one journey out of the waste that is not walked.
teleport_to: tower-redoubt/muster-hall
spine:
  name: the spinal run
  through: [spine-lower, spine-upper]
nodes:
  - { id: spine-lower, kind: passage, name: the lower run }
  - { id: spine-upper, kind: passage, name: the upper run }

  - id: core
    kind: core
    name: the lift
    off: [spine-lower]
    character: >
      One car serving every deck, which is why the muster hall empties slowly
      and fills all at once.

  - id: muster-hall
    kind: work
    name: the muster hall
    off: [spine-lower]
    parts: [muster-board, order-table, light-ring, status-board, { part: seat, count: 12 }]
    habit: busy before a sortie and empty during one
    character: >
      A wide hall where orders are given and where a body comes back to.

  - id: gatehouse
    kind: work
    name: the gatehouse
    off: [spine-lower]
    parts: [blast-door, pressure-door]
    character: >
      The only way in and out on foot, closed by one slab of plate.

  - id: rampart
    kind: work
    name: the rampart
    off: [spine-upper]
    parts: [{ part: wall-turret, count: 4 }]
    habit: manned whenever anything is moving on the ground
    character: >
      Four emplacements looking out over open ground.

  - id: foundry
    kind: work
    name: the foundry
    off: [spine-lower]
    parts: [{ part: fabricator, count: 8 }, breaker-panel, coolant-valve, air-handler]
    habit: never idle for long
    character: >
      Eight production bays, each with its own queue, drawing on a shared stockpile.

  - id: bridge
    kind: work
    name: the bridge
    off: [spine-upper]
    parts: [bridge-console, sensor-panel, compute-rack, { part: seat, count: 4 }]
    character: >
      The control room, where the tower as a whole is commanded.

  - id: motor-pool
    kind: store
    name: the motor pool
    off: [spine-lower]
    parts: [carrier]
    habit: quiet

  - id: barracks
    kind: social
    name: the barracks
    off: [spine-upper]
    parts: [{ part: seat, count: 16 }]
    habit: full at night
    character: >
      A common room with nothing in it that does a job; people talk here.
