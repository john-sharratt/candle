# motherd on the 16 GB laptop (RTX 4090 Laptop, 192.168.0.237): the same
# process as motherd.yaml, which is blackworld's (.5), with this machine's
# address. Everything else, the gateway and the cluster it joins included, is
# the same; see motherd.yaml for what each setting means. It runs no agent of
# its own: this machine's agent is the standalone `tokera-agent` keep runs
# (agent.laptop.yaml), a standby that holds the checkouts an in-process one
# would. Its jobs go through the gateway like every member's.
#
# Run from the repository root:
#
#   target\release\motherd.exe --config motherd\motherd.laptop.yaml

host:
  host: 192.168.0.237
  port: 8081
  tls_port: 8444
  # One cluster reached by two paths, best first: blackworld on the LAN
  # (gateway.tokera.local → .4 and .5 through this machine's hosts file),
  # then the internet.
  clusters: ["https://gateway.tokera.local:9443 https://gateway.tokera.com:9443"]
  cluster_name: tokera.com
  group_key: web/secrets/group.key

zend:
  working_dir: ..
  max_depth: 3

npcd:
  mind_repo: battle-mind
  data: ../npcd-data
