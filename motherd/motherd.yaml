# motherd — zend and npcd in one process, on one model.
#
# Each section holds the same settings as that daemon's own flags, spelled as
# the flag is without its dashes (`--working-dir` is `working_dir:`). A key no
# section knows refuses the start. Paths resolve against the working directory
# — the repository root, which every daemon runs from.
#
# Run from the repository root:
#
#   target\release\motherd.exe --config motherd\motherd.yaml

# The process: where it listens and whom it believes, and the cluster it joins
# (docs/replicated_substrate.md §3). One plain entrance and, beside it, HTTPS
# with a certificate made at startup, for the gateway's hop. zend's UI answers a
# bare IP and code.tokera.com; npcd's console answers bot.tokera.com and
# npcd.localhost.
#
# Both tenants join the gateway through its TLS entrance, on the LAN at
# gateway.tokera.local (the hosts file's 192.168.1.2) and, failing that, over the
# internet at gateway.tokera.com — a DNS-only name, not behind Cloudflare's proxy,
# which does not carry :9443 — each verified as tokera.com, the name on the
# gateway's certificate, with the group key the gateway holds. While they are joined the gateway routes code.tokera.com
# and bot.tokera.com to them; while they are not, each route falls back to its
# configured upstream (§5.7). The agent file runs build, git and mind jobs in
# this process at low priority (§11.5).
host:
  host: 192.168.1.2
  port: 8081
  tls_port: 8444
  clusters: ["https://gateway.tokera.local:9443 https://gateway.tokera.com:9443"]
  cluster_name: tokera.com
  group_key: web/secrets/group.key
  agent: motherd/agent.yaml
  # zenj reserves the machine while rekordbox is open (docs/house_modes.md §4):
  # the agent then takes no builds or tests, the tenants read and calibrate
  # nothing, and the member drains while another serves every app it does. A
  # machine with no zenj answering is never reserved.
  guards: ["127.0.0.1:8097"]
  # DEBUG for every tenant and engine crate (`candle_nn` at INFO): the
  # per-reprojection timings and the scheduler's other per-event detail are
  # logged there, and a slow conversation cannot be diagnosed without them.
  verbose: 1

# zend: the workspace folder holding `workspace.yaml`, and its `substrate/`. A
# substrate is bound to the model that wrote it, so one written under another
# model refuses to open — start on a new one, or move the old one aside.
# `max_depth` bounds the walk five components below each repository's root,
# deep enough for the crates' module trees (`candle-nn/src/kv_cache/chunked/`,
# `candle-transformers/src/models/expert_lre/`), whose files a dialogue is
# asked about. `ignore` keeps out what that depth would otherwise bring in and
# no question needs read: data and prose trees, upstream examples, and the
# dependency battery's own results — a reading of those would answer the
# battery from its last run's answers (docs/unbounded_agents.md §9.12). A
# `…/*/*` pattern covers only below the folder's own files, which the walk
# read at depth 3 before.
zend:
  working_dir: ..
  max_depth: 5
  ignore:
    - candle/docs/results/dependency_battery_*
    - candle/candle-examples/examples/*/*
    - candle/npc-map/maps/*/*
    - battle-cities/docs/lore/*/*
    - battle-cities/assets/*/*

# npcd: its mind is the repository the agents hold as `battle-mind`, read from
# the substrate at the commit the log names (docs/substrate_git.md §8) and
# reached through the agents only. The substrate — the mind's packs among its
# records — and the accounts live in the data folder.
npcd:
  mind_repo: battle-mind
  data: ../npcd-data
  # Its own clone of the journals repository, the agent's `journals-npcd`
  # checkout: where a world naming a journals group writes its characters'
  # experience (docs/npc_conversations.md §5.0).
  journals_dir: D:/agent/journals-npcd
