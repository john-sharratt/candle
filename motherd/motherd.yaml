# motherd — zend and npcd in one process, on one model.
#
# Each section holds the same settings as that daemon's own flags, spelled as
# the flag is without its dashes (`--working-dir` is `working_dir:`). A key no
# section knows refuses the start. Paths resolve against the working directory
# — the repository root, which every daemon runs from.
#
# Run from the repository root:
#
#   target\release\motherd.exe --config motherd\motherd.yaml

# The process: where it listens and whom it believes, and the cluster it joins
# (docs/replicated_substrate.md §3). One plain entrance and, beside it, HTTPS
# with a certificate made at startup, for the gateway's hop. zend's UI answers a
# bare IP and code.tokera.com; npcd's console answers bot.tokera.com and
# npcd.localhost.
#
# Both tenants join the gateway through its TLS entrance at gateway.tokera.com —
# a DNS-only name, not behind Cloudflare's proxy, which does not carry :9443 —
# verified as tokera.com, the name on the gateway's certificate, with the group key
# the gateway holds. While they are joined the gateway routes code.tokera.com
# and bot.tokera.com to them; while they are not, each route falls back to its
# configured upstream (§5.7). The agent file runs build, git and mind jobs in
# this process at low priority (§11.5).
host:
  host: 192.168.0.5
  port: 8081
  tls_port: 8444
  clusters: ["https://gateway.tokera.com:9443"]
  cluster_name: tokera.com
  group_key: web/secrets/group.key
  agent: motherd/agent.yaml

# zend: the workspace folder holding `workspace.yaml`, and its `substrate/`. A
# substrate is bound to the model that wrote it, so one written under another
# model refuses to open — start on a new one, or move the old one aside.
# `max_depth` bounds the folder walk three components below the workspace.
zend:
  working_dir: ..
  max_depth: 3

# npcd: its mind is the repository the agents hold as `battle-mind`, mirrored
# under its data folder and reached through them only (§10.3); the substrate
# and accounts live beside the mirror.
npcd:
  mind_repo: battle-mind
  data: ../npcd-data
