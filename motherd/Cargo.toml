[package]
name = "motherd"
version = "0.1.0"
edition = "2021"
description = "zend and npcd in one process, on one model"

[[bin]]
name = "motherd"
path = "src/main.rs"

# The one crate that links both daemons (`docs/shared_model_host.md` §3.7):
# `host` depends on neither, so `zend` and `npcd` each build without the other.
[dependencies]
anyhow     = { workspace = true }
clap       = { workspace = true }
cluster    = { path = "../cluster" }
serde      = { workspace = true }
serde_yaml = "0.9"
host       = { path = "../host" }
# The counting global allocator (`docs/memory_census.md`).
heap-census = { path = "../heap-census", optional = true }
zend       = { path = "../zend" }
npcd       = { path = "../npcd" }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
web      = { path = "../web" }

[features]
# The memory census is on in the deployed build while BlackWorld's untracked
# growth is being found (`docs/memory_census.md`).
default = ["memory-census"]
# The memory census: the counting allocator installed, and the host's census
# task and the stores' gauge pass running.
memory-census = ["dep:heap-census", "zend/memory-census", "npcd/memory-census"]
# Zero-cost scoped timing of the hot path; `/v1/profile` reports it.
profile = ["host/profile", "zend/profile"]
# The `tensor-assert` harness (CLAUDE.md): every wave drained for non-finite
# sites, and the first one armed to capture its operands on the next pass.
tensor-assert = ["zend/tensor-assert"]
