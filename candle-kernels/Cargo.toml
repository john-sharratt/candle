[package]
name = "candle-kernels"
version = "0.9.1"
edition = "2021"

description = "CUDA kernels for Candle"
repository = "https://github.com/huggingface/candle"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"

[features]
default = []
# Compile the CUDA kernels with `--generate-line-info`, so `compute-sanitizer`
# and `cuda-gdb` can name the kernel source file and line behind a fault.
#
# **Off by default, and it should stay off.** Measured across a cubin: `.text`
# holds 175 KB of SASS against 592 KB of debug sections, `.nv_debug_ptx_txt`
# (the embedded PTX source text) being 490 KB of that. Two thirds of every
# archive, statically linked into every test binary that touches CUDA.
#
# **Not the way faults are found here.** A device-side fault is a write that went
# somewhere it should not have, and `readonly_regions` behind `tensor-assert`
# names the writer at the moment of the write — before the corruption, with the
# tenant's name. Reach for that; see CLAUDE.md.
#
# The build script hashes the compile arguments, so flipping this rebuilds the
# kernels and flipping it back restores the cached small ones.
kernel-lineinfo = []

[dependencies]
half = { version = "2.5.0", features = ["num-traits"] }
float8 = { version = "0.4.2", features = ["num-traits"] }
# Shared with build.rs via include!() — kernel_tool binary needs these at runtime
anyhow = "1.0"
flate2 = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
anyhow = "1.0"
flate2 = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kernel_tool"
path = "src/bin/kernel_tool.rs"
