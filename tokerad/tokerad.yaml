# tokerad — zend and npcd in one process, on one model.
#
# Each section holds the same settings as that daemon's own flags, spelled as
# the flag is without its dashes (`--working-dir` is `working_dir:`). A key no
# section knows refuses the start. Paths resolve against the working directory
# — the repository root, which every daemon runs from.
#
# Run from the repository root:
#
#   target\release\tokerad.exe --config tokerad\tokerad.yaml

# The process: where it listens and whom it believes. One plain entrance and,
# beside it, HTTPS with a certificate made at startup, for the gateway's hop.
# zend's UI answers a bare IP and code.tokera.com; npcd's console answers
# bot.tokera.com and npcd.localhost.
host:
  host: 192.168.0.5
  port: 8081
  tls_port: 8444

# zend: the workspace folder holding `workspace.yaml`, and its `substrate/`. A
# substrate is bound to the model that wrote it, so one written under another
# model refuses to open — start on a new one, or move the old one aside.
zend:
  working_dir: ..

# npcd: the mind it runs, whose folder also holds its substrate and accounts.
npcd:
  mind: ../mind
