[package]
name = "candle-core"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
# Only for `forbidden_alloc`: unlike `std::backtrace`, it can capture frame
# addresses without symbolising them, which is what keeps the detector cheap
# enough to leave armed across a hot loop.
backtrace = { version = "0.3", optional = true }
byteorder = { workspace = true }
candle-kernels = { workspace = true, optional = true }
candle-metal-kernels = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
gemm = { workspace = true }
half = { workspace = true }
float8 = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
memmap2 = { workspace = true }
num-traits = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
yoke = { workspace = true }
zip = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "ios")))'.dependencies]
ug = { workspace = true }
ug-cuda = { workspace = true, optional = true }
ug-metal = { workspace = true, optional = true }

# `direct_io` needs the O_DIRECT flag, which is not in `std`. Unconditional on
# unix rather than behind the `mkl`/`accelerate` features that pull the optional
# `libc` above, because the direct-I/O reader is not feature-gated.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Windows-only VRAM measurement backend (DXGI) for the VRAM Governor's DXGI
# probe (compiled only on Windows, used only under the `cuda` feature), plus the
# Win32 ReadFile + OVERLAPPED bindings `direct_io` issues positioned reads
# through. The two crates coexist: `windows` is the typed wrapper the DXGI probe
# wants, `windows-sys` the raw FFI the read path wants.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Foundation",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
criterion = { workspace = true }
serial_test = "3.0"

[features]
default = []
cuda = ["cudarc", "dep:candle-kernels", "dep:ug-cuda", "float8/cuda"]
# Expose the VRAM Governor's scripted probe/allocator test doubles to other
# crates' tests (candle-core's own tests get them via `cfg(test)`).
vram-test-util = []
# Report device allocations that reach the driver while the wave path is armed
# (`forbidden_alloc`). Off by default: capturing a stack per allocation is far
# too slow for a production run, and the counters are a measurement tool, not a
# guard rail.
forbidden_allocations = ["dep:backtrace"]
cudnn = ["cuda", "cudarc/cudnn"]
mkl = ["dep:libc", "dep:intel-mkl-src"]
accelerate = ["dep:libc", "dep:accelerate-src"]
metal = [
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "dep:candle-metal-kernels",
    "dep:ug-metal",
]

[[bench]]
name = "bench_main"
harness = false

[[example]]
name = "metal_basics"
required-features = ["metal"]

[[example]]
name = "cuda_basics"
required-features = ["cuda"]

[[example]]
name = "quantized_matmul_benchmark"
required-features = ["cuda"]
