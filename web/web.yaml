# ============================================================================
# web — the site table for the DMZ front door.
#
# A request is resolved in three steps:
#
#     Host header  ->  site      (exact, then *.wildcard, then the default)
#     path prefix  ->  upstream  (longest matching prefix wins; `exact` beats
#                                 any prefix)
#     otherwise    ->  a file, from that site's roots in order
#
# `roots` is a list because one URL tree is assembled from several directories:
# `[content/npcd, content/common]` means /lib/dom.js falls through to the shared
# framework while /pages/roster.js does not. Neither site owns the framework.
#
# Paths are relative to this file, so the config travels with its content.
# `web --check` prints the resolved table without binding anything.
#
# TWO WAYS TO RUN THIS FILE:
#
#   web                   the deployment below — this box holds the files, the
#                         daemons answer the APIs from their own machines.
#   web --authoritative   every forwarded API answered from the built-in mocks
#                         instead. Nothing outside the process is contacted, so
#                         the whole estate works on a laptop with no daemons.
#
# The flag rewrites the upstreams; it does not need a second config.
# ============================================================================

server:
  # Cloudflare connects to :80 and terminates TLS itself, so this is the port
  # the tunnel expects to find open. `--bind` overrides it for a local run that
  # must not take the real one.
  bind: "0.0.0.0:80"

  # How long a static file may be reused before the browser asks again.
  #
  # Two tiers, split by how much a stale copy matters rather than by how often
  # the file changes:
  #
  #   short — HTML, JavaScript, CSS. A page running last minute's code against
  #           this minute's API is the failure worth bounding, and `--content`
  #           serves these from disk so a refresh can show an edit.
  #   long  — images, icons, fonts. A stale one is a slightly old picture.
  #
  # Both still carry an ETag, so these say when to *ask*, not what the answer
  # costs: once the age is up the request is conditional and an unchanged file
  # is `304` with no body.
  #
  # This was one value, and it went from `no-store` (re-download everything,
  # every refresh) to `no-cache` (no bytes, but fifteen round trips a load) to
  # this. `web/src/asset.rs` has the reasoning.
  cache:
    short_secs: 60
    long_secs: 900

  # A daemon that is down is not retried on every request: the window opens at
  # 250ms and doubles to 10s, requests inside it fail fast with an error page
  # that refreshes itself, and one probe is released when it expires. Recovery
  # needs no operator action.
  backoff:
    initial_ms: 250
    max_ms: 10000

  connect_timeout_ms: 5000

# ── sign-in, for the whole estate ───────────────────────────────────────────
# OFF unless `secrets/auth.yaml` exists. tokera.com is a public site: the home
# page, the blog and the papers need no account, so a missing key must not stop
# them being served. With no auth config, `/auth/me` reports
# `configured: false` and the UI shows no sign-in button at all.
#
# Turn it on and it becomes strict — a missing or unreadable secret is then a
# hard startup failure, because at that point you have said you want sign-in
# and a gateway that quietly has none is the worse outcome. `web --check`
# reports it without binding anything.
#
# What it does when on: the gateway runs the OIDC exchange and issues a session
# cookie on the PARENT domain, so signing in at tokera.com is already signed in
# at code.tokera.com and bot.tokera.com — the browser presents the cookie to
# each of them and no daemon runs an OIDC exchange of its own. The gateway then
# asserts that identity downstream on `X-Tokera-*`, stripping any inbound copy
# of those headers before setting its own.
#
# Those headers are cleared from every inbound request first — by this gateway,
# and again inside each daemon, since a daemon embedding its API as
# `upstream: local` would otherwise be handed the client's own. A daemon opts
# back in by calling `web::Builder::behind_gateway`, which asserts that its bind
# address is reachable through the gateway and nothing else. Nothing verifies
# that claim, so keep such a daemon on a private interface.
#
# **No secret is shared with any daemon.** There is deliberately no session key
# to copy to `npcd` or `zend`: the session cookie signs sessions for the whole
# estate, so handing it to a daemon would let a compromised one mint identities
# at every hostname. This file is the gateway's alone.
#
# ── where the sign-in config lives ──────────────────────────────────────────
# In `secrets/auth.yaml`, not here — and the file being absent is what turns
# sign-in off, exactly as a commented-out block used to.
#
# It is a separate file because THIS one must be identical on every machine.
# When the block was inline, the one deployment holding a real `client_id`
# carried a permanently modified `web.yaml`, and every attempt to update the
# site table there stopped with *your local changes would be overwritten* — on
# a file whose only deployment-specific part was those four lines. Splitting
# them out means the sites can be pulled and the credentials never move.
#
# Present but unparseable is still a hard startup failure: at that point the
# deployment has said it wants sign-in, and a gateway that quietly has none is
# the worse outcome. `web --check` reports which of the three you are in
# without binding anything.
auth_file: "secrets/auth.yaml"

# Paths inside it resolve against THIS FILE, like `roots` and `papers`, so keep
# them relative and one table works on a laptop and on the DMZ box. Both
# secrets are files rather than inline values, so even `auth.yaml` carries none.
#
#   mkdir -p web/secrets
#   # any 32+ bytes; on Windows:
#   #   [Convert]::ToBase64String((1..48|%{Get-Random -Max 256})) > web/secrets/session.key
#   head -c 48 /dev/urandom | base64 > web/secrets/session.key
#   # client secret: Google Cloud console → APIs & Services → Credentials →
#   #                OAuth 2.0 Client ID, saved to web/secrets/google.secret
#   # redirect URI:  register it EXACTLY, or Google answers redirect_uri_mismatch
#
#   cat > web/secrets/auth.yaml <<'YAML'
#   cookie_domain: ".tokera.com"
#   session_ttl_hours: 720
#   session_secret_file: "secrets/session.key"
#   google:
#     client_id: "REPLACE-ME.apps.googleusercontent.com"
#     client_secret_file: "secrets/google.secret"
#     redirect_uri: "https://tokera.com/auth/callback"
#   YAML

sites:
  # ── tokera.com ──────────────────────────────────────────────────────────
  # The default site: any Host matching nothing else lands here. It has no
  # daemon — `web` is its backend, because the whole site is documents.
  #
  # `papers` is the directory its papers are read from, live. It is NOT a
  # content root: only documents named in content/tokera/papers.yaml are
  # reachable, so pointing it at the repo's docs/ publishes the papers rather
  # than the whole design directory.
  #
  # The routes below are the generated pages. Everything else on the site —
  # site.css, favicon.svg, and /base.css from the shared root — is a file,
  # which is why `/` is `exact`: a bare `/` prefix would swallow them all.
  - name: tokera
    default: true
    hosts: ["tokera.com", "tokera.localhost"]
    roots: ["content/tokera", "content/common"]
    papers: "../docs"
    api:
      - {prefix: /, exact: true, upstream: local}
      - {prefix: /blog, upstream: local}
      - {prefix: /papers, upstream: local}
      # Generated, not files — from the same walk that renders the index, so
      # they cannot fall behind it. `exact`, because they are single addresses
      # and a prefix would claim names beside them.
      - {prefix: /robots.txt, exact: true, upstream: local}
      - {prefix: /sitemap.xml, exact: true, upstream: local}

  # ── battlecities.net — the game's own site ──────────────────────────────
  # A handful of static files: a title image, a download link, and the icon set
  # the game already shipped. No daemon, no API, no generated pages — so it is
  # `roots` and nothing else, and a bare `/` finds `index.html` on its own.
  #
  # It was a `hosts:` entry on the tokera site until now, which meant it served
  # tokera's pages and tokera's brand mark. Two products cannot share one site
  # entry and keep separate identities: an icon is a file, so a shared root is a
  # shared icon however different the two brands are meant to look, and
  # battlecities.net wore the Tokera triskelion. Its own entry gives it the Zen
  # back. `roles.rs` asserts the split so it cannot quietly close again.
  #
  # The download link points at `battle-cities.exe`, which is not here. That is
  # the game's build output rather than repository content, so the link 404s
  # until a release is dropped alongside these files.
  - name: battlecities
    hosts: ["battlecities.net", "battlecities.localhost"]
    roots: ["content/battlecities"]

  # `www.` for the game, sent to the name without it — same reasoning as
  # `tokera-alt` below, and the same reason it is its own entry: a redirect site
  # has one target, and this one is not tokera.com.
  - name: battlecities-alt
    hosts: ["www.battlecities.net"]
    redirect: "https://battlecities.net"

  # ── bot.tokera.com — the NPC console ────────────────────────────────────
  # A pure gateway, like zend below: no roots, everything forwarded, navigation
  # included. The daemon on 192.168.0.6 owns its console — it serves those files
  # from disk already, with its own `fallback: index.html` for deep links.
  #
  # It used to serve the console from THIS box's checkout while forwarding only
  # `/v1` and `/ws`, which made the console and the daemon two deployments of
  # one program. Every console edit then needed a commit here and a pull there
  # before it could be seen, and the two could disagree silently — the console
  # was twice found running against an API it did not match, each time reading
  # as a bug in the daemon. One source, one deploy, and an edit on the daemon
  # box is live on a refresh.
  #
  # `/auth/*` is unaffected: those routes are registered ahead of site routing
  # precisely so a site proxying `/` cannot swallow them. Sign-in stays here.
  #
  # The cost is that `web --authoritative` can no longer stand in for this site,
  # for the same reason it cannot for zend — there are no roots left to serve
  # the console from, and the mock answers `/v1`, not `/app.js`. Run `npcd`
  # itself instead; it embeds the same mock behind the same console, which is
  # what `--authoritative` was standing in for.
  - name: npcd
    hosts: ["bot.tokera.com", "npcd.localhost", "npcd.test", "*.npcd.dev"]
    api:
      - prefix: /
        upstream: "http://192.168.0.6:8081"

  # ── code.tokera.com — Zend ──────────────────────────────────────────────
  # zend still embeds and serves its own assets, so this site is a pure
  # gateway: no roots, everything forwarded, navigation included. When zend is
  # split the same way as npcd, give it `roots: ["content/zend",
  # "content/common"]` and drop its embedded copy.
  #
  # It has no mock, so `--authoritative` cannot stand in for it — that is
  # reported at startup rather than discovered from an empty page.
  - name: zend
    hosts: ["code.tokera.com", "zend.localhost", "zend.test"]
    api:
      - prefix: /
        upstream: "http://192.168.0.5:8081"

  # ── the other Tokera names ──────────────────────────────────────────────
  # Every alternate domain for the brand, sent to the one that is the brand.
  #
  # **Redirected, not cloned**, and the difference matters. Serving the same
  # pages on six hostnames splits the name against itself: a search engine
  # picks one as canonical and the copies count for nothing, so the effect of
  # publishing six is to compete with yourself for the one result you want.
  # It also turns one deploy into six chances to serve a stale one. A `301`
  # does the opposite — every link, every bookmark and every typed address is
  # consolidated onto `tokera.com`, which is the only thing that makes a name
  # rank.
  #
  # The `www.` form of each is here too. They are separate hostnames as far as
  # DNS and a search engine are concerned, and a name that resolves but does
  # not answer is worse than one that does not resolve at all.
  #
  # These need DNS pointing here and a certificate covering them — Cloudflare
  # holds both, and a name absent from either fails before it reaches this
  # file.
  #
  # `tokera.com` itself is NOT in this list: it is the target. Its `www.` form
  # is, though — it was served rather than redirected, which is the same split
  # as any of the others. The pages already declare `tokera.com` canonical, so
  # nothing depended on `www.` answering with content; the `301` says the same
  # thing in the stronger way, and consolidates links rather than merely hinting
  # at where they should have pointed.
  #
  # Sign-in is unaffected. A redirect is resolved before routing, so a visitor
  # arriving at `www.` lands on the apex first and signs in there — which is the
  # only host Google will call back to anyway, since `redirect_uri` names it
  # exactly and a mismatch is refused at the provider.
  - name: tokera-alt
    hosts:
      - "www.tokera.com"
      - "tokera.com.au"
      - "www.tokera.com.au"
      - "tokera.info"
      - "www.tokera.info"
      - "tokera.net"
      - "www.tokera.net"
      - "tokera.sh"
      - "www.tokera.sh"
      - "tokera.co.uk"
      - "www.tokera.co.uk"
    redirect: "https://tokera.com"
