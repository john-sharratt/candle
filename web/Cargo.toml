[package]
name = "web"
version = "0.1.0"
edition = "2021"
description = "Content server + API gateway — authoritative when embedded in a daemon, a proxy when run on its own"

[[bin]]
name = "web"
path = "src/main.rs"

[lib]
name = "web"
path = "src/lib.rs"

# No candle, no CUDA, no model. This crate holds no application logic: sites are
# directories, APIs are either a merged Router or an upstream URL.
[dependencies]
anyhow     = { workspace = true }
clap       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tracing    = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

axum           = { version = "0.7", features = ["macros", "ws"] }
tower          = { version = "0.5" }
futures        = { workspace = true }
tokio          = { version = "1", features = ["full"] }
hyper          = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util     = { version = "0.1", features = ["client", "client-legacy", "server", "server-auto", "server-graceful", "http1", "http2", "tokio"] }
http-body-util = "0.1"
bytes          = "1"

# The TLS entrance: HTTP/3 over QUIC, with HTTP/2 and HTTP/1.1 over TCP for a
# client that cannot reach UDP. `ring` throughout, explicitly — the aws-lc
# backend needs cmake and NASM to build on Windows, and two providers linked
# into one process leave rustls with no default to pick.
rustls           = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls     = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
quinn            = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
h3               = "0.0.8"
h3-quinn         = "0.0.10"
# Certificates for the TLS entrance, issued by Let's Encrypt over ACME (HTTP-01)
# and renewed in place. `rcgen` makes each certificate's key and CSR; the
# parser reads back the names and expiry of what the store holds.
instant-acme     = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen", "time", "x509-parser"] }
x509-parser      = "0.18"
time             = "0.3"
# A certificate made at startup, for a daemon behind the gateway that serves the
# TLS entrance with no CA at all (`tls::self_signed`).
rcgen            = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# The proxy's side of an `https://` upstream. HTTP/1.1 only: a websocket is an
# HTTP/1.1 upgrade, and the proxy tunnels it after a 101. Verified against the
# Mozilla roots built into the binary, so no platform trust store is needed —
# and none can fail to load.
hyper-rustls     = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "logging", "webpki-roots"] }
include_dir    = { version = "0.7" }
mime_guess     = { version = "2" }
# Gzip for everything this server sends. Static files are compressed once in
# `asset.rs`; everything else on the way out in `compress.rs`, which streams and
# flushes per chunk so a proxied SSE stream is never held back.
flate2         = "1"

# Long-form content. Papers and posts are markdown files rendered on the way
# out — `latex2mathml` emits MathML, which every current browser lays out
# natively, so there is no maths bundle, no web fonts and no build step.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
latex2mathml   = "0.2"

# Sign-in. rustls rather than the default TLS so the DMZ box needs no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac    = "0.12"
sha2    = "0.10"
base64  = { workspace = true }
rand    = { workspace = true }

[dev-dependencies]
# A real websocket client for the `/ws/*` tests: the frames the console reads
# must survive framing, not merely leave the handler.
tokio-tungstenite = "0.24"
futures-util      = "0.3"
# `test-util`, for `#[tokio::test(start_paused = true)]`. Tokio's `full` leaves
# it out on purpose, so the dependency above cannot supply it. The mock console
# streams on a 1.4s/2.6s cadence chosen so a human can read the pane, and a test
# waiting on real ticks spends that cadence for every frame; a paused clock
# advances whenever the runtime idles, so the same frames arrive at once.
tokio             = { version = "1", features = ["full", "test-util"] }
# For `examples/prepare-images.rs` only — the site itself serves plain files and
# does no image work at runtime. `webp` on top of the workspace's jpeg/png
# because generated source art commonly arrives in that format; the *output* is
# always JPEG, so this is a decoder-side feature only.
image             = { workspace = true, features = ["webp"] }
# Stamping an mtime, so the render cache's invalidation can be tested without
# sleeping past the filesystem's timestamp granularity.
filetime          = "0.2"
tempfile          = { workspace = true }
