<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c98a3e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c98a3e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7.5" fill="#1a1714"/>
  <rect width="32" height="32" rx="7.5" fill="url(#glow)"/>
  <!-- Four-pointed sparkle with curved inward sides -->
  <path d="M16 2.5
    C 16.4,9.8  22.2,15.6 29.5,16
    C 22.2,16.4 16.4,22.2 16,29.5
    C 15.6,22.2  9.8,16.4  2.5,16
    C  9.8,15.6 15.6, 9.8 16, 2.5 Z"
    fill="#c98a3e"/>
  <!-- Hollow centre — adds depth and a hint of the eye/focus motif -->
  <circle cx="16" cy="16" r="3.2" fill="#1a1714" opacity="0.55"/>
</svg>
