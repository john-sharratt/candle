# keep — failsafe for the binaries on this machine.
# The last known-good executable is keep/stable/<name>. A switch is one
# request to 127.0.0.1:8092 whose body is the path of a staged executable.
# Run from the repository root:
#
#   target\release\keep.exe keep/keep.yaml

state: keep/state
# Listed on the gateway's cluster page as the app keep, and reached there by an
# Admin's operations tools: its state, a trial, a service's restart, stop or
# start (docs/claude_zend_gateway.md §8.4). No rollout.
#
# The gateway's socket URLs, space-separated, best first, as motherd's and
# mcp's: from this machine the public name hairpins out through the router and
# never reaches the gateway beside it, so the LAN name comes first.
cluster:
  url: "https://gateway.tokera.local:9443 https://gateway.tokera.com:9443"
  name: tokera.com
  group_key: web/secrets/group.key
  host: blackworld
services:
  - name: web
    stable: keep/stable/web.exe
    args: ["--config", "web/web.yaml"]
    cwd: D:/prog/candle
  - name: motherd
    stable: keep/stable/motherd.exe
    args: ["--config", "motherd/motherd.yaml"]
    cwd: D:/prog/candle
  - name: mcp
    stable: keep/stable/mcp.exe
    args: ["--config", "mcp/mcp.yaml"]
    cwd: D:/prog/candle
