# keep — failsafe for the binaries on this machine.
# The last known-good executable is keep/stable/<name>. A switch is one
# request to 127.0.0.1:8092 whose body is the path of a staged executable.
# Run from the repository root:
#
#   target\release\keep.exe keep/keep.yaml

state: keep/state
# Listed on the gateway's cluster page as the app keep, and reached there by an
# Admin's operations tools: its state, a trial, a service's restart, stop or
# start (docs/claude_zend_gateway.md §8.4). No rollout.
#
# The gateway's socket URLs, space-separated, best first, as motherd's and
# mcp's: from this machine the public name hairpins out through the router and
# never reaches the gateway beside it, so the LAN name comes first.
cluster:
  url: "https://gateway.tokera.local:9443 https://gateway.tokera.com:9443"
  name: tokera.com
  group_key: web/secrets/group.key
  host: blackworld
# Processes keep does not run that reserve this machine while they refuse
# (docs/house_modes.md §4): zenj, started at John's logon in the console
# session (docs/zenj.md §3.2), says `refuse` on its status while rekordbox is
# open. While it does, and for ten minutes after, nothing here is switched,
# restarted, stopped or tried. motherd steps aside by itself, and only while
# another member serves every app it does.
guards: ["127.0.0.1:8097"]
services:
  - name: web
    stable: keep/stable/web.exe
    args: ["--config", "web/web.yaml"]
    cwd: D:/prog/candle
  - name: motherd
    stable: keep/stable/motherd.exe
    args: ["--config", "motherd/motherd.yaml"]
    cwd: D:/prog/candle
  - name: mcp
    stable: keep/stable/mcp.exe
    args: ["--config", "mcp/mcp.yaml"]
    cwd: D:/prog/candle
  # The Battle Cities game server (docs/battlecities_app.md §3), built from its
  # own repository by the agent's checkout of it and run from that checkout,
  # whose build writes the `server_assets` it reads. Its world is kept outside
  # the checkout, seeded once from the checkout's `data` submodule, so a
  # deploy's fetch never touches a world being played. It joins the cluster as
  # the app `battlecities`, and serves HTTP 4080 and UDP 4300 and 4123 on this
  # machine for the gateway beside it.
  - name: battlecities
    stable: keep/stable/battle-cities-server.exe
    args:
      - "--data"
      - "D:/battle-cities/data"
      - "--seed-from"
      - "data"
      - "--state"
      - "D:/battle-cities/state"
      - "--cluster-url"
      - "https://gateway.tokera.local:9443 https://gateway.tokera.com:9443"
      - "--cluster-name"
      - "tokera.com"
      - "--group-key"
      - "D:/prog/candle/web/secrets/group.key"
      - "--host"
      - "blackworld"
    cwd: D:/agent/battle-cities
