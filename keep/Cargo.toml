[package]
name = "keep"
version = "0.1.0"
edition = "2021"
description = "Failsafe for web and motherd. Starts the stable executable and switches it on a loopback request, or on an Admin's request through the cluster."

[[bin]]
name = "keep"
path = "src/main.rs"

[dependencies]
anyhow       = { workspace = true }
cluster      = { path = "../cluster" }
cluster-dial = { path = "../cluster-dial" }
# keep's routes on its cluster socket, served to the streams a gateway opens.
http-body-util = "0.1"
hyper        = { version = "1", features = ["server", "http1"] }
hyper-util   = { version = "0.1", features = ["tokio"] }
rand         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
serde_yaml   = "0.9"
sysinfo      = { version = "0.31", default-features = false, features = ["system"] }
tokio        = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }
