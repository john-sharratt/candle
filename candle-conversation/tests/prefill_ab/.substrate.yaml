# Folder metadata for the Zen Code substrate.
#
# The daemon reads this file before it generates anything. Questions listed here
# are used as-is and are NOT regenerated — so hand-written questions win, and
# they survive `--wipe-substrate`.
#
# The `questions` are what makes this folder findable. They are the queries a
# developer would type whose ANSWER is this folder, written by someone who has
# NOT yet found it: no paths, no file names, no "this folder".
#
#   locational   where something lives
#   mechanistic  how something works
#   conceptual   what a name means
#   systemic     the same subject in plain English, no jargon at all
#
# Delete a list to have the daemon regenerate it. `--wipe-metadata` deletes every
# one of these files and starts over.
folder:
  path: candle-conversation/tests/prefill_ab/
  distinctive_terms:
  - GPU_SERIAL
  - case_for_layer
  - apply_k_profile
  - bench_prefill_table
  - bench_spec
  - reset_to_prefix
  - EDGE_LENS
  - build_case
  - run_golden_scenario
  - host_to_bhtd
  - out_f32
  - bench_prefill
  - f16_unit
  - host_to_flat
  - substrate_source
  - RecoveredPrefix
  - bench_spec_level
  - apply_v_profile
  - rope_rotate
  - SeqSpec
  - seal_segment
  - run_kernel_scenario
  - next_u64
  - load_largest_turn
  - bind_cache
  - BuiltCase
  - prefix_len
  - SUBSTRATE_DIR
  content_hash: e00b1fc9ef9d3d056d551a756f7cf4dc0e8cb446b4aa6b0c6870f7e7de875e12
questions:
  locational:
  - Where is run_kernel_scenario implemented?
  - Which code defines SeqSpec for a prefill case?
  - Where does seal_segment close a built case?
  - Where is rope_rotate applied in the harness?
  - Which code implements load_largest_turn?
  - Where is bind_cache called before a kernel run?
  - Where is prefix_len computed for a built case?
  mechanistic:
  - How does the harness compare two prefill kernels for bitwise equality?
  - How is a deterministic sequence generated for a case?
  - How does the harness bind a cache before running a kernel?
  - How is the largest stored turn chosen as a realistic input?
  - How does the harness isolate a kernel from the rest of the engine?
  - What makes a run reproducible between invocations?
  conceptual:
  - What is an A/B prefill comparison?
  - What is a BuiltCase?
  - What is a SeqSpec?
  - What does golden mean in this harness?
  - Why does this harness need bitwise determinism rather than tolerance?
  - What does binding a cache mean before a kernel run?
  systemic:
  - How is a new attention kernel proved equivalent to the old one?
  - Where are kernels compared against a known-good reference?
  - What catches a numerical regression in the prefill path?
  - How is a kernel tested on realistic rather than synthetic input?
  - Where would I look to verify a kernel change is safe?
  - How is bit-for-bit reproducibility checked?
