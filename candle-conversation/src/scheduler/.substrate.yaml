# Folder metadata for the Zen Code substrate.
#
# The daemon reads this file before it generates anything. Questions listed here
# are used as-is and are NOT regenerated — so hand-written questions win, and
# they survive `--wipe-substrate`.
#
# The `questions` are what makes this folder findable. They are the queries a
# developer would type whose ANSWER is this folder, written by someone who has
# NOT yet found it: no paths, no file names, no "this folder".
#
#   locational   where something lives
#   mechanistic  how something works
#   conceptual   what a name means
#   systemic     the same subject in plain English, no jargon at all
#
# Delete a list to have the daemon regenerate it. `--wipe-metadata` deletes every
# one of these files and starts over.
folder:
  path: candle-conversation/src/scheduler/
  distinctive_terms:
  - MigrateSample
  - spec_chooser
  - per_block_kv_bytes
  - WaveSample
  - MemoryReport
  - push_wave
  - LOAD_SETPOINT_DIVISOR
  - take_housekeeping_split
  - RELIEF_OVERSHOOT_REGIONS
  - REPREFILL_WRITE_US
  - complete_wave_group
  - inject_stencil_prefills
  - fail_wave_group
  - note_reprefill_split
  - WaveSnapshot
  - cut_budget
  - PlannedIsland
  - commit_decoded_tokens
  - REPREFILL_TRUNC_US
  - foreground_decode_width
  - prefill_cost_bytes
  - finalize_done_section_ingests
  - PhaseWindow
  - RING_MAX_LEN
  - ingest_warm_backlog_pct
  - log_injected_tokens
  - log_kv_memory
  - KvClassRow
  content_hash: bf25b4c8b881a2d7eba8e1e3f175aea20c72d7c8308c84e630df58be04ea75b8
questions:
  locational:
  - Where is LOAD_SETPOINT_DIVISOR defined and used?
  - Which code completes a wave group once every sequence has decoded?
  - Where does inject_stencil_prefills add its turns to a wave?
  - Where is foreground_decode_width decided?
  - Which part of the code computes prefill_cost_bytes before admission?
  - Where does cut_budget shrink the admitted work for a wave?
  - Where is RELIEF_OVERSHOOT_REGIONS consulted?
  - Which code builds a PlannedIsland?
  - Where does commit_decoded_tokens write results back?
  - Where is the housekeeping split recorded for the timing log?
  - Which code handles fail_wave_group when a forward errors?
  - Where is ingest_warm_backlog_pct measured?
  mechanistic:
  - How does a wave group decide it is complete?
  - What happens to the other sequences when fail_wave_group fires mid-wave?
  - How does cut_budget choose what to drop when memory is short?
  - How is foreground_decode_width traded against ingest work?
  - How does prefill_cost_bytes estimate a prefill before it runs?
  - What does inject_stencil_prefills do to the shape of the next forward?
  - How does the RING_MAX_LEN bound affect queued work?
  - How is a PlannedIsland turned into an actual forward?
  - How does the loop keep decode and prefill from starving each other?
  - What happens when the warm backlog grows faster than it drains?
  - How does LOAD_SETPOINT_DIVISOR damp the admission response?
  - How are decoded tokens committed atomically for a whole wave?
  conceptual:
  - What is a wave group?
  - What is a PlannedIsland and why is it planned separately?
  - What does LOAD_SETPOINT_DIVISOR control?
  - What is the difference between foreground decode and ingest work here?
  - What does a WaveSnapshot capture?
  - What is the housekeeping split measuring?
  - What does RELIEF_OVERSHOOT_REGIONS bound?
  - What is a PhaseWindow in the wave loop?
  - What does cut_budget mean by budget?
  - Why does the scheduler need prefill_cost_bytes before admitting work?
  - What is the warm backlog, and why is its percentage tracked?
  - What does RING_MAX_LEN limit?
  systemic:
  - How does the system run many conversations at once without them interfering?
  - What decides how much work is attempted in one pass over the model?
  - How does the assistant stay responsive while it is also reading a codebase?
  - What happens when too much work is submitted and memory runs short?
  - Where would I look to understand why generation slowed down under load?
  - How is work batched together to make better use of the graphics card?
  - What stops a large background job from starving an interactive request?
  - How does the system recover when one request in a batch fails?
  - Where are the decisions made about how many requests run in parallel?
  - What limits how far ahead work can be queued?
  - How does the system measure where its time is actually going per pass?
  - What would I tune to trade throughput for latency?
