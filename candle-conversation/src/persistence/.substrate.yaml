# Folder metadata for the Zen Code substrate.
#
# The daemon reads this file before it generates anything. Questions listed here
# are used as-is and are NOT regenerated — so hand-written questions win, and
# they survive `--wipe-substrate`.
#
# The `questions` are what makes this folder findable. They are the queries a
# developer would type whose ANSWER is this folder, written by someone who has
# NOT yet found it: no paths, no file names, no "this folder".
#
#   locational   where something lives
#   mechanistic  how something works
#   conceptual   what a name means
#   systemic     the same subject in plain English, no jargon at all
#
# Delete a list to have the daemon regenerate it. `--wipe-metadata` deletes every
# one of these files and starts over.
folder:
  path: candle-conversation/src/persistence/
  distinctive_terms:
  - write_offset
  - CRC32_TABLE
  - set_last_index
  - has_stream
  - ContentHash
  - segmented_log
  - plan_chunked_read
  - read_into
  - pending_len
  - direct_file
  - stream_id
  - LogFile
  - write_npc
  - put_i32
  - stamp_warm
  - read_record
  - flat_chunk_index
  - plan_units
  - ReadWork
  - COMPACTION_MIN_LOG_BYTES
  - parse_segment
  - put_f32
  - RawReloc
  - crc32_init
  - load_turn_into_hot
  - last_maintenance
  - COMPACTION_DEAD_RATIO_THRESHOLD
  - put_blob
  content_hash: b97b3e07f2032b1bca78f04b96ff6a460bb6a4bfd6da39e18ccfad0256c78fec
questions:
  locational:
  - Where is the redo log's LogFile opened and appended to?
  - Which code implements plan_chunked_read?
  - Where does read_record parse one entry back out of the log?
  - Where is COMPACTION_DEAD_RATIO_THRESHOLD checked?
  - Which part of the code performs load_turn_into_hot?
  - Where does parse_segment decide a segment file is valid?
  - Where is crc32_init used when writing a record?
  - Which code schedules ReadWork for a chunked read?
  - Where does stamp_warm mark a residence as warm-tier?
  - Where is last_maintenance tracked between passes?
  - Which code writes a blob with put_blob?
  - Where is flat_chunk_index built?
  mechanistic:
  - How does plan_chunked_read turn a request into ReadWork units?
  - What happens when a segment file fails its checksum on reload?
  - How does compaction decide a segment is worth rewriting?
  - How is a turn brought back from cold storage into the hot tier?
  - How does the log stay append-only while still reclaiming space?
  - What ordering guarantees does the writer give across records?
  - How does stamp_warm interact with a later cold write?
  - What happens if the daemon dies midway through writing a record?
  - How does COMPACTION_MIN_LOG_BYTES stop pointless rewrites?
  - How are chunk reads batched so the disk is not hit per chunk?
  - How does reload rebuild state without re-tokenising every turn?
  - What keeps a distilled turn's signature after its text is dropped?
  conceptual:
  - What is the redo log and what does it guarantee?
  - What is a segment, and why is the log split into them?
  - What does ReadWork represent?
  - What is the difference between the warm and cold tiers here?
  - What does compaction reclaim?
  - What is a RawReloc used for?
  - What does load_turn_into_hot mean by hot?
  - What is the flat chunk index for?
  - Why does every record carry a checksum?
  - What does last_maintenance record?
  - What is a residence in this design?
  - Why is persistence mandatory rather than optional here?
  systemic:
  - How does the assistant remember conversations across a restart?
  - Where is long-term memory actually written to disk?
  - How does the system reclaim disk space without losing history?
  - What happens to memory that has not been used for a long time?
  - How does a restart pick up exactly where the last run stopped?
  - What protects stored history from corruption if the process is killed?
  - Where would I look to understand why the store keeps growing?
  - How is old material moved off the graphics card but kept available?
  - What guarantees that a saved conversation can be read back correctly?
  - How does the system avoid rereading everything at startup?
  - Where are the trade-offs between memory, disk and speed decided?
  - What happens on disk when a conversation is deleted?
