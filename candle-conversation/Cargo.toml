[package]
name = "candle-conversation"
version.workspace = true
edition.workspace = true
description = "Turn-based conversation engine for the candle inference stack"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
# candle-conversation is **CUDA-only**: the substrate, the bg-quantizer,
# the cold-load bridge, and the scheduler all assume a CUDA device.
# The candle stack is forced into cuda mode through these dep features;
# there is no longer a `cuda` Cargo feature on this crate.
ahash = { workspace = true }
base64 = { workspace = true }
candle = { workspace = true, features = ["cuda"] }
candle-kernels = { workspace = true }
candle-nn = { workspace = true, features = ["cuda"] }
candle-transformers = { workspace = true, features = ["cuda", "ruler-bench"] }
crossbeam = { workspace = true }
cudarc = { workspace = true }
# Caller↔scheduler channels (SchedulerRequest queue, TurnEvent streams, one-shot replies,
# guest receipts): one flume channel serves blocking and async receivers alike with no
# runtime dependency (docs/async_wave_submission.md §3.1). crossbeam stays for the
# engine-internal threads (persistence, summariser, writer pipeline).
flume = { workspace = true }
# Names the `Stream` trait `TurnHandle::stream_async` returns. A trait crate, not a
# runtime — the executor stays the embedder's choice.
futures-core = { workspace = true }
fs2 = { workspace = true }
# PNG encoding for the image guest's output. The guest hands the caller bytes
# rather than a tensor: the pixels live in a buffer the drain's give-back
# invalidates, so they have to be encoded before the ground goes back.
image = { workspace = true }
# The matte guest's network is a published ONNX export, not a checkpoint with
# named tensors — see `src/guest/matte.rs` for why it is evaluated as it
# shipped rather than rebuilt as candle modules. Its weights still land in
# ground like every other guest's.
candle-onnx = { path = "../candle-onnx", version = "0.9.1" }
memmap2 = { workspace = true }
rayon = { workspace = true }
tempfile = { workspace = true }
hf-hub = { workspace = true, optional = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = "0.10"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
thiserror = { workspace = true }
tokenizers = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
half = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
# `executor::block_on` (the current-thread executor the async-API tests run on)
# and `StreamExt` for draining `stream_async`. Test-only: the crate itself
# depends on no executor.
futures = { workspace = true }
half = { workspace = true }
hf-hub = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap.workspace = true
clap-verbosity-flag.workspace = true
term_size = { workspace = true }

# Crate-wide clippy lint policy.  These four lints are deliberately
# silenced because the patterns they flag are systemic to the design
# (deeply nested projection / scheduler types, wide function
# signatures on engine + scheduler entry points, etc.) — see the
# rationale comment in `src/lib.rs`.  Setting it here rather than
# per-file means the integration test crates under `tests/` inherit
# the same policy.
[lints.clippy]
doc_lazy_continuation = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"

[features]
default = []
# Feature-gated, zero-cost scoped timing of the projection / reproject hot path
# (see `scheduler::profile`). Emits an aggregated, sorted-by-cost breakdown.
# Also enables candle-transformers' per-op pipeline profile (attn_core, mlp_ffn,
# gemm_*) so the gap-fill forward's internal breakdown can be dumped.
profile = ["candle-transformers/profile"]
# `Tensor::assert` / `QTensor::assert` — see `candle-core/Cargo.toml`.
tensor-assert = ["candle-transformers/tensor-assert"]
# Report every device allocation that reaches the CUDA driver while a wave is
# running — the ones the bump arena was supposed to serve. The span is sized for
# the arena's budget, so an allocation outside it is memory the reservation was
# never told about, and on WDDM the overflow is demoted to host RAM rather than
# refused. Off by default; `record` is an inlined no-op without it.
forbidden_allocations = ["candle-transformers/forbidden_allocations"]
# Scans gathered R16 K/V for all-zero tokens at the decode reprojection gather,
# the pre-finalize view, the seal-write to the substrate, and projection inject,
# emitting a `tracing::error` (target `kv_zero`) per dead token. Off by default;
# each hook does an extra provenance gather so it is debug-only. CUDA-only (the
# gather is a CUDA path). See `scheduler::kv_zero_check`.
kv-zero-check = []
# Records the per-slot token stream (every injected section, every
# projected turn, prefilled user text, decoded tokens, post-decode
# tail) and emits a `=== KV cache token dump (turn complete) ===`
# trace at the end of each turn under the
# `candle_conversation::scheduler::context_dump` target.  Useful for
# diagnosing prompt/format/role-marker bugs; off by default because
# the per-token recording allocates and the dump itself is large.
context-dump = []
hub = ["dep:hf-hub"]
# Exposes test-introspection methods (warm_pool, warm_turn_slots,
# hot/warm_turn_ids_sorted, tiered_store()) that are otherwise hidden from the
# public API.  Enable with --features test-helpers in integration-test runs.
test-helpers = []

[[example]]
name = "chat"
required-features = ["hub"]

[[example]]
name = "tree_gen"
required-features = ["hub"]

[[example]]
name = "ruler_stream"
required-features = ["hub"]

[[example]]
name = "substrate_inspect"

[[test]]
name = "prefill_ab"
path = "tests/prefill_ab/main.rs"
