[package]
name = "candle-transformers"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
byteorder = { workspace = true }
candle = { workspace = true }
ahash = { workspace = true }
candle-flash-attn = { workspace = true, optional = true }
candle-kernels = { workspace = true, optional = true }
candle-nn = { workspace = true }
cudarc = { workspace = true, optional = true }
fancy-regex = { workspace = true }
float8 = { workspace = true }
half = "2.3.1"
intel-mkl-src = { workspace = true, optional = true }
memmap2 = { workspace = true }
num-traits = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_plain = { workspace = true }
# Binary fixture (de)serialization: the offline MoE-predictor routing-trace eval
# and the paged-prefill kernel-replay capture (models::prefill_capture).
bincode = "1.3"
tracing = { workspace = true }
tokenizers = { workspace = true, optional = true }

[dev-dependencies]
hf-hub = { workspace = true }
tokenizers = { workspace = true }
# `env-filter` so the gate's subscriber takes its level and targets from
# RUST_LOG. Without it the only thing expressible is a hard max level, which
# cannot reach a per-target `debug` — and the elastic boundary reports every
# move at debug, so a residency collapse becomes unattributable.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
flate2 = "1.1"
# Direct HTTP client for the IPv6->IPv4 download fallback (test_helpers::hf_get).
# native-tls matches hf-hub's backend (uses the system cert store).
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }

[features]
default = []
accelerate = ["dep:accelerate-src", "candle/accelerate", "candle-nn/accelerate"]
cuda = ["candle/cuda", "candle-nn/cuda", "dep:cudarc", "dep:candle-kernels"]
# Kernel source-line info for `compute-sanitizer`/`cuda-gdb`. One debugging
# session, not a default — see `candle-kernels/Cargo.toml`.
kernel-lineinfo = ["cuda", "candle/kernel-lineinfo", "candle-nn/kernel-lineinfo"]
forbidden_allocations = [
    "candle/forbidden_allocations",
    "candle-nn/forbidden_allocations",
]
verbose = ["candle-nn/verbose"]
cudnn = ["candle/cudnn", "candle-nn/cudnn"]
flash-attn = ["cuda", "dep:candle-flash-attn"]
mkl = ["dep:intel-mkl-src", "candle/mkl", "candle-nn/mkl"]
metal = ["candle/metal", "candle-nn/metal"]
profile = []
# NVTX range annotations on the pipeline spans, so an nsys trace attributes every
# kernel to the span that launched it (`nsys stats --report nvtx_kern_sum`).
# Deliberately separate from `profile`: that one costs an `Instant` plus a
# `RefCell` borrow per span and prints the summary table, this one costs a driver
# call and annotates the trace. A capture run wants the second without the first.
#
# Backed by a compiled NVTX3 shim in candle-kernels, NOT by a Rust NVTX binding:
# NVTX3 is header-only and the `nvToolsExt` import library was dropped in the
# CUDA 12 series, so a binding that emits `link-lib=nvToolsExt` (cudarc's `nvtx`
# feature does) fails at link on every toolkit installed here.
nvtx = ["cuda"]
huge-context = []
ruler-bench = ["dep:tokenizers"]
