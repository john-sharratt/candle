# An archetype, as authored.
#
# Two fields and they are not the same kind of thing:
#
#   core_identity  the immutable core an NPC of this kind is spawned with.
#                  Never propagates to a living NPC — changing it changes who
#                  the NEXT one is, not who the existing ones have become.
#
#   doctrine       the only part that propagates. Existing NPCs pick up a new
#                  doctrine at next spawn or fork refresh, which is why it
#                  carries a version.
#
# Lived experience never aggregates back up into here. An archetype is what a
# character starts as; the substrate is what it turned into.

name: Loyal Soldier

core_identity: >-
  Betrayal is unforgivable. Orders are a contract, not a request.

doctrine_version: 4
doctrine: >-
  Flank at 2:1 or not at all. Cross open ground only with a fallback named.
