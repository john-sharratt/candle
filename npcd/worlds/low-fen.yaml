# A second world, so the picker has something to pick between and so the
# per-world overrides above are visibly per-world rather than global.

name: Low Fen
public: true

setting: >-
  Salt marsh and causeway towns a week south of the frontier, rich on a trade
  the war made necessary and peace has not yet made unprofitable. Nobody here
  fought. Everybody here sold something to someone who did.

# Flat country and short sightlines: a strategic band would be a band with
# nothing in it, so this world does not declare one.
zoom_bands:
  - regional
  - tactical
  - local

templates:
  responses: default
  moods: default
