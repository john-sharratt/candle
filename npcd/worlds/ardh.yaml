# A world, as authored.
#
# This file is the world. It is read once at daemon start and answered from
# memory thereafter; saving from the GUI rewrites it here, so a world edit is a
# diff in this repository and survives a substrate wipe.
#
# What is NOT here: the narrative clock. `world_ms` advances continuously — at
# 60× it moves a minute per real second — and putting it in a committed file
# would leave the working tree permanently dirty and every `git status` noisy.
# The world's *definition* is config; the world's *time* is runtime, and lives
# with the substrate.
#
# NPCs are not here either, and never will be. They are lived experience.

name: Ardh
public: false

# The shared world knowledge every character in Ardh reads. This is the
# immutable core — editing it changes what all of them know.
setting: >-
  A kingdom of hill villages on a northern frontier, three years after a war
  nobody won. Roads are unsafe after dark. The crown is distant and the
  garrisons are underpaid.

# The `zoom` values perception maps may declare, per world rather than
# hardcoded: a city game and a campaign game want different granularities.
zoom_bands:
  - strategic
  - regional
  - tactical
  - local

# Per-world overrides shadowing the engine defaults. `default` uses the shared
# template; `override` means this world carries its own.
templates:
  responses: override
  moods: default
