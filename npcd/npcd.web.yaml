# ============================================================================
# npcd — the standalone site table.
#
# Compiled into the binary with include_str!, so `npcd` needs no config file on
# disk and no second process: one executable serves the console and answers its
# own API. That is what makes the daemon testable by itself.
#
# The difference from the DMZ deployment (web/web.yaml) is one word per route:
# `upstream: local` dispatches into the axum Router this process built, instead
# of opening a socket to another machine. Promoting a site from local to remote
# is an edit, not a migration.
#
# There are no `roots` here because the content is compiled in too — main.rs
# hands the embedded `content/npcd` + `content/common` directories to the
# builder, or a directory on disk when `--content` is given for live editing.
# ============================================================================

server:
  bind: "127.0.0.1:8081"
  cache_control: "no-store"

# ----------------------------------------------------------------------------
# Roles.
#
# Three levels — unauthenticated, user, admin — and they are how the daemon
# decides everything. Reading is open; **only an admin may change authored
# content on disk** (worlds, personalities), because those are files in a mind
# that is not under version control and a bad write is not recoverable.
#
# Admin is deployment configuration, not a user record, and there is no API to
# grant it. Whoever can edit this file and restart the process is already the
# person who can edit the files it grants power over, so a database row would
# be a weaker way to grant the same thing.
#
# An entry says which field it matches. `sub` is Google's subject id: opaque,
# and the key every account here is stored under, so it survives an email
# change. `email` is readable and inherits whatever reassignment risk the
# provider has. Both are exact (email case-insensitively); nothing is guessed.
#
# An empty list means nobody can edit anything, which is the right way for a
# misconfigured deployment to fail.
# ----------------------------------------------------------------------------
# Matched on `email` and not `sub`, deliberately, because THIS REPOSITORY IS
# PUBLIC.
#
# `sub` is the durable half — it survives an email change, and it is the key
# every account here is stored under. It is also a stable identifier for a real
# Google account, and `npcd/.gitignore` excludes `accounts/` for exactly that
# reason: "git history is the one place you cannot quietly remove something from
# later, so the decision has to hold before the first write". A subject id
# committed here would be published permanently, which is the same mistake with
# a different file name.
#
# The email is already public — it is the author address on every commit in this
# repository — so naming it costs nothing that is not already spent, and it
# grants exactly the same access.
#
# The trade is that admin follows the address rather than the account: change
# the email at the provider and this line stops matching until it is edited. For
# one admin on a personal estate that is a line in a file, not an outage.
roles:
  admins:
    - email: johnathan.sharratt@gmail.com

sites:
  - name: npcd
    default: true
    fallback: "index.html"
    api:
      - prefix: /v1
        upstream: local
      - prefix: /ws
        upstream: local
