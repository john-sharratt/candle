# The MCP aggregator on BlackWorld, beside the gateway, under keep
# (docs/mcp_app.md §5, §6). WhiteWorld runs `mcp.whiteworld.yaml`. Run from
# the repository root:
#
#   target\release\mcp.exe --config mcp/mcp.yaml

# Where it listens: loopback only. The gateway's `/mcp` route names this as
# its upstream, which answers while no `mcp` member is joined.
bind: "127.0.0.1:8095"

# The peers on that listener whose X-Tokera-* identity is believed: the
# gateway, which proxies to this loopback address and so arrives from loopback.
trusted_gateways: ["127.0.0.1"]

# The gateway's entrance every backend is reached through, as the caller: the
# caller's own token rides each call, which the gateway honours from loopback
# (`server.trusted_backends` in web/web.yaml).
gateway: "http://127.0.0.1"

# The cluster it joins as the app `mcp`: the gateway sends `/mcp` to its
# members in turn, over the socket each dialled.
cluster:
  urls: "https://gateway.tokera.local:9443 https://gateway.tokera.com:9443"
  name: tokera.com
  group_key: web/secrets/group.key
  host: blackworld

# Where its node is kept.
state: "mcp/state"

# The card and backends every machine serves, beside this file.
served: served.yaml
