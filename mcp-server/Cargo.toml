[package]
name = "mcp-server"
version = "0.1.0"
edition = "2021"
description = "An MCP server, once: JSON-RPC, both protocol eras, sessions, the sign-in challenge and progress over an event stream — mounted by zend, npcd and the mcp aggregator, each with its own tools"

[dependencies]
anyhow       = { workspace = true }
axum         = { version = "0.7" }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing      = { workspace = true }
web          = { path = "../web" }

[dev-dependencies]
tempfile = "3"
tokio    = { version = "1", features = ["full"] }
tower    = { version = "0.5", features = ["util"] }
