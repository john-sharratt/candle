<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zend</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="common/base.css">
<link rel="stylesheet" href="common/lib/estate.css">
<style>
  /* Only what the design system does not already say.
     The previous version of this page redeclared the entire palette — forty
     custom properties — and then mirrored the app's theme by applying
     `invert(1) hue-rotate(180deg)` to the document before paint, because it was
     a standalone page that could not reach the app's tokens. Both are gone:
     it uses `common/base.css` like every other page, so the theme is the
     theme. */
  .kpis {
    display: grid; gap: 12px; margin-bottom: 16px;
    grid-template-columns: repeat(auto-fit, minmax(196px, 1fr));
  }
  .kpi { position: relative; overflow: hidden; padding-left: 16px; }
  .kpi .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .kpi .val { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
  .kpi .val small { font-size: .72rem; font-weight: 600; opacity: .7; }
  .kpi .lab { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em;
              color: var(--ink-faint); font-weight: 700; margin-bottom: 4px; }
  .kpi .meter { height: 3px; border-radius: 2px; background: var(--line-2); margin-top: 9px; overflow: hidden; }
  .kpi .meter i { display: block; height: 100%; border-radius: 2px; }
  .st-ok { color: var(--ok); } .bg-ok { background: var(--ok); }
  .st-warn { color: var(--warn); } .bg-warn { background: var(--warn); }
  .st-crit { color: var(--crit); } .bg-crit { background: var(--crit); }
  .verdict { border-left: 3px solid var(--accent); line-height: 1.7; }
  .verdict b { color: var(--ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; font-size: .72rem; color: var(--ink-faint); }
  .legend i { display: inline-block; width: 11px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .stale { opacity: .55; transition: opacity .2s; }
</style>
</head>
<body>
<header class="topbar">
  <div id="estate"></div>
  <nav class="nav">
    <a class="navlink" href="/">Chat</a>
    <a class="navlink" href="perf.html" aria-current="page">Telemetry</a>
    <a class="navlink" href="logs.html">Logs</a>
  </nav>
  <span class="spacer"></span>
  <div class="row" id="chrome"></div>
</header>

<main class="page wide" id="page"></main>

<script type="module">
/* Zend's wave and pressure telemetry, rebuilt on the shared framework.
 *
 * Same four endpoints as before, polled together every four seconds:
 *   /v1/telemetry  waves, format mix, migrations, host RAM
 *   /v1/phases     the scheduler's per-wave phase ring, ages relative to now
 *   /v1/promotes   what got promoted, by name
 *   /v1/memory     the allocator's own view
 *
 * The three after the first are `.catch(() => null)`: a daemon that has not
 * instrumented one of them should grey a panel, never blank the page.
 *
 * What changed is everything below the data. Charts come from
 * `common/lib/chart.js` rather than six hundred lines of hand-rolled canvas —
 * the same DPR handling, hover readout and dual-axis support the npcd console
 * uses, so a fix to either lands on both.
 */
import { h, mount, fmtNum } from './common/lib/dom.js';
import { makeChart, makeStackChart } from './common/lib/chart.js';
import { estateSwitcher } from './common/lib/estate.js';

const POLL_MS = 4000;
const MiB = 1024;
const gib = (mib) => (mib || 0) / MiB;
const last = (a) => a[a.length - 1] || {};

/* One hue per scheduler phase, so the flip between small-batch decode and
 * large-batch prefill reads at a glance rather than by hunting a legend. */
const PHASES = ['decode', 'prefill', 'section', 'projection', 'sealing', 'eviction', 'allocation', 'blocked', 'sync', 'idle'];
const PH = {
  decode: 'var(--ok)', prefill: 'var(--info)', section: '#818cf8',
  projection: '#c084fc', sealing: 'var(--warn)', eviction: 'var(--crit)',
  allocation: '#94a3b8', blocked: '#ec4899', sync: '#e11d48', idle: 'var(--line-2)',
};

mount(document.getElementById('estate'), estateSwitcher('zend', { homeHref: '/' }));

/* ── state ──────────────────────────────────────────────────────────────── */

let W = [], FM = [], MG = [], PTS = [], PROM = [], HOST = {}, MEM = null;
let lastAt = 0;          // when the newest sample landed, for the age readout
let paused = false;
let failures = 0;

/* ── page ───────────────────────────────────────────────────────────────── */

const kpis = h('div', { class: 'kpis' });
const verdict = h('div', { class: 'panel verdict' }, 'waiting for the first sample…');
const age = h('span', { class: 'tiny dim' });
const live = h('span', { class: 'chip' }, 'connecting…');
const pauseBtn = h('button', { class: 'btn sm' }, '⏸ pause');

pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? '▶ resume' : '⏸ pause';
  pauseBtn.classList.toggle('primary', paused);
  document.getElementById('page').classList.toggle('stale', paused);
  if (!paused) refresh();
});

const cv = (id, hgt) => h('canvas', { id, height: hgt || 190 });
const cPhase = cv('c_phase', 230), cTok = cv('c_tok'), cPhRate = cv('c_phrate', 200);
const cBacklog = cv('c_backlog'), cWave = cv('c_wave'), cArena = cv('c_arena');
const cVram = cv('c_vram', 200), cMig = cv('c_mig', 200), cProj = cv('c_proj'), cSlots = cv('c_slots');
const promoteList = h('div', {});

const card = (title, cap, ...body) => h('div', { class: 'panel' },
  h('h3', { style: 'margin-top:0' }, title),
  h('div', { class: 'tiny dim', style: 'margin-bottom:10px', html: cap }),
  ...body);

const phLegend = h('div', { class: 'legend' }, ...PHASES.map((k) =>
  h('span', {}, h('i', { style: `background:${PH[k]}` }), k)));

mount(document.getElementById('page'),
  h('div', { class: 'hd' },
    h('div', {}, h('h1', {}, 'Telemetry'),
      h('div', { class: 'sub' }, 'Where the scheduler’s wall-clock goes, and how close the card is to its wall.')),
    h('div', { class: 'row' }, live, age, pauseBtn)),
  kpis,
  verdict,
  h('div', { class: 'panel' },
    h('h3', { style: 'margin-top:0' }, 'Phase timeline — last 2 minutes'),
    h('div', { class: 'tiny dim', style: 'margin-bottom:10px', html:
      'One bar per wave, newest on the <b>right</b>. Height is time spent in each phase, stacked — so a tall '
      + '<b>projection</b>, <b>sync</b> or <b>idle</b> segment is time <i>not</i> spent generating. Watch the flip '
      + 'between small-batch decode and large-batch prefill.' }),
    phLegend, cPhase),
  h('div', { class: 'grid g2' },
    card('Token throughput',
      'End-to-end tokens per second — tokens ÷ wave wall-time. Falls when the migration drain takes the shared '
      + 'stream from prefill under pressure.', cTok),
    card('Phase throughput',
      'Tokens per second <b>per phase</b>. Two scales: <b>left</b> is large-batch prefill and section, '
      + '<b>right</b> is decode — otherwise single-sequence decode flat-lines under prefill.',
      h('div', { class: 'legend' },
        h('span', {}, h('i', { style: `background:${PH.prefill}` }), 'prefill — left'),
        h('span', {}, h('i', { style: `background:${PH.section}` }), 'section — left'),
        h('span', {}, h('i', { style: `background:${PH.decode}` }), 'decode — right')),
      cPhRate)),
  h('div', { class: 'grid g2' },
    card('Drain backlog',
      'Un-migrated hot KV waiting on the persist thread. Spikes are normal; a sustained climb is not.', cBacklog),
    card('Wave timing', 'Wall-clock per wave against the forward pass inside it. The gap is overhead.', cWave)),
  h('div', { class: 'grid g2' },
    card('VRAM', 'Whole-card occupancy: KV reserved against the driver’s total, and the free headroom left.', cVram),
    card('Arena mix', 'Resident KV by format — quantized against float. Quantized should dominate under pressure.', cArena)),
  h('div', { class: 'grid g2' },
    card('Migration passes', 'How long a drain takes, and how much of it is compress-to-warm rather than the copy.', cMig),
    card('Projection cost', 'Where projection time goes: drain, re-projection, scan, layout.', cProj)),
  h('div', { class: 'grid g2' },
    card('Active work', 'Resident conversations, and the decode / prefill / section widths sharing them.', cSlots),
    card('Promotions', 'What the scheduler promoted, by name.', promoteList)));

/* ── charts ─────────────────────────────────────────────────────────────── */

const series = (data, color, label, extra) => ({ data, color, label, ...(extra || {}) });
const T = () => W.map((w) => w.t);
const charts = [];
const add = (c) => { if (c) charts.push(c); return c; };

/* Phase bars: one stacked column per wave over the last two minutes. `age` is
 * seconds before now, so the ring re-times itself on every poll and the newest
 * bar is always hard against the right edge. */
add(makeStackChart(cPhase, () => {
  const wins = new Map();
  for (const p of PTS) {
    if (p.age > 130) continue;
    const key = Math.round(p.age);
    if (!wins.has(key)) wins.set(key, { age: key, ph: {} });
    wins.get(key).ph[p.kind] = (wins.get(key).ph[p.kind] || 0) + p.dur;
  }
  const bars = [...wins.values()].sort((a, b) => b.age - a.age)
    .map((w) => ({ age: w.age, parts: w.ph }));
  return {
    bars, keys: PHASES,
    color: (k) => PH[k],
    yFmt: (v) => (v >= 1000 ? (v / 1000).toFixed(1) + 's' : v.toFixed(0) + 'ms'),
    xLabel: (b) => (b.age === 0 ? 'now' : '-' + b.age.toFixed(0) + 's'),
    tip: (b) => PHASES.filter((k) => b.parts[k])
      .map((k) => ({ t: `${k} ${b.parts[k].toFixed(0)}ms`, c: PH[k] })),
    emptyText: 'no phase samples yet',
  };
}));

add(makeChart(cTok, () => ({
  xs: T(),
  series: [series(W.map((w) => (w.ws > 0 ? w.tok / (w.ws / 1000) : 0)), 'var(--ok)', 'tok/s')],
  yFmt: fmtNum,
})));

/* Dual axis on purpose: prefill runs orders of magnitude above decode, and one
 * scale would draw decode as a flat line along the floor. */
add(makeChart(cPhRate, () => {
  const byMin = new Map();
  for (const p of PTS) {
    const m = Math.floor(p.age / 60);
    if (!byMin.has(m)) byMin.set(m, {});
    const e = byMin.get(m);
    e[p.kind] = e[p.kind] || { tok: 0, dur: 0 };
    e[p.kind].tok += p.tok; e[p.kind].dur += p.dur;
  }
  const mins = [...byMin.entries()].sort((a, b) => b[0] - a[0]);
  const rate = (e, k) => (e[k] && e[k].dur > 0 ? e[k].tok / (e[k].dur / 1000) : 0);
  return {
    xs: mins.map(([m]) => -m),
    series: [
      series(mins.map(([, e]) => rate(e, 'prefill')), PH.prefill, 'prefill'),
      series(mins.map(([, e]) => rate(e, 'section')), PH.section, 'section'),
      series(mins.map(([, e]) => rate(e, 'decode')), PH.decode, 'decode', { axis: 'r' }),
    ],
    y2: true, fmt: fmtNum, y2Fmt: fmtNum, y2Color: PH.decode,
  };
}));

add(makeChart(cBacklog, () => ({
  xs: T(), series: [series(W.map((w) => w.backlog), 'var(--info)', 'backlog (tok)')], yFmt: fmtNum,
})));

add(makeChart(cWave, () => ({
  xs: T(),
  series: [
    series(W.map((w) => w.ws), 'var(--accent)', 'wave (ms)'),
    series(W.map((w) => w.fwd), 'var(--ink-faint)', 'forward (ms)'),
  ],
  yFmt: (v) => v.toFixed(0) + 'ms',
})));

add(makeChart(cVram, () => ({
  xs: T(),
  series: [
    series(W.map((w) => gib(w.res)), 'var(--warn)', 'KV reserved (GiB)'),
    series(W.map((w) => gib(w.tot)), 'var(--ink-faint)', 'card total (GiB)'),
    series(W.map((w) => gib(w.free)), 'var(--ok)', 'free (GiB)'),
  ],
  yFmt: (v) => v.toFixed(1),
})));

add(makeChart(cArena, () => ({
  xs: FM.map((f) => f.t),
  series: [
    series(FM.map((f) => gib(f.ql)), 'var(--ok)', 'quantized (GiB)'),
    series(FM.map((f) => gib(f.fl)), 'var(--info)', 'float (GiB)'),
  ],
  yFmt: (v) => v.toFixed(1),
})));

add(makeChart(cMig, () => ({
  xs: MG.map((m) => m.t),
  series: [
    series(MG.map((m) => m.total / 1000), 'var(--crit)', 'pass (s)'),
    series(MG.map((m) => m.quant / 1000), 'var(--warn)', 'quantize (s)'),
    series(MG.map((m) => m.copy / 1000), 'var(--info)', 'copy (s)'),
  ],
  yFmt: (v) => v.toFixed(1) + 's',
})));

add(makeChart(cProj, () => ({
  xs: T(),
  series: [
    series(W.map((w) => w.reproj), '#c084fc', 're-project (ms)'),
    series(W.map((w) => w.pdrain), 'var(--warn)', 'drain (ms)'),
    series(W.map((w) => w.scan), 'var(--info)', 'scan (ms)'),
    series(W.map((w) => w.layout), 'var(--ink-faint)', 'layout (ms)'),
  ],
  yFmt: (v) => v.toFixed(0) + 'ms',
})));

add(makeChart(cSlots, () => ({
  xs: T(),
  series: [
    series(W.map((w) => w.slots), 'var(--accent)', 'resident'),
    series(W.map((w) => w.dec), PH.decode, 'decode'),
    series(W.map((w) => w.pre), PH.prefill, 'prefill'),
    series(W.map((w) => w.sec), PH.section, 'section'),
  ],
  yFmt: (v) => v.toFixed(0),
})));

/* ── the interpretation ─────────────────────────────────────────────────── */

/* Thresholds are the one thing on this page that cannot be derived from the
 * data — they encode what "bad" means on this deployment. Wrong here and the
 * page either cries wolf or stays green through a real problem, so they are
 * named rather than buried in the expressions that use them. */
const LIMITS = {
  vramWarn: 0.80, vramCrit: 0.92,     // fraction of the card
  backlogWarn: 8000, backlogCrit: 16000, // tokens waiting to migrate
  migWarnS: 5, migCritS: 20,          // seconds per drain pass
};
const stateBy = (v, warn, crit) => (v >= crit ? 'crit' : v >= warn ? 'warn' : 'ok');

const kpi = (lab, val, unit, note, state, fill) => h('div', { class: 'panel kpi' },
  h('div', { class: 'rail bg-' + state }),
  h('div', { class: 'lab' }, lab),
  h('div', { class: 'val st-' + state }, val, unit ? h('small', {}, ' ' + unit) : null),
  note ? h('div', { class: 'tiny dim' }, note) : null,
  fill != null ? h('div', { class: 'meter' },
    h('i', { class: 'bg-' + state, style: `width:${Math.min(100, Math.max(0, fill * 100)).toFixed(0)}%` })) : null);

function paintKPIs() {
  const w = last(W);
  if (!W.length) return;
  const usedG = gib(w.res), totG = gib(w.tot) || 1, frac = usedG / totG;
  const tps = w.ws > 0 ? w.tok / (w.ws / 1000) : 0;
  const peakTps = Math.max(1, ...W.filter((x) => x.ws > 0).map((x) => x.tok / (x.ws / 1000)));

  const cards = [
    kpi('KV reserved', usedG.toFixed(1), 'GiB', `of ${totG.toFixed(0)} GiB card`,
      stateBy(frac, LIMITS.vramWarn, LIMITS.vramCrit), frac),
    kpi('Headroom', gib(w.free).toFixed(1), 'GiB', 'free on the card',
      stateBy(frac, LIMITS.vramWarn, LIMITS.vramCrit)),
    kpi('Throughput', tps >= 1000 ? (tps / 1000).toFixed(1) + 'k' : tps.toFixed(0), 'tok/s',
      `${((100 * tps) / peakTps).toFixed(0)}% of peak`, tps > 0 ? 'ok' : 'warn', tps / peakTps),
    kpi('Drain backlog', w.backlog >= 1000 ? (w.backlog / 1000).toFixed(1) + 'k' : String(Math.round(w.backlog)), 'tok',
      'waiting to migrate', stateBy(w.backlog, LIMITS.backlogWarn, LIMITS.backlogCrit)),
  ];
  if (MG.length) {
    const m = last(MG), s = m.total / 1000;
    cards.push(kpi('Last migration', s.toFixed(1), 's',
      `${fmtNum(Math.round(m.mib))} MiB · ${((100 * m.quant) / Math.max(1, m.total)).toFixed(0)}% quantize`,
      stateBy(s, LIMITS.migWarnS, LIMITS.migCritS)));
  }
  if (HOST.total_gib > 0) {
    cards.push(kpi('Host RAM free', HOST.free_gib.toFixed(0), 'GiB',
      `of ${HOST.total_gib.toFixed(0)}`, 'ok', 1 - HOST.free_gib / HOST.total_gib));
  }
  mount(kpis, ...cards);
}

/* A sentence, not a dashboard. Charts say what happened; this says whether it
 * is fine — which is the question somebody opening this page actually has. */
function paintVerdict() {
  if (!W.length) { mount(verdict, 'waiting for the first sample…'); return; }
  const w = last(W), usedG = gib(w.res), totG = gib(w.tot) || 1, frac = usedG / totG;
  const st = stateBy(frac, LIMITS.vramWarn, LIMITS.vramCrit);
  const head = st === 'crit' ? 'PRESSURE' : st === 'warn' ? 'CLIMBING' : 'HEALTHY';
  const bits = [
    h('b', { class: 'st-' + st }, head), ' — ',
    'KV holds ', h('b', {}, usedG.toFixed(1) + ' GiB'), ' of ', h('b', {}, totG.toFixed(0) + ' GiB'),
    `, leaving ${gib(w.free).toFixed(1)} GiB free. `,
  ];
  if (MG.length) {
    const m = last(MG), q = (100 * m.quant) / Math.max(1, m.total);
    bits.push(`Last drain took ${(m.total / 1000).toFixed(1)}s, `, h('b', {}, q.toFixed(0) + '% of it quantizing'),
      q > 60 ? ' — the bottleneck is compress-to-warm, not the copy. ' : '. ');
  }
  const back = w.backlog;
  bits.push('Backlog ', h('b', {}, fmtNum(Math.round(back)) + ' tok'),
    back >= LIMITS.backlogCrit ? ' — climbing faster than it drains.'
      : back >= LIMITS.backlogWarn ? ' — draining, but behind.' : ' — keeping up.');
  mount(verdict, ...bits);
}

function paintPromotes() {
  if (!PROM.length) { mount(promoteList, h('div', { class: 'tiny dim' }, 'nothing promoted yet.')); return; }
  const total = PROM.reduce((a, x) => a + x.count, 0) || 1;
  mount(promoteList, ...PROM.slice(0, 12).map((p) => h('div', { class: 'row', style: 'gap:10px;margin-bottom:6px' },
    h('span', { class: 'tiny', style: 'flex:1;overflow:hidden;text-overflow:ellipsis' }, p.name),
    h('span', { class: 'tiny dim mono' }, String(p.count)),
    h('div', { style: 'width:90px;height:3px;border-radius:2px;background:var(--line-2)' },
      h('div', { style: `width:${((100 * p.count) / total).toFixed(0)}%;height:100%;border-radius:2px;background:var(--accent)` })))));
}

/* ── polling ────────────────────────────────────────────────────────────── */

async function refresh() {
  if (paused) return;
  try {
    // Only the first is required. The rest degrade to `null` so a daemon that
    // has not instrumented one greys a panel rather than blanking the page.
    const [tel, ph, pr, mem] = await Promise.all([
      fetch('/v1/telemetry', { cache: 'no-store' }).then((r) => r.json()),
      fetch('/v1/phases', { cache: 'no-store' }).then((r) => r.json()).catch(() => null),
      fetch('/v1/promotes', { cache: 'no-store' }).then((r) => r.json()).catch(() => null),
      fetch('/v1/memory', { cache: 'no-store' }).then((r) => r.json()).catch(() => null),
    ]);
    W = tel.waves || []; FM = tel.fmt || []; MG = tel.migrate || []; HOST = tel.host || {};
    PTS = (ph && ph.points) || [];
    PROM = (pr && pr.items) || [];
    MEM = mem;
    lastAt = Date.now();
    failures = 0;
    live.textContent = '● live';
    live.className = 'chip ok';
    paintKPIs(); paintVerdict(); paintPromotes();
    for (const c of charts) c.refresh();
  } catch (e) {
    failures++;
    live.textContent = failures > 2 ? '○ not answering' : '◌ retrying…';
    live.className = 'chip' + (failures > 2 ? ' crit' : '');
  }
}

/* Age is its own timer, and the reason the page is honest: without it a stalled
 * daemon looks identical to a healthy one, because the last good numbers stay
 * on screen indefinitely. */
setInterval(() => {
  if (!lastAt) { age.textContent = ''; return; }
  const s = Math.round((Date.now() - lastAt) / 1000);
  age.textContent = paused ? 'paused' : s < 2 ? 'just now' : `${s}s ago`;
  age.className = 'tiny ' + (s > 15 ? 'st-warn' : 'dim');
}, 1000);

refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
