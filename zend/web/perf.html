<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Performance · Zen</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="common/base.css">
<link rel="stylesheet" href="common/lib/estate.css">
<link rel="stylesheet" href="common/lib/perf.css">
<style>
  /* **This page has to make its own scroller.** `base.css` sets
     `html, body { height: 100%; overflow: hidden }` because the app shell
     scrolls in `.outlet`, not on the document — and this page has no shell, it
     puts `<main class="page">` straight in `<body>`. Without a scroll container
     of its own, everything below the fold was simply clipped: the phase
     timeline and the eight panels under it were rendered and unreachable.
     Same shape as `logs.html` — body is the flex column, the wrapper scrolls,
     and `.page` keeps its centred max-width inside it so the scrollbar sits at
     the viewport edge rather than at the content's. */
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; }
  .scroller { flex: 1; min-height: 0; overflow-y: auto; }
</style>
<!-- Cloudflare Web Analytics, loaded only on the public host so a local or LAN zend reports nothing. -->
<script>(function(){if(location.hostname!=="code.tokera.com")return;var s=document.createElement("script");s.defer=true;s.src="https://static.cloudflareinsights.com/beacon.min.js";s.setAttribute("data-cf-beacon",'{"token": "c3851f95a92346c4918e0e2ba7227859"}');document.head.appendChild(s);})();</script>
</head>
<body>
<header class="topbar">
  <div id="estate"></div>
  <nav class="nav">
    <a class="navlink" href="/">Chat</a>
    <a class="navlink" href="perf.html" aria-current="page">Telemetry</a>
    <a class="navlink" href="logs.html">Logs</a>
    <a class="navlink" href="agents.html" data-admin hidden>Agents</a>
  </nav>
  <span class="spacer"></span>
  <div class="row" id="chrome"></div>
</header>

<div class="scroller">
  <main class="page wide" id="page"></main>
</div>

<script type="module">
/* zend's telemetry: the shared performance page (`common/lib/perf.js`), which
 * every console mounts over the one engine. */
import { mount } from './common/lib/dom.js';
import { estateSwitcher } from './common/lib/estate.js';
import { mountPerf } from './common/lib/perf.js';
import { revealAdminLinks } from './admin-nav.js';

revealAdminLinks();
mount(document.getElementById('estate'), estateSwitcher('zend', { homeHref: '/' }));
mountPerf(document.getElementById('page'), { title: 'Telemetry' });
</script>
</body>
</html>
