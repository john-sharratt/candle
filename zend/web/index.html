<!DOCTYPE html>
<html lang="en">
<head>

<title>Zend</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; background: #1c1917; color: #ece8e4; font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  #zend-prompt::placeholder { color: #5a5652; }
  .zscroll { scrollbar-width: thin; scrollbar-color: #4a443e transparent; }
  .zscroll::-webkit-scrollbar { width: 11px; }
  .zscroll::-webkit-scrollbar-track { background: transparent; }
  .zscroll::-webkit-scrollbar-thumb { background: #4a443e; border-radius: 6px; border: 3px solid #1c1917; background-clip: padding-box; min-height: 40px; }
  .zscroll::-webkit-scrollbar-thumb:hover { background: #6b635b; border: 3px solid #1c1917; background-clip: padding-box; }
  .zscroll-wide { scrollbar-width: auto; }
  .zscroll-wide::-webkit-scrollbar { width: 16px; }
  .zscroll-wide::-webkit-scrollbar-thumb { background: #4a443e; border-radius: 8px; border: 4px solid #1c1917; background-clip: padding-box; }
  .zscroll-wide::-webkit-scrollbar-thumb:hover { background: #6b635b; border: 4px solid #1c1917; background-clip: padding-box; }
  .zscroll-blue::-webkit-scrollbar { width: 3px; }
  .zscroll-blue::-webkit-scrollbar-thumb { background: #2e3f52; border-radius: 2px; }
  .zscroll-log::-webkit-scrollbar { width: 3px; }
  .zscroll-log::-webkit-scrollbar-thumb { background: #2a2724; border-radius: 2px; }
  @keyframes zblink { 50% { opacity: 0; } }
  @keyframes zdot { 0%,65%,100% { transform: translateY(0); opacity: .35; } 32% { transform: translateY(-6px); opacity: 1; } }
  @keyframes zpulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes zslide { 0% { left: -35%; } 100% { left: 100%; } }
  @keyframes zspin { to { transform: rotate(360deg); } }
  .zspin { display:inline-block; width:13px; height:13px; border:2px solid #3a352f; border-top-color:#c7b89a; border-radius:50%; animation: zspin .7s linear infinite; }
  .zsub-hdr { transition: background .12s; } .zsub-hdr:hover { background:#272320 !important; }
  .zsub-row { transition: background .12s; } .zsub-row:hover { background:#211e1b; }
  .zsub-chev { display:inline-block; transition: transform .15s ease; } .zsub-chev.open { transform: rotate(90deg); }
  .zmd p { margin-bottom: .85rem; } .zmd > p:last-child { margin-bottom: 0; }
  .zmd strong { font-weight: 650; } .zmd em { font-style: italic; color: #9a9490; }
  .zmd h1,.zmd h2,.zmd h3 { font-weight: 650; margin: 1.1rem 0 .5rem; line-height: 1.3; }
  .zmd h1 { font-size: 1.35rem; } .zmd h2 { font-size: 1.15rem; } .zmd h3 { font-size: 1.05rem; }
  .zmd ul { padding-left: 1.5rem; margin-bottom: .85rem; } .zmd ol { padding-left: 1.75rem; margin-bottom: .85rem; }
  .zmd li { margin-bottom: .25rem; }
  .zmd li > ul, .zmd li > ol { margin-bottom: 0; margin-top: .25rem; }
  .zmd code { font-family: "Cascadia Code","Fira Code","JetBrains Mono",Consolas,monospace; font-size: .82em; background: #161412; border: 1px solid #2e2b27; border-radius: 4px; padding: .1em .38em; color: #b8d4a4; }
  .zmd .code-block { margin: .9rem 0; border: 1px solid #2e2b27; border-radius: 9px; overflow: hidden; background: #161412; }
  .zmd .code-block-header { display: flex; align-items: center; justify-content: space-between; padding: .4rem .85rem; background: #1e1b19; border-bottom: 1px solid #2e2b27; }
  .zmd .code-lang { font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #5a5652; }
  .zmd .copy-btn { font-size: .72rem; color: #5a5652; background: none; border: none; cursor: pointer; padding: .1rem .35rem; border-radius: 4px; font-family: inherit; transition: color .13s, background .13s; }
  .zmd .copy-btn:hover { color: #ece8e4; background: #2c2926; }
  .zmd .code-block pre { margin: 0; padding: .75rem 1rem; overflow-x: auto; font-size: .8rem; line-height: 1.5; }
  .zmd .code-block pre code { background: none; border: none; padding: 0; font-size: inherit; color: #ece8e4; font-family: "Cascadia Code","Fira Code","JetBrains Mono",Consolas,monospace; }
  .zmd .zcursor { display: inline-block; width: 2px; height: .85em; background: #9a9490; vertical-align: text-bottom; margin-left: 1px; animation: zblink .85s step-end infinite; }
  .zmd .tool-call-card { margin: .5rem 0; background: #26231f; border: 1px solid #38342f; border-left: 3px solid #8c5f28; border-radius: 8px; overflow: hidden; font-family: "Cascadia Code","Fira Code","JetBrains Mono",Consolas,monospace; font-size: .82rem; }
  .zmd .tool-call-card.pending { border-left-color: #5a5652; }
  .zmd .tool-call-header { display: flex; align-items: center; gap: .5rem; padding: .4rem .75rem; background: #1e1b19; border-bottom: 1px solid #2e2b27; }
  .zmd .tool-call-icon { color: #8c5f28; font-size: .8rem; }
  .zmd .tool-call-name { font-weight: 600; color: #c98a3e; letter-spacing: .02em; }
  .zmd .tool-call-card.pending .tool-call-name { color: #5a5652; animation: zpulse 1.5s ease-in-out infinite; }
  .zmd .tool-call-args { padding: .4rem .75rem .5rem; display: flex; flex-direction: column; gap: .15rem; }
  .zmd .tool-call-arg { display: flex; gap: .4rem; align-items: baseline; flex-wrap: wrap; }
  .zmd .tool-call-arg-key { color: #9a9490; white-space: nowrap; }
  .zmd .tool-call-arg-sep { color: #5a5652; }
  .zmd .tool-call-arg-val { color: #b8d4a4; word-break: break-word; }
  .zmd details.tool-call-card > summary.tool-call-header { cursor: pointer; list-style: none; user-select: none; }
  .zmd details.tool-call-card > summary.tool-call-header::-webkit-details-marker { display: none; }
  .zmd details.tool-call-card:not([open]) > summary.tool-call-header { border-bottom: none; }
  .zmd .tool-call-chevron { width: 9px; height: 9px; color: #5a5652; margin-left: auto; transition: transform .18s; flex-shrink: 0; }
  .zmd details.tool-call-card[open] > summary .tool-call-chevron { transform: rotate(90deg); }
  .zmd .tool-call-badge { font-size: .68rem; font-weight: 600; padding: .05rem .4rem; border-radius: 4px; letter-spacing: .02em; }
  .zmd .tool-call-badge.ok { color: #8fce9b; background: rgba(110,179,154,.12); }
  .zmd .tool-call-badge.err { color: #d99a8f; background: rgba(200,90,80,.13); }
  .zmd .tool-call-badge.pend { color: #8a8074; background: rgba(120,114,108,.12); }
  .zmd .tool-call-badge.run { color: #c9a86a; background: rgba(201,168,106,.13); }
  .zmd .tool-call-spin { display: inline-block; width: .62em; height: .62em; margin-right: .32em; vertical-align: -.04em; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: zspin .7s linear infinite; }
  .zmd .tool-call-out { padding: .35rem .75rem .55rem; border-top: 1px solid #2e2b27; }
  .zmd .tool-call-out-label { font-size: .68rem; color: #9a9490; margin-bottom: .25rem; text-transform: uppercase; letter-spacing: .04em; }
  .zmd .tool-call-out-body { margin: 0; padding: .4rem .55rem; background: #1a1816; border: 1px solid #2e2b27; border-radius: 5px; color: #c7bdb0; font-size: .78rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-height: 18rem; overflow: auto; }
  .zmd .tool-call-out.err .tool-call-out-body { color: #e0b0a6; border-color: #4a322c; }
  .zmd .think-block { margin: .1rem 0 .9rem; }
  .zmd .think-summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: .45rem; font-size: .8rem; color: #7c736a; user-select: none; padding: .2rem 0; transition: color .13s; }
  .zmd .think-summary:hover { color: #9a9490; }
  .zmd .think-summary::-webkit-details-marker { display: none; }
  .zmd .think-brain { width: 24px; height: 24px; color: #e08aa6; flex-shrink: 0; }
  .zmd .think-chevron { width: 9px; height: 9px; color: #5a5652; transition: transform .18s; flex-shrink: 0; }
  .zmd details[open] .think-chevron { transform: rotate(90deg); }
  .zmd .think-label.think-pulse { animation: zpulse 1.5s ease-in-out infinite; }
  .zmd .think-body { margin: .45rem 0 .2rem .15rem; padding-left: .9rem; border-left: 2px solid #2e2b27; color: #8a8074; font-size: .9em; line-height: 1.65; }
  .zmd .think-body p { margin-bottom: .5rem; } .zmd .think-body p:last-child { margin-bottom: 0; }
  .zmd .think-body code { font-size: .8em; }
  /* Streaming think: a non-collapsible header (no chevron/pointer — expansion is
     only offered once the block is complete) plus a word ticker that rolls the
     most recent thoughts through a bright centre band, showing progress + speed. */
  .zmd .think-streaming { margin: .1rem 0 .9rem; }
  .zmd .think-head { display: inline-flex; align-items: center; gap: .45rem; max-width: 100%; }
  .zmd .think-ticker { width: 20rem; max-width: 55vw; overflow: hidden; white-space: nowrap; font-size: .8rem; line-height: 1.5; color: #8a8074; opacity: .6;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%, #000 60%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 40%, #000 60%, transparent); }
  .zmd .zdots { display: inline-flex; gap: 5px; align-items: center; margin-left: 6px; }
  .zmd .zdots i { width: 7px; height: 7px; border-radius: 50%; background: #5a5652; display: inline-block; animation: zdot 1.3s ease-in-out infinite; }
  .zmd .zdots i:nth-child(2) { animation-delay: .22s; } .zmd .zdots i:nth-child(3) { animation-delay: .44s; }
  .zmd .zstatus { font-size: .82rem; color: #5a5652; font-style: italic; margin-left: .75rem; }
  /* Selectable regions: chat content + file viewer opt back into text
     selection (the global mousedown-preventDefault suppresses it on chrome). */
  .z-selectable, .z-selectable * { -webkit-user-select: text; user-select: text; }
  /* Per-turn copy button — hover-revealed in the turn's corner. */
  .z-turn { position: relative; }
  .z-turn-copy { position: absolute; top: -2px; display: inline-flex; align-items: center; gap: .3rem; font-size: .68rem; color: #7c736a; background: #26231f; border: 1px solid #38342f; border-radius: 6px; padding: .18rem .45rem; cursor: pointer; font-family: inherit; opacity: 0; transition: opacity .13s, color .13s, background .13s; user-select: none; }
  .z-turn:hover .z-turn-copy { opacity: 1; }
  .z-turn-copy:hover { color: #ece8e4; background: #2c2926; }
  .z-turn-copy svg { width: 11px; height: 11px; }
  /* File-viewer rendered content (markdown / table / code). */
  .zfile-render { padding: 16px 20px; color: #d7cfc4; line-height: 1.7; font-size: .92rem; }
  .zfile-render.zmd { padding: 16px 20px; }
  .zfile-table { border-collapse: collapse; width: 100%; font-size: .82rem; font-family: ui-monospace,monospace; }
  .zfile-table th, .zfile-table td { border: 1px solid #2e2b27; padding: .35rem .6rem; text-align: left; white-space: pre-wrap; word-break: break-word; }
  .zfile-table th { background: #1e1b19; color: #cdbfae; font-weight: 650; }
  .zfile-table tr:nth-child(even) td { background: #1a1816; }
  .z-uptile:hover { border-color: #4a453f; background: #2c2926; }
  /* ── Ring spinner + loading card (startup overlay + in-chat waiting) ───── */
  @keyframes zspin { to { transform: rotate(360deg); } }
  .z-spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #c98a3e; border-top-color: transparent; animation: zspin .9s linear infinite; flex-shrink: 0; box-sizing: border-box; }
  .z-load-card { width: min(520px, 90%); padding: 2rem 2.25rem; background: #1c1a18; border: 1px solid #38342f; border-radius: 14px; box-shadow: 0 10px 32px rgba(0,0,0,0.45); }
  .z-load-eyebrow { font-size: .78rem; font-weight: 650; color: #8a7b6a; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 1.2rem; }
  .z-load-row { display: flex; align-items: center; gap: .75rem; margin-bottom: .95rem; }
  .z-load-cur { font-size: 1.05rem; font-weight: 500; color: #ece8e4; }
  .z-load-track { height: 6px; background: #2a2724; border-radius: 3px; overflow: hidden; margin-bottom: 1.1rem; }
  .z-load-bar { height: 100%; background: linear-gradient(90deg, #c98a3e, #e0a85a); width: 0%; transition: width .25s ease-out; }
  .z-load-list { list-style: none; padding: 0; margin: 0 0 .4rem; }
  .z-load-list li { font-size: .88rem; color: #7c736a; padding: .2rem 0; display: flex; align-items: center; gap: .6rem; }
  .z-load-list li::before { content: '✓'; color: #34d399; font-weight: 700; }
  .z-load-detail { font-size: .82rem; color: #5e554c; margin-top: .6rem; min-height: 1.2em; font-variant-numeric: tabular-nums; }
  @media (max-width: 1024px) { .z-logs { width: 280px !important; } }
  /* Mobile overrides fire at the same 820px the JS uses for its narrow layout
     (NARROW_W) so there's no dead-band where the layout is narrow but modals/logs
     still render desktop-style. */
  @media (max-width: 820px) {
    .z-sb { position: fixed !important; left: 0; top: 0; bottom: 0; width: 82vw !important; max-width: 320px; z-index: 130 !important; box-shadow: 6px 0 34px rgba(0,0,0,0.55); }
    .z-rsz-l, .z-rsz-r { display: none !important; }
    .z-logs { position: fixed !important; inset: 0 !important; width: auto !important; z-index: 140 !important; }
    .z-files { width: 100% !important; }
    .z-modal-ov { padding: 0 !important; }
    .z-modal { width: 100% !important; max-width: none !important; height: 100% !important; max-height: 100% !important; border-radius: 0 !important; border: none !important; }
  }
  @media (max-width: 560px) { .z-dial-label { display: none !important; } }
  .z-chatscroll > div:last-child { margin-bottom: 2.5rem !important; }
</style>

<div id="app"></div>

<script src="zend-api.mock.js"></script>
<script src="zend-api.live.js"></script>
<script src="zend-api.js"></script>
<script>
/* ============================================================================
 * Zend UI — vanilla single-file app (plain DOM, no framework).
 * Talks only to window.ZendAPI (the seam); never calls fetch directly.
 * See docs/zend_ui_redesign.md.
 * ========================================================================== */
(function () {
  'use strict';
  const API = window.ZendAPI;
  const ACCENT = '#c98a3e';
  // Executable / installer / auto-run file types that are never uploaded —
  // kept in sync with the server's `BLOCKED_UPLOAD_EXTS` (conv_files.rs). The
  // server is authoritative; this client-side block just fails fast with a
  // clear message before any bytes leave the browser.
  const BLOCKED_UPLOAD_EXTS = new Set([
    'exe','dll','so','dylib','com','scr','pif','cpl','sys','drv','ocx','o','a','lib','bin','elf','out','ko',
    'msi','msp','msc','cab','dmg','pkg','app','deb','rpm','apk','ipa','appx','appimage','gadget',
    'bat','cmd','vbs','vbe','wsf','wsh','hta','jse','wsc','reg','lnk','scf','inf',
    'jar','class',
  ]);
  function blockedUploadReason(name) {
    // Trim trailing dots/spaces first — Windows strips them on the server side,
    // so `payload.exe.` would materialise as `payload.exe`. Mirror of the
    // authoritative server gate (conv_files::blocked_upload_reason).
    const cleaned = String(name || '').replace(/[.\s]+$/, '');
    const m = /\.([^.]+)$/.exec(cleaned);
    if (m && BLOCKED_UPLOAD_EXTS.has(m[1].toLowerCase())) return 'executable, installer, and auto-run file types are not allowed';
    return null;
  }
  const PROJ_PALETTE = ['#c98a3e', '#6f9ed8', '#6cb39a', '#9b8fdf', '#d08a8a', '#cdb24a'];
  // Below this viewport width the left pane forces to its rail and the
  // projection timeline gutter is hidden, reclaiming horizontal space.
  const NARROW_W = 820;
  // At/above this width the chat reserves a right margin so its content stops
  // left of the floating Logs/Files pills instead of running under them.
  const WIDE_W = 1100;

  // ── tiny hyperscript: real event listeners, html via {html} ──────────────
  function h(tag, props) {
    const el = document.createElement(tag);
    props = props || {};
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'style') el.setAttribute('style', v);
      else if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'ref' && typeof v === 'function') v(el);
      else if (k.length > 2 && k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
    for (let i = 2; i < arguments.length; i++) {
      const kids = arguments[i];
      (Array.isArray(kids) ? kids : [kids]).forEach((kid) => {
        if (kid == null || kid === false) return;
        el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
      });
    }
    return el;
  }

  // ── state ────────────────────────────────────────────────────────────────
  const now = Date.now();

  // Composer-dial preference persistence (per-user, browser-local).
  function dialPref(key, dflt) {
    try {
      const v = parseInt(localStorage.getItem(key), 10);
      return Number.isInteger(v) && v >= 0 && v <= 4 ? v : dflt;
    } catch (_) { return dflt; }
  }
  function saveDialPref(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (_) {}
  }

  const S = {
    conversations: [],   // filled by the async seed at boot (mock is sync, live fetches)
    activeId: null,
    loaded: {},
    showArchived: (function () { try { return localStorage.getItem('zend.showArchived') === '1'; } catch (_) { return false; } })(),
    sidebarCollapsed: false,
    sidebarDrawer: false,   // narrow only: the conversation list open as an overlay drawer
    confirm: null,          // in-app confirm dialog: { title, body, confirmLabel, danger, onConfirm }
    narrow: (typeof window !== 'undefined' && window.innerWidth < NARROW_W),
    wide: (typeof window !== 'undefined' && window.innerWidth >= WIDE_W),
    sidebarW: 220,
    logW: 310,
    dragging: null,
    promptValue: '',
    logsOpen: false,
    // Composer dials are a per-user browser preference (persisted in
    // localStorage, like theme/show-archived), so a new conversation starts
    // with the user's last-chosen settings rather than a hardcoded default.
    effortLevel: dialPref('zend.effort', 2),
    verbosityLevel: dialPref('zend.verbosity', 2),
    toolsLevel: dialPref('zend.tools', 2),
    openMenu: null,
    theme: (function () { try { return localStorage.getItem('zend.theme') || 'dark'; } catch (_) { return 'dark'; } })(),
    themeMenuOpen: false,
    substrateOpen: false,
    substrateNode: null,
    substrateMsg: null,            // the assistant bubble the panel was opened from (decoded tail)
    substrateUserMsg: null,        // the user message preceding it (the active turn body)
    substrateHistory: [],          // prior conversation messages (verbatim, with roles)
    substrateContent: null,        // name → authored section text (fetched lazily)
    substrateTurnContent: {},      // "group::index" → { user, assistant } memory-tier body
    substrateTargetLayer: '',      // the dialogue/target layer name (for message prefixes)
    substrateGlue: null,           // dialect framing markers (system/user/assistant start/end)
    substrateGroupOpen: {},        // group key → open? (default closed/collapsed)
    substrateExpanded: {},         // section key → expanded (show content)?
    filesOpen: false,
    dragActive: false,
    lastUploadedId: null,
    fileView: null,
    thinkOpen: {},
    upload: null,
    boot: { state: 'loading', detail: '', loading: { current: 'Starting', progress: 0, completed: [] } },
  };

  let chatEl = null, logEl = null, promptEl = null, filesListEl = null, substrateEl = null;
  let stream = null, logUnsub = null, hlTimer = null;
  let savedChatScroll = null, savedSubstrateScroll = null;
  // Follow the bottom while streaming, but the instant the user scrolls UP they
  // take over and we leave the scroll alone until they return to the bottom.
  // `stick` is driven solely by the scroller's own scroll events (buildChat);
  // every programmatic scroll keeps `lastScrollTop` in sync right after, so it
  // can never be mistaken for a user scroll-up. (Safe now that streaming patches
  // in place and no longer resets scrollTop with a full rebuild.)
  let stick = true, lastScrollTop = 0, logStick = true;
  const nearBottom = (el) => !el || (el.scrollHeight - el.scrollTop - el.clientHeight) < 24;

  // ── navigation tag ───────────────────────────────────────────────────────
  // The active conversation lives in the URL hash, so a forced reload (after a
  // daemon rebuild) lands the user back on the same conversation. The chat
  // scroll position rides across the reload in sessionStorage.
  function readHashConv() { const m = (location.hash || '').match(/conv=([^&]+)/); return m ? decodeURIComponent(m[1]) : null; }
  function writeHashConv(id) {
    try { const want = id ? ('#conv=' + encodeURIComponent(id)) : ''; if (location.hash !== want) history.replaceState(null, '', location.pathname + location.search + want); } catch (_) {}
  }
  let pendingScroll = (function () { try { const v = sessionStorage.getItem('zend.reload'); sessionStorage.removeItem('zend.reload'); return v ? JSON.parse(v) : null; } catch (_) { return null; } })();
  function saveScrollForReload() { try { sessionStorage.setItem('zend.reload', JSON.stringify({ conv: S.activeId, scroll: chatEl ? chatEl.scrollTop : 0 })); } catch (_) {} }
  // Capture the build on first sighting; force a reload when it changes.
  function checkBuild(st) {
    if (!st || !st.build) return false;
    if (!window.ZEND_BUILD) { window.ZEND_BUILD = st.build; return false; }
    if (st.build !== window.ZEND_BUILD) { saveScrollForReload(); location.reload(); return true; }
    return false;
  }

  function setState(patch, cb) { Object.assign(S, patch); render(); if (cb) cb(); }
  // Streaming updates (tokens / projections) patch ONLY the streaming message's
  // content in place — they never rebuild the whole chat, so the scroller's
  // `scrollTop` is never reset. That's the structural fix for jerky scrolling:
  // with nothing resetting the scroll there's nothing to restore, so the user's
  // scroll is left completely free; we only pin to the bottom when they're
  // already there. Falls back to a full render if the message isn't in the DOM
  // yet (first paint of the turn) or the target conversation isn't on screen.

  function buildCenter() {

  function buildEmptyState() {

  function buildChat(conv) {
    // Non-narrow: the projection-bar gutter is an inline flex sibling of each
    // message (not an absolute overlay), so the scroller only needs a small
    // left pad; the gutter itself supplies the rest of the left offset.
    const leftPad = S.narrow ? '2rem' : '1.5rem';
    // When wide, keep content left of the top-right Logs/Files pills (~112px).
    const rightPad = S.wide ? '8rem' : '2rem';
    const scroller = h('div', { class: 'zscroll zscroll-wide z-chatscroll', ref: (el) => { chatEl = el; }, onScroll: (e) => { const st = e.currentTarget.scrollTop; if (st < lastScrollTop - 1) stick = false; else if (nearBottom(e.currentTarget)) stick = true; lastScrollTop = st; }, style: 'display:flex; flex-direction:column; flex:1; min-height:0; overflow-y:auto; padding:2rem ' + rightPad + ' 0.5rem ' + leftPad + '; position:relative;' });
    // Pair each tool result with the call it answers: a user turn that is a bare
    // <tool_response> is the OUTPUT of the most recent assistant turn's tool
    // call, not a chat bubble of its own — fold it into that call's card (in
    // call order) and hide the raw bubble.
    const toolOut = {};
    const skipMsg = {};
    conv.history.forEach((m, i) => {
      if (m.role === 'user' && isToolResponse(m.content)) {
        for (let j = i - 1; j >= 0; j--) {
          if (conv.history[j].role === 'assistant') { (toolOut[j] = toolOut[j] || []).push(m.content); break; }
        }
        skipMsg[i] = true;
      }
    });
    conv.history.forEach((m, idx) => {
      if (skipMsg[idx]) return;
      if (m.role === 'upload') {
        if (m.files && m.files.length) scroller.appendChild(buildUploadTiles(m.files));
        return;
      }
      if (m.role === 'user') {
        scroller.appendChild(h('div', { class: 'z-turn z-selectable', style: 'display:flex; flex-direction:row-reverse; gap:0.85rem; margin-bottom:2rem; padding-left:3rem;' },
          h('div', { style: 'background:#2f2c29; border:1px solid #252220; border-radius:16px 16px 3px 16px; padding:0.65rem 1.05rem; white-space:pre-wrap; word-break:break-word; line-height:1.6;' }, m.content),
          turnCopyBtn(m, 'right:0;')));
      } else {
        const open = !!S.thinkOpen[conv.id + ':' + idx];
        const zmd = h('div', { class: 'zmd', style: 'flex:1; min-width:0; word-break:break-word; line-height:1.7;', html: nodeHtml(m, open, toolOut[idx]) });
        // Draw the projection bars by measuring the inline anchors — deferred to
        // the next frame because `zmd` isn't in the document yet (the scroller is
        // attached by the caller after buildChat returns), and getBoundingClientRect
        // needs it laid out. The live-stream path measures an already-attached
        // node, so it calls applyProjSegments synchronously.
        if (!S.narrow) applyProjSegments(zmd, m);
        scroller.appendChild(h('div', { 'data-msg': idx, class: 'z-turn z-selectable', style: 'display:flex; margin-bottom:2rem; padding-right:2rem;' }, zmd,
          turnCopyBtn(m, 'right:2rem;')));
      }
    });
    return scroller;
  }

  // An inline row of file tiles for an `upload` history event — one tile per
  // file, tiled left-aligned when several were dropped together. Clicking a
  // tile opens the files pane and that specific file. The tile carries the
  // file metadata (id/name/ext/kind/size/added) the viewer needs, so opening
  // fetches the content by id like any files-pane click.
  function buildUploadTiles(files) {
    const tiles = files.map((f) => {
      const cols = fileColors[f.kind] || fileColors.text;
      return h('button', { class: 'z-uptile', title: 'Open ' + f.name,
        // The inline tile is the entry point — clicking it opens the document
        // viewer directly (the files side-pane stays closed).
        onClick: () => openFile(f),
        style: 'display:flex; align-items:center; gap:8px; max-width:240px; background:#26231f; border:1px solid #38342f; border-radius:9px; padding:7px 10px; cursor:pointer; font-family:inherit; text-align:left;' },
        h('span', { style: 'flex-shrink:0; width:26px; height:26px; border-radius:6px; background:' + cols[1] + '; color:' + cols[0] + '; font-size:8.5px; font-weight:700; display:flex; align-items:center; justify-content:center; font-family:ui-monospace,monospace;' }, f.ext),
        h('span', { style: 'flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;' },
          h('span', { style: 'font-size:0.78rem; color:#ece8e4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;' }, f.name),
          h('span', { style: 'font-size:0.66rem; color:#7c736a; font-family:ui-monospace,monospace;' }, f.size || '')));
    });
    const row = h('div', { style: 'display:flex; flex-wrap:wrap; gap:8px; margin-bottom:5px; padding-right:2rem;' }, tiles);
    // A single batch-level throughput line under the tiles when the pipeline
    // measured it (persisted with the event, so it survives a reload).
    const st = files.length ? files[0].stats : null;
    const statLines = uploadStatLines(st);
    const statLine = statLines.length
      ? h('div', { class: 'z-uptile-stat', style: 'font-size:0.68rem; color:#7c736a; font-family:ui-monospace,monospace; margin-bottom:2rem;' }, statLines.join(' · '))
      : h('div', { style: 'margin-bottom:2rem;' });
    return h('div', {}, row, statLine);
  }

  // The upload's measured pipeline stages, each as its own
  // "<verb> <qty> in <Xs> (<rate>)" line — upload (bytes / MB/s) and read
  // (prefill tokens / t/s). Summarisation is a background task and is
  // deliberately NOT reported here. Returns [] when no stats were measured. The
  // file viewer shows them stacked; the inline tile joins them with " · ".
  function uploadStatLines(st) {
    if (!st) return [];
    const fx1 = (n) => n.toFixed(1);
    const lines = [];
    if (st.bytes > 0) {
      const mb = st.bytes / 1e6;
      const s = (st.uploadMs || 0) / 1000;
      const rate = (st.uploadMs > 0) ? ' (' + fx1(mb / s) + ' MB/s)' : '';
      lines.push('Uploaded ' + fx1(mb) + ' MB' + (s > 0 ? ' in ' + fx1(s) + 's' : '') + rate);
    }
    if (st.ingestTokens > 0) {
      const s = (st.ingestMs || 0) / 1000;
      const rate = (st.ingestMs > 0) ? ' (' + Math.round(st.ingestTokens / s).toLocaleString() + ' t/s)' : '';
      lines.push('Read ' + st.ingestTokens.toLocaleString() + ' tokens' + (s > 0 ? ' in ' + fx1(s) + 's' : '') + rate);
    }
    return lines;
  }

  // A hover-revealed "Copy" button for a whole turn (user or assistant),
  // pinned to a corner of the turn row via `posStyle` (e.g. 'right:0;'). It
  // copies the turn's raw text — the assistant's markdown source, not the
  // rendered HTML — so pasted content stays plain and faithful. `msg` is the
  // history entry (read at click time, so a turn copied mid-stream copies
  // whatever has decoded so far, never a stale build-time snapshot).
  function turnCopyBtn(msg, posStyle) {
    const icon = '<svg viewBox="0 0 14 14" fill="none"><rect x="4.4" y="4.4" width="7.6" height="7.6" rx="1.3" stroke="currentColor" stroke-width="1.1"/><path d="M9.5 4.4V3.1A1.1 1.1 0 0 0 8.4 2H3.1A1.1 1.1 0 0 0 2 3.1v5.3A1.1 1.1 0 0 0 3.1 9.5h1.3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return h('button', { class: 'z-turn-copy', style: posStyle, title: 'Copy message',
      onClick: (e) => {
        e.stopPropagation();
        try { navigator.clipboard.writeText(msg.content || ''); } catch (_) {}
        const lbl = e.currentTarget.querySelector('span');
        if (lbl) { lbl.textContent = 'Copied'; setTimeout(() => { lbl.textContent = 'Copy'; }, 1400); }
      },
      html: icon + '<span>Copy</span>' });
  }

  // The palette color a projection bar uses, keyed by its ORDER in the message
  // (not its span id): adjacent bars always land on consecutive, contrasting
  // palette entries, and the mapping is stable across streaming → finalize so
  // colors don't shift. Shared with the popover so its accent matches the bar.
  function projBarColor(order) { return PROJ_PALETTE[order % PROJ_PALETTE.length]; }

  // Wrap each projection's run of content blocks in an IN-FLOW segment carrying
  // a thin colored bar. The bar is an absolutely-positioned child of the wrapper
  // (top:0 -> bottom:0), so it spans from the start of the projection's first
  // block to the end of its last, both ends pinned to in-flow text. It reflows
  // with the content on every render, resize and think-toggle, with NO
  // measurement and nothing that can drift.
  //
  // Block membership is frozen per projection: `_blockEnd` is the content-block
  // count captured (layout-free) the instant each projection fired (see
  // appendProjection). Projection i owns blocks [prev._blockEnd, this._blockEnd);
  // blocks past the last boundary are the not-yet-projected tail (no bar).
  // Reloaded conversations have no `_blockEnd`, so boundaries fall back to a
  // token-fraction of the block count (stable, since reloaded content is static).
  //
  // Sub-block refinement: a COMPLETED think block that several projections fired
  // inside splits its single bar into stacked %-height sub-bars by char fraction
  // (`_charEnd` vs the think's own data-c0/c1 range). The percentages are CSS,
  // not measured pixels, so they reflow with the block on resize/think-toggle and
  // never drift — and only completed blocks split, so the live bar never shrinks.
  function applyProjSegments(zmd, m) {
    const spans = (m.spans || []).slice().sort((a, b) => (a.start_token || 0) - (b.start_token || 0));
    if (!spans.length) return;
    const isCursor = (el) => el.classList && el.classList.contains('zcursor');
    const all = Array.from(zmd.children);
    const cursor = all.find(isCursor);
    const blocks = all.filter((el) => !isCursor(el));
    if (!blocks.length) return;
    // Projections are POINTS at `start_token`; projection i governs `[start_i,
    // start_{i+1})`. Its bar therefore ends at the NEXT projection's position (the
    // last runs to the end). `maxTok` approximates the turn's total by the last
    // projection's position, so the tail past it maps coarsely.
    const maxTok = Math.max(1, ...spans.map((s) => s.start_token || 0));
    const boundTok = (i) => (i + 1 < spans.length ? (spans[i + 1].start_token || 0) : maxTok);
    const boundary = (i) => spans[i]._blockEnd != null ? spans[i]._blockEnd : Math.round(boundTok(i) / maxTok * blocks.length);
    const projOf = (bi) => { for (let i = 0; i < spans.length; i++) { if (boundary(i) > bi) return i; } return -1; };
    // Points → intervals: stash each projection's governed length + throughput on
    // the span so the hover popover and panel header (which see one span at a time)
    // can show t/s. `seconds` is elapsed-since-decode-start; the delta to the next
    // event's `seconds` times the token delta gives the interval's t/s.
    spans.forEach((s, i) => {
      const nextSec = (i + 1 < spans.length) ? (spans[i + 1].seconds || 0) : (s.seconds || 0);
      s._gen = Math.max(0, boundTok(i) - (s.start_token || 0));
      s._secs = Math.max(0, nextSec - (s.seconds || 0));
      s._tps = s._secs > 0 ? s._gen / s._secs : 0;
    });

    // A COMPLETED think block carries its raw char range (data-c0/c1). If two or
    // more projections fired inside it, return one sub-bar per overlapping
    // projection sized by char fraction; else null — the block keeps a single
    // whole-block bar. Needs `_charEnd` (live decode); reloaded turns lack it, so
    // they stay coarse. Incomplete (still-decoding) thinks have no range, so they
    // never split — that's what keeps the active bar from shrinking.
    const clen = Math.max(1, (m.content || '').length);
    const subBars = (el) => {
      if (!(el.dataset && el.dataset.c0 != null)) return null;
      const c0 = +el.dataset.c0, c1 = +el.dataset.c1, total = Math.max(1, c1 - c0);
      const out = [];
      let prev = 0;
      for (let i = 0; i < spans.length; i++) {
        // Exact char offset frozen at decode (`_charEnd`), or — for hydrated
        // turns — a projection-governed offset: the next point's `start_token`
        // (`boundTok`) mapped proportionally into the char range.
        // The content is static post-hydrate, so this is stable (no shrink).
        const ce = spans[i]._charEnd != null
          ? spans[i]._charEnd
          : Math.round((boundTok(i) / maxTok) * clen);
        const lo = Math.max(c0, prev), hi = Math.min(c1, ce);
        prev = ce;
        if (hi > lo) out.push({ i: i, pct: (hi - lo) / total * 100 });
      }
      return out.length > 1 ? out : null;
    };
    const barFor = (sp, idx) => h('div', {
      onMouseEnter: (e) => { e.currentTarget.style.filter = 'brightness(1.4)'; showProjPopover(sp, e.currentTarget); },
      onMouseLeave: (e) => { e.currentTarget.style.filter = 'none'; hideProjPopover(); },
      onClick: () => { hideProjPopover(); openSubstrate(sp, m); },
      style: 'position:absolute; left:0; width:5px; border-radius:3px; background:' + projBarColor(idx) + '; cursor:pointer; transition:filter .12s;',
    });

    const frag = document.createDocumentFragment();
    const segs = [];
    let gi = 0;
    while (gi < blocks.length) {
      // A splittable completed think gets its own segment with stacked %-height
      // sub-bars — CSS-relative, so they reflow on resize/think-toggle with no
      // measurement and don't drift.
      const split = subBars(blocks[gi]);
      if (split) {
        const seg = h('div', { style: 'position:relative; padding-left:1.15rem;' });
        let cum = 0;
        split.forEach((part) => {
          const bar = barFor(spans[part.i], part.i);
          bar.style.top = 'calc(' + cum + '% + 1px)';
          bar.style.height = 'calc(' + part.pct + '% - 2px)';
          seg.appendChild(bar);
          cum += part.pct;
        });
        seg.appendChild(blocks[gi]);
        blocks[gi].style.marginBottom = '0';
        segs.push(seg);
        frag.appendChild(seg);
        gi += 1;
        continue;
      }
      // Otherwise a run of consecutive same-owner blocks shares one whole-run bar
      // (top→bottom). The run stops at a splittable think so it gets its own seg.
      const a = projOf(gi);
      let gj = gi;
      while (gj < blocks.length && projOf(gj) === a && !subBars(blocks[gj])) gj++;
      const seg = h('div', { style: 'position:relative; padding-left:1.15rem;' });
      if (a >= 0) {
        const bar = barFor(spans[a], a);
        bar.style.top = '1px';
        bar.style.bottom = '1px';
        seg.appendChild(bar);
      }
      for (let k = gi; k < gj; k++) seg.appendChild(blocks[k]);
      blocks[gj - 1].style.marginBottom = '0';
      segs.push(seg);
      frag.appendChild(seg);
      gi = gj;
    }
    for (let si = 0; si < segs.length - 1; si++) segs[si].style.marginBottom = '0.6rem';
    if (cursor) frag.appendChild(cursor);
    zmd.innerHTML = '';
    zmd.appendChild(frag);
  }

  function buildTopRight() {
    const conv = activeConv();
    const filesCount = (conv && conv.files) ? conv.files.length : 0;
    const wrap = h('div', { style: 'position:absolute; top:14px; right:20px; z-index:30; display:flex; flex-direction:column; gap:8px; align-items:flex-end;' });
    if (!S.logsOpen) wrap.appendChild(h('button', { onClick: () => setState({ logsOpen: true }), title: 'Show logs', style: pillStyle(false), html: '<svg viewBox="0 0 14 14" fill="none" style="width:11px;height:11px;"><path d="M1.5 3.5h11M1.5 7h11M1.5 10.5h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>&nbsp;Logs</span>' }));
    const filesBtn = h('button', { onClick: () => setState({ filesOpen: !S.filesOpen }), title: 'Conversation files', style: pillStyle(S.filesOpen) },

      ? 'out of GPU memory — try again'
      : (stats && stats.inCached)
        ? 'already in substrate'

          stats && stats.inMs != null ? stats.inMs : null,
          stats && stats.inTs ? now - stats.inTs : 0, 't/s');
    // The scheduler reports each scope as it lands, so `rf.current` climbs per
    // scope and the bar fills live. Until the first scope lands (`current === 0`)
    // there's no fraction yet — show a sliding indeterminate bar rather than a
    // frozen 0%; it flips to the real percentage the moment progress starts.
    const inBar = readState !== 'running' ? null

        h('span', { class: 'z-upstat', style: 'flex:none; font-family:ui-monospace,monospace; font-size:0.72rem; color:#e0938a;' }, 'rejected')),

      : (named.length > 1 ? named.length + ' files'
        : (anyRejected ? 'Upload blocked' : 'Upload'));

    const body = stageRows.concat(rejectedRows.length
      ? [h('div', { style: 'margin-top:10px; padding-top:10px; border-top:1px solid #2e2b27;' }, rejectedRows)]
      : []);
    const modal = h('div', { class: 'z-modal', onClick: (e) => e.stopPropagation(), style: 'width:min(460px,95%); display:flex; flex-direction:column; background:#1c1a18; border:1px solid #38342f; border-radius:14px; box-shadow:0 18px 60px rgba(0,0,0,0.6); overflow:hidden;' },
      h('div', { style: 'padding:15px 17px; border-bottom:1px solid #2e2b27; display:flex; align-items:center; gap:10px;' },
        h('span', { html: '<svg viewBox="0 0 24 24" fill="none" style="width:18px;height:18px;color:#c98a3e;"><path d="M12 4v11M7 10l5 5 5-5M5 19h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' }),
        h('div', { class: 'z-uptitle', style: 'font-size:0.95rem; font-weight:650; color:#ece8e4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;' }, title)),
      h('div', { style: 'padding:13px 17px;' }, body),

        h('button', { class: 'z-upcancel', onClick: allSettled ? () => setState({ upload: null }) : cancelUpload, style: 'font-size:0.78rem; color:#b8b2ac; background:#232120; border:1px solid #38342f; border-radius:8px; padding:6px 14px; cursor:pointer; font-family:inherit;' }, allSettled ? 'Close' : 'Cancel')));

  // ── overlays: proj popover, file viewer, substrate ──────────────────────
  function buildProjPopover(sp, top, left, accent) {

    // `_gen`/`_secs`/`_tps` are derived from the point-event sequence in `applyProjSegments`.
    const gen = sp._gen || 0;
    const secs = sp._secs || 0;
    const tps = sp._tps || 0;

    // Stacked bar map: one segment per category, width ∝ tokens. System (first
    // bucket) leftmost, then section groups, then turns — the order the engine
    // emits them.
    const bar = h('div', { style: 'display:flex; height:13px; border-radius:4px; overflow:hidden; background:#161412; border:1px solid #2e2b27;' },

  // Lowercased final extension of a filename, or '' if none.
  function fileExt(name) {
    const m = /\.([a-z0-9]+)$/i.exec(String(name || ''));
    return m ? m[1].toLowerCase() : '';
  }
  // Parse one CSV/TSV row respecting `"`-quoted fields (doubled quotes escape).
  function parseDelimLine(line, sep) {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) {
        if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === sep) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out;
  }
  // Render the file body element by extension: markdown, JSON, CSV/TSV as a
  // table, everything else as a monospace source view. The source view is the
  // safe default — HTML and the like are shown as text, never executed.
  function renderFileBody(fv) {
    const content = fv.content || '';
    const ext = fileExt(fv.name);
    const mono = (text) => h('pre', { class: 'z-selectable', style: 'margin:0; padding:15px 17px; font-family:ui-monospace,monospace; font-size:12.5px; line-height:1.6; color:#cdbfae; white-space:pre; overflow-x:auto;' }, text);
    if (fv.kind === 'img') {
      return h('div', { style: 'display:flex; align-items:center; justify-content:center; min-height:280px; padding:40px;', html: '<div style="text-align:center; color:#5a5652;"><svg viewBox="0 0 24 24" fill="none" style="width:40px;height:40px;margin-bottom:10px;"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/><circle cx="8.5" cy="9.5" r="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M5 18l5-5 4 3 2-2 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><div style="font-size:0.82rem;">Image preview unavailable in this demo</div></div>' });
    }
    if (ext === 'md' || ext === 'markdown') {
      return h('div', { class: 'zmd zfile-render z-selectable', html: renderMd(content) });
    }
    if (ext === 'json') {
      let pretty = content;
      try { pretty = JSON.stringify(JSON.parse(content), null, 2); } catch (_) {}
      return mono(pretty);
    }
    if (ext === 'csv' || ext === 'tsv') {
      const sep = ext === 'tsv' ? '\t' : ',';
      const rows = content.replace(/\r\n/g, '\n').split('\n').filter((l) => l.length > 0);
      if (rows.length) {
        const cells = rows.map((r) => parseDelimLine(r, sep));
        const table = h('table', { class: 'zfile-table' });
        const thead = h('thead'); const htr = h('tr');
        cells[0].forEach((c) => htr.appendChild(h('th', {}, c)));
        thead.appendChild(htr); table.appendChild(thead);
        const tbody = h('tbody');
        for (let i = 1; i < cells.length; i++) {
          const tr = h('tr');
          cells[i].forEach((c) => tr.appendChild(h('td', {}, c)));
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        return h('div', { class: 'zfile-render z-selectable', style: 'padding:12px 14px; overflow-x:auto;' }, table);
      }
    }
    return mono(content);
  }

  function buildFileViewer() {
    const fv = S.fileView;

    const body = renderFileBody(fv);
    const modal = h('div', { class: 'z-modal', onClick: (e) => e.stopPropagation(), style: 'width:min(820px,95%); max-height:86vh; display:flex; flex-direction:column; background:#1c1a18; border:1px solid #38342f; border-radius:14px; box-shadow:0 18px 60px rgba(0,0,0,0.6); overflow:hidden;' },
      h('div', { style: 'flex-shrink:0; display:flex; align-items:center; gap:11px; padding:14px 16px; border-bottom:1px solid #2e2b27;' },
        h('span', { style: 'flex-shrink:0; width:32px; height:32px; border-radius:7px; background:' + cols[1] + '; color:' + cols[0] + '; font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; font-family:ui-monospace,monospace;' }, fv.ext),
        h('div', { style: 'flex:1; min-width:0;' },

        h('button', { onClick: () => deleteFile(fv), title: 'Delete file', style: 'flex-shrink:0; display:flex; align-items:center; gap:5px; font-size:0.74rem; color:#b8867f; background:rgba(200,80,80,0.07); border:1px solid rgba(200,80,80,0.2); border-radius:7px; padding:5px 10px; cursor:pointer; font-family:inherit;', html: '<svg viewBox="0 0 14 14" fill="none" style="width:11px;height:11px;"><path d="M2.5 3.5h9M5 3.5V2.3h4v1.2M5.6 6v4M8.4 6v4M3.4 3.5l.5 8h6.2l.5-8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg><span>&nbsp;Delete</span>' }),
        h('button', { onClick: () => downloadFile(fv), title: 'Download', style: 'flex-shrink:0; display:flex; align-items:center; gap:5px; font-size:0.74rem; color:#b8b2ac; background:#232120; border:1px solid #38342f; border-radius:7px; padding:5px 10px; cursor:pointer; font-family:inherit;', html: '<svg viewBox="0 0 14 14" fill="none" style="width:11px;height:11px;"><path d="M7 1.5v7M4 6l3 3 3-3M2.5 11.5h9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>&nbsp;Download</span>' }),
        h('button', { onClick: copyFileView, style: 'flex-shrink:0; font-size:0.74rem; color:#b8b2ac; background:#232120; border:1px solid #38342f; border-radius:7px; padding:5px 11px; cursor:pointer; font-family:inherit;' }, 'Copy'),

  function downloadFile(fv) {
