<!DOCTYPE html>
<html lang="en">
<head>

<title>Zend</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; background: #1c1917; color: #ece8e4; font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  #zend-prompt::placeholder { color: #5a5652; }
  .zscroll { scrollbar-width: thin; scrollbar-color: #4a443e transparent; }
  .zscroll::-webkit-scrollbar { width: 11px; }
  .zscroll::-webkit-scrollbar-track { background: transparent; }
  .zscroll::-webkit-scrollbar-thumb { background: #4a443e; border-radius: 6px; border: 3px solid #1c1917; background-clip: padding-box; min-height: 40px; }
  .zscroll::-webkit-scrollbar-thumb:hover { background: #6b635b; border: 3px solid #1c1917; background-clip: padding-box; }
  .zscroll-wide { scrollbar-width: auto; }
  .zscroll-wide::-webkit-scrollbar { width: 16px; }
  .zscroll-wide::-webkit-scrollbar-thumb { background: #4a443e; border-radius: 8px; border: 4px solid #1c1917; background-clip: padding-box; }
  .zscroll-wide::-webkit-scrollbar-thumb:hover { background: #6b635b; border: 4px solid #1c1917; background-clip: padding-box; }
  .zscroll-blue::-webkit-scrollbar { width: 3px; }
  .zscroll-blue::-webkit-scrollbar-thumb { background: #2e3f52; border-radius: 2px; }
  .zscroll-log::-webkit-scrollbar { width: 3px; }
  .zscroll-log::-webkit-scrollbar-thumb { background: #2a2724; border-radius: 2px; }
  @keyframes zblink { 50% { opacity: 0; } }
  @keyframes zdot { 0%,65%,100% { transform: translateY(0); opacity: .35; } 32% { transform: translateY(-6px); opacity: 1; } }
  @keyframes zpulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes zspin { to { transform: rotate(360deg); } }
  .zspin { display:inline-block; width:13px; height:13px; border:2px solid #3a352f; border-top-color:#c7b89a; border-radius:50%; animation: zspin .7s linear infinite; }
  .zsub-hdr { transition: background .12s; } .zsub-hdr:hover { background:#272320 !important; }
  .zsub-row { transition: background .12s; } .zsub-row:hover { background:#211e1b; }
  .zsub-chev { display:inline-block; transition: transform .15s ease; } .zsub-chev.open { transform: rotate(90deg); }
  .zmd p { margin-bottom: .85rem; } .zmd > p:last-child { margin-bottom: 0; }
  .zmd strong { font-weight: 650; } .zmd em { font-style: italic; color: #9a9490; }
  .zmd h1,.zmd h2,.zmd h3 { font-weight: 650; margin: 1.1rem 0 .5rem; line-height: 1.3; }
  .zmd h1 { font-size: 1.35rem; } .zmd h2 { font-size: 1.15rem; } .zmd h3 { font-size: 1.05rem; }
  .zmd ul { padding-left: 1.5rem; margin-bottom: .85rem; } .zmd ol { padding-left: 1.75rem; margin-bottom: .85rem; }
  .zmd li { margin-bottom: .25rem; }
  .zmd li > ul, .zmd li > ol { margin-bottom: 0; margin-top: .25rem; }
  .zmd code { font-family: "Cascadia Code","Fira Code","JetBrains Mono",Consolas,monospace; font-size: .82em; background: #161412; border: 1px solid #2e2b27; border-radius: 4px; padding: .1em .38em; color: #b8d4a4; }
  .zmd .code-block { margin: .9rem 0; border: 1px solid #2e2b27; border-radius: 9px; overflow: hidden; background: #161412; }
  .zmd .code-block-header { display: flex; align-items: center; justify-content: space-between; padding: .4rem .85rem; background: #1e1b19; border-bottom: 1px solid #2e2b27; }
  .zmd .code-lang { font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #5a5652; }
  .zmd .copy-btn { font-size: .72rem; color: #5a5652; background: none; border: none; cursor: pointer; padding: .1rem .35rem; border-radius: 4px; font-family: inherit; transition: color .13s, background .13s; }
  .zmd .copy-btn:hover { color: #ece8e4; background: #2c2926; }
  .zmd .code-block pre { margin: 0; padding: .75rem 1rem; overflow-x: auto; font-size: .8rem; line-height: 1.5; }
  .zmd .code-block pre code { background: none; border: none; padding: 0; font-size: inherit; color: #ece8e4; font-family: "Cascadia Code","Fira Code","JetBrains Mono",Consolas,monospace; }
  .zmd .zcursor { display: inline-block; width: 2px; height: .85em; background: #9a9490; vertical-align: text-bottom; margin-left: 1px; animation: zblink .85s step-end infinite; }
  .zmd .tool-call-card { margin: .5rem 0; background: #26231f; border: 1px solid #38342f; border-left: 3px solid #8c5f28; border-radius: 8px; overflow: hidden; font-family: "Cascadia Code","Fira Code","JetBrains Mono",Consolas,monospace; font-size: .82rem; }
  .zmd .tool-call-card.pending { border-left-color: #5a5652; }
  .zmd .tool-call-header { display: flex; align-items: center; gap: .5rem; padding: .4rem .75rem; background: #1e1b19; border-bottom: 1px solid #2e2b27; }
  .zmd .tool-call-icon { color: #8c5f28; font-size: .8rem; }
  .zmd .tool-call-name { font-weight: 600; color: #c98a3e; letter-spacing: .02em; }
  .zmd .tool-call-card.pending .tool-call-name { color: #5a5652; animation: zpulse 1.5s ease-in-out infinite; }
  .zmd .tool-call-args { padding: .4rem .75rem .5rem; display: flex; flex-direction: column; gap: .15rem; }
  .zmd .tool-call-arg { display: flex; gap: .4rem; align-items: baseline; flex-wrap: wrap; }
  .zmd .tool-call-arg-key { color: #9a9490; white-space: nowrap; }
  .zmd .tool-call-arg-sep { color: #5a5652; }
  .zmd .tool-call-arg-val { color: #b8d4a4; word-break: break-word; }
  .zmd details.tool-call-card > summary.tool-call-header { cursor: pointer; list-style: none; user-select: none; }
  .zmd details.tool-call-card > summary.tool-call-header::-webkit-details-marker { display: none; }
  .zmd details.tool-call-card:not([open]) > summary.tool-call-header { border-bottom: none; }
  .zmd .tool-call-chevron { width: 9px; height: 9px; color: #5a5652; margin-left: auto; transition: transform .18s; flex-shrink: 0; }
  .zmd details.tool-call-card[open] > summary .tool-call-chevron { transform: rotate(90deg); }
  .zmd .tool-call-badge { font-size: .68rem; font-weight: 600; padding: .05rem .4rem; border-radius: 4px; letter-spacing: .02em; }
  .zmd .tool-call-badge.ok { color: #8fce9b; background: rgba(110,179,154,.12); }
  .zmd .tool-call-badge.err { color: #d99a8f; background: rgba(200,90,80,.13); }
  .zmd .tool-call-badge.pend { color: #8a8074; background: rgba(120,114,108,.12); }
  .zmd .tool-call-badge.run { color: #c9a86a; background: rgba(201,168,106,.13); }
  .zmd .tool-call-spin { display: inline-block; width: .62em; height: .62em; margin-right: .32em; vertical-align: -.04em; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: zspin .7s linear infinite; }
  .zmd .tool-call-out { padding: .35rem .75rem .55rem; border-top: 1px solid #2e2b27; }
  .zmd .tool-call-out-label { font-size: .68rem; color: #9a9490; margin-bottom: .25rem; text-transform: uppercase; letter-spacing: .04em; }
  .zmd .tool-call-out-body { margin: 0; padding: .4rem .55rem; background: #1a1816; border: 1px solid #2e2b27; border-radius: 5px; color: #c7bdb0; font-size: .78rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-height: 18rem; overflow: auto; }
  .zmd .tool-call-out.err .tool-call-out-body { color: #e0b0a6; border-color: #4a322c; }
  .zmd .think-block { margin: .1rem 0 .9rem; }
  .zmd .think-summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: .45rem; font-size: .8rem; color: #7c736a; user-select: none; padding: .2rem 0; transition: color .13s; }
  .zmd .think-summary:hover { color: #9a9490; }
  .zmd .think-summary::-webkit-details-marker { display: none; }
  .zmd .think-brain { width: 24px; height: 24px; color: #e08aa6; flex-shrink: 0; }
  .zmd .think-chevron { width: 9px; height: 9px; color: #5a5652; transition: transform .18s; flex-shrink: 0; }
  .zmd details[open] .think-chevron { transform: rotate(90deg); }
  .zmd .think-label.think-pulse { animation: zpulse 1.5s ease-in-out infinite; }
  .zmd .think-body { margin: .45rem 0 .2rem .15rem; padding-left: .9rem; border-left: 2px solid #2e2b27; color: #8a8074; font-size: .9em; line-height: 1.65; }
  .zmd .think-body p { margin-bottom: .5rem; } .zmd .think-body p:last-child { margin-bottom: 0; }
  .zmd .think-body code { font-size: .8em; }
  .zmd .zdots { display: inline-flex; gap: 5px; align-items: center; margin-left: 6px; }
  .zmd .zdots i { width: 7px; height: 7px; border-radius: 50%; background: #5a5652; display: inline-block; animation: zdot 1.3s ease-in-out infinite; }
  .zmd .zdots i:nth-child(2) { animation-delay: .22s; } .zmd .zdots i:nth-child(3) { animation-delay: .44s; }
  .zmd .zstatus { font-size: .82rem; color: #5a5652; font-style: italic; margin-left: .75rem; }
  /* ── Ring spinner + loading card (startup overlay + in-chat waiting) ───── */
  @keyframes zspin { to { transform: rotate(360deg); } }
  .z-spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #c98a3e; border-top-color: transparent; animation: zspin .9s linear infinite; flex-shrink: 0; box-sizing: border-box; }
  .z-load-card { width: min(520px, 90%); padding: 2rem 2.25rem; background: #1c1a18; border: 1px solid #38342f; border-radius: 14px; box-shadow: 0 10px 32px rgba(0,0,0,0.45); }
  .z-load-eyebrow { font-size: .78rem; font-weight: 650; color: #8a7b6a; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 1.2rem; }
  .z-load-row { display: flex; align-items: center; gap: .75rem; margin-bottom: .95rem; }
  .z-load-cur { font-size: 1.05rem; font-weight: 500; color: #ece8e4; }
  .z-load-track { height: 6px; background: #2a2724; border-radius: 3px; overflow: hidden; margin-bottom: 1.1rem; }
  .z-load-bar { height: 100%; background: linear-gradient(90deg, #c98a3e, #e0a85a); width: 0%; transition: width .25s ease-out; }
  .z-load-list { list-style: none; padding: 0; margin: 0 0 .4rem; }
  .z-load-list li { font-size: .88rem; color: #7c736a; padding: .2rem 0; display: flex; align-items: center; gap: .6rem; }
  .z-load-list li::before { content: '✓'; color: #34d399; font-weight: 700; }
  .z-load-detail { font-size: .82rem; color: #5e554c; margin-top: .6rem; min-height: 1.2em; font-variant-numeric: tabular-nums; }
  @media (max-width: 1024px) { .z-logs { width: 280px !important; } }
  @media (max-width: 720px) {
    .z-sb { position: fixed !important; left: 0; top: 0; bottom: 0; width: 82vw !important; max-width: 320px; z-index: 130 !important; box-shadow: 6px 0 34px rgba(0,0,0,0.55); }
    .z-rsz-l, .z-rsz-r { display: none !important; }
    .z-logs { position: fixed !important; inset: 0 !important; width: auto !important; z-index: 140 !important; }
    .z-files { width: 100% !important; }
    .z-modal-ov { padding: 0 !important; }
    .z-modal { width: 100% !important; max-width: none !important; height: 100% !important; max-height: 100% !important; border-radius: 0 !important; border: none !important; }
  }
  @media (max-width: 560px) { .z-dial-label { display: none !important; } }
  .z-chatscroll > div:last-child { margin-bottom: 2.5rem !important; }
</style>

<body>
<div id="app"></div>

<script src="zend-api.mock.js"></script>
<script src="zend-api.live.js"></script>
<script src="zend-api.js"></script>
<script>
/* ============================================================================
 * Zend UI — vanilla single-file app (plain DOM, no framework).
 * Talks only to window.ZendAPI (the seam); never calls fetch directly.
 * See docs/zend_ui_redesign.md.
 * ========================================================================== */
(function () {
  'use strict';
  const API = window.ZendAPI;
  const ACCENT = '#c98a3e';
  const PROJ_PALETTE = ['#c98a3e', '#6f9ed8', '#6cb39a', '#9b8fdf', '#d08a8a', '#cdb24a'];
  // Below this viewport width the left pane forces to its rail and the
  // projection timeline gutter is hidden, reclaiming horizontal space.
  const NARROW_W = 820;
  // At/above this width the chat reserves a right margin so its content stops
  // left of the floating Logs/Files pills instead of running under them.
  const WIDE_W = 1100;

  // ── tiny hyperscript: real event listeners, html via {html} ──────────────
  function h(tag, props) {
    const el = document.createElement(tag);
    props = props || {};
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'style') el.setAttribute('style', v);
      else if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'ref' && typeof v === 'function') v(el);
      else if (k.length > 2 && k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
    for (let i = 2; i < arguments.length; i++) {
      const kids = arguments[i];
      (Array.isArray(kids) ? kids : [kids]).forEach((kid) => {
        if (kid == null || kid === false) return;
        el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
      });
    }
    return el;
  }

  // ── state ────────────────────────────────────────────────────────────────
  const now = Date.now();

  // Composer-dial preference persistence (per-user, browser-local).
  function dialPref(key, dflt) {
    try {
      const v = parseInt(localStorage.getItem(key), 10);
      return Number.isInteger(v) && v >= 0 && v <= 4 ? v : dflt;
    } catch (_) { return dflt; }
  }
  function saveDialPref(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (_) {}
  }

  const S = {
    conversations: [],   // filled by the async seed at boot (mock is sync, live fetches)
    activeId: null,
    loaded: {},
    showArchived: (function () { try { return localStorage.getItem('zend.showArchived') === '1'; } catch (_) { return false; } })(),
    sidebarCollapsed: false,
    narrow: (typeof window !== 'undefined' && window.innerWidth < NARROW_W),
    wide: (typeof window !== 'undefined' && window.innerWidth >= WIDE_W),
    sidebarW: 220,
    logW: 310,
    dragging: null,
    promptValue: '',
    logsOpen: false,
    // Composer dials are a per-user browser preference (persisted in
    // localStorage, like theme/show-archived), so a new conversation starts
    // with the user's last-chosen settings rather than a hardcoded default.
    effortLevel: dialPref('zend.effort', 2),
    verbosityLevel: dialPref('zend.verbosity', 2),
    toolsLevel: dialPref('zend.tools', 2),
    openMenu: null,
    theme: (function () { try { return localStorage.getItem('zend.theme') || 'dark'; } catch (_) { return 'dark'; } })(),
    themeMenuOpen: false,
    substrateOpen: false,
    substrateNode: null,
    substrateMsg: null,            // the assistant bubble the panel was opened from (decoded tail)
    substrateUserMsg: null,        // the user message preceding it (the active turn body)
    substrateHistory: [],          // prior conversation messages (verbatim, with roles)
    substrateContent: null,        // name → authored section text (fetched lazily)
    substrateTurnContent: {},      // "group::index" → { user, assistant } memory-tier body
    substrateTargetLayer: '',      // the dialogue/target layer name (for message prefixes)
    substrateGlue: null,           // dialect framing markers (system/user/assistant start/end)
    substrateGroupOpen: {},        // group key → open? (default closed/collapsed)
    substrateExpanded: {},         // section key → expanded (show content)?
    filesOpen: false,
    dragActive: false,
    lastUploadedId: null,
    fileView: null,
    thinkOpen: {},
    upload: null,
    boot: { state: 'loading', detail: '', loading: { current: 'Starting', progress: 0, completed: [] } },
  };

  let chatEl = null, logEl = null, promptEl = null, filesListEl = null, substrateEl = null;
  let stream = null, logUnsub = null, hlTimer = null;
  let savedChatScroll = null, savedSubstrateScroll = null;
  // Follow the bottom while streaming, but the instant the user scrolls UP they
  // take over and we leave the scroll alone until they return to the bottom.
  // `stick` is driven solely by the scroller's own scroll events (buildChat);
  // every programmatic scroll keeps `lastScrollTop` in sync right after, so it
  // can never be mistaken for a user scroll-up. (Safe now that streaming patches
  // in place and no longer resets scrollTop with a full rebuild.)
  let stick = true, lastScrollTop = 0, logStick = true;
  const nearBottom = (el) => !el || (el.scrollHeight - el.scrollTop - el.clientHeight) < 24;

  // ── navigation tag ───────────────────────────────────────────────────────
  // The active conversation lives in the URL hash, so a forced reload (after a
  // daemon rebuild) lands the user back on the same conversation. The chat
  // scroll position rides across the reload in sessionStorage.
  function readHashConv() { const m = (location.hash || '').match(/conv=([^&]+)/); return m ? decodeURIComponent(m[1]) : null; }
  function writeHashConv(id) {
    try { const want = id ? ('#conv=' + encodeURIComponent(id)) : ''; if (location.hash !== want) history.replaceState(null, '', location.pathname + location.search + want); } catch (_) {}
  }
  let pendingScroll = (function () { try { const v = sessionStorage.getItem('zend.reload'); sessionStorage.removeItem('zend.reload'); return v ? JSON.parse(v) : null; } catch (_) { return null; } })();
  function saveScrollForReload() { try { sessionStorage.setItem('zend.reload', JSON.stringify({ conv: S.activeId, scroll: chatEl ? chatEl.scrollTop : 0 })); } catch (_) {} }
  // Capture the build on first sighting; force a reload when it changes.
  function checkBuild(st) {
    if (!st || !st.build) return false;
    if (!window.ZEND_BUILD) { window.ZEND_BUILD = st.build; return false; }
    if (st.build !== window.ZEND_BUILD) { saveScrollForReload(); location.reload(); return true; }
    return false;
  }

  function setState(patch, cb) { Object.assign(S, patch); render(); if (cb) cb(); }
  // Streaming updates (tokens / projections) patch ONLY the streaming message's
  // content in place — they never rebuild the whole chat, so the scroller's
  // `scrollTop` is never reset. That's the structural fix for jerky scrolling:
  // with nothing resetting the scroll there's nothing to restore, so the user's
  // scroll is left completely free; we only pin to the bottom when they're
  // already there. Falls back to a full render if the message isn't in the DOM
  // yet (first paint of the turn) or the target conversation isn't on screen.
  let _livePending = false;
  function scheduleLiveUpdate(convId) {
    if (convId !== S.activeId) return;   // off-screen conversation: state is enough
    if (_livePending) return;
    _livePending = true;
    requestAnimationFrame(() => { _livePending = false; liveUpdateStreaming(); });
  }
  function liveUpdateStreaming() {
    // Never rebuild the message DOM out from under an active text selection in
    // the chat — doing so collapses the user's selection mid-copy (and the
    // follow-to-bottom would yank the viewport). The streamed content is held in
    // state, so the next token/projection re-fires this once the selection
    // clears; nothing is lost, the live view just pauses while you select.
    const seln = window.getSelection && window.getSelection();
    if (seln && !seln.isCollapsed && seln.rangeCount && chatEl &&
        chatEl.contains(seln.getRangeAt(0).commonAncestorContainer)) return;
    const conv = activeConv();
    if (!conv || !chatEl) { render(); return; }
    let idx = -1, m = null;
    for (let i = conv.history.length - 1; i >= 0; i--) {
      if (conv.history[i].role === 'assistant') { idx = i; m = conv.history[i]; break; }
    }
    const row = idx >= 0 && chatEl.querySelector('[data-msg="' + idx + '"]');
    const zmd = row && row.querySelector('.zmd');
    if (!zmd) { render(); return; }   // not laid out yet — fall back to full render
    const open = !!S.thinkOpen[conv.id + ':' + idx];
    zmd.innerHTML = nodeHtml(m, open);
    if (!S.narrow) applyProjSegments(zmd, m);
    // Follow the bottom only while the user hasn't scrolled away; keep
    // lastScrollTop in sync so this programmatic move isn't read as a scroll-up.
    if (stick) { chatEl.scrollTop = chatEl.scrollHeight; lastScrollTop = chatEl.scrollTop; }
  }
  function activeConv() { return S.conversations.find((c) => c.id === S.activeId) || null; }

  // ── content rendering (markdown + think + tool calls) ───────────────────
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function mdInline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, (m, c) => '<code>' + c + '</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return s;
  }
  // Auto-wrap runs of ASCII-tree / box-drawing lines (├└│─ etc.) in a ```text
  // fence so file trees and diagrams render monospace instead of ragged prose.
  function preprocess(raw) {
    const TREE_LINE = /[├└│┼┤┬┴─╴]|^\s*[|+\\`][-─ ]/;
    const lines = raw.split('\n');
    const out = [];
    let i = 0;
    while (i < lines.length) {
      if (/^```/.test(lines[i])) {
        out.push(lines[i++]);
        while (i < lines.length && !/^```/.test(lines[i])) out.push(lines[i++]);
        if (i < lines.length) out.push(lines[i++]);
        continue;
      }
      if (TREE_LINE.test(lines[i])) {
        const run = [];
        let j = i;
        while (j < lines.length && !/^```/.test(lines[j])) {
          if (TREE_LINE.test(lines[j]) || (lines[j].trim() === '' && run.length > 0)) run.push(lines[j++]);
          else break;
        }
        while (run.length && run[run.length - 1].trim() === '') run.pop();
        if (run.length >= 2) { out.push('```text'); for (const r of run) out.push(r); out.push('```'); i = j; continue; }
      }
      out.push(lines[i++]);
    }
    return out.join('\n');
  }

  // A list item: leading indent, ordered (`1.`) vs unordered (`-`/`*`), content.
  function listItemMatch(line) {
    const m = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    return m ? { indent: m[1].length, ordered: /\d/.test(m[2]), content: m[3] } : null;
  }
  // Parse a list (with nested sub-lists) starting at lines[i]. Indentation drives
  // nesting: a deeper-indented item becomes a sub-list inside the preceding item;

        h('span', { style: 'margin-left:auto; font-size:0.68rem; color:#7c736a; font-family:ui-monospace,monospace;' }, sp.step || '')),
      bar,
      legend,
      h('div', { style: 'display:flex; justify-content:space-between; align-items:baseline; margin-top:12px;' },
        h('span', { style: 'font-size:0.72rem; color:#9a9490;' }, 'materialized context'),
        h('span', { style: 'font-size:0.7rem; color:#b8b2ac; font-family:ui-monospace,monospace;' }, fmtTok(mat) + ' / ' + fmtTok(sub) + ' tokens')),
      h('div', { style: 'font-size:0.64rem; color:#5a5652; font-family:ui-monospace,monospace; margin-top:6px;' },
        gen + ' tokens in ' + secs.toFixed(1) + 's (' + Math.round(tps) + ' t/s)'));
  }

  function buildFileViewer() {
    const fv = S.fileView;
    const cols = fileColors[fv.kind] || fileColors.text;

    const body = isImg
      ? h('div', { style: 'display:flex; align-items:center; justify-content:center; min-height:280px; padding:40px;', html: '<div style="text-align:center; color:#5a5652;"><svg viewBox="0 0 24 24" fill="none" style="width:40px;height:40px;margin-bottom:10px;"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/><circle cx="8.5" cy="9.5" r="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M5 18l5-5 4 3 2-2 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><div style="font-size:0.82rem;">Image preview unavailable in this demo</div></div>' })

      h('div', { style: 'flex-shrink:0; display:flex; align-items:center; gap:11px; padding:14px 16px; border-bottom:1px solid #2e2b27;' },
        h('span', { style: 'flex-shrink:0; width:32px; height:32px; border-radius:7px; background:' + cols[1] + '; color:' + cols[0] + '; font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; font-family:ui-monospace,monospace;' }, fv.ext),
        h('div', { style: 'flex:1; min-width:0;' },

        h('button', { onClick: () => downloadFile(fv), title: 'Download', style: 'flex-shrink:0; display:flex; align-items:center; gap:5px; font-size:0.74rem; color:#b8b2ac; background:#232120; border:1px solid #38342f; border-radius:7px; padding:5px 10px; cursor:pointer; font-family:inherit;', html: '<svg viewBox="0 0 14 14" fill="none" style="width:11px;height:11px;"><path d="M7 1.5v7M4 6l3 3 3-3M2.5 11.5h9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>&nbsp;Download</span>' }),
        h('button', { onClick: copyFileView, style: 'flex-shrink:0; font-size:0.74rem; color:#b8b2ac; background:#232120; border:1px solid #38342f; border-radius:7px; padding:5px 11px; cursor:pointer; font-family:inherit;' }, 'Copy'),

  function downloadFile(fv) {
    const blob = new Blob([fv.content || ''], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = fv.name;

  }
  function copyFileView(e) { try { navigator.clipboard.writeText((S.fileView && S.fileView.content) || ''); } catch (_) {} flash(e.currentTarget, 'Copied', 'Copy'); }

  // The full materialized context as plain text, reconstructed by CONCATENATING
  // each piece's authored bytes in materialized order — glue markers, section
  // content, turn framing, decoded tail. No trimming and no inserted separators:
  // every separator is itself a materialized piece (dialect markers, and the
  // collection `member_glue` rows the engine emits BETWEEN selected members), so
  // splicing anything in (or stripping anything off) would corrupt the spacing.
  // Backs the projection panel's "Copy all".
  function substrateAllText(node) {
    const sel = (node && node.selection) || { system: [], turns: [] };
    const G = S.substrateGlue, C = S.substrateContent || {};
    const um = S.substrateUserMsg, dm = S.substrateMsg;
    let out = '';
    const add = (s) => { if (s != null) out += s; };
    (sel.system || []).forEach((item) => {
      if (item.kind === 'glue') add(item.content);
      else if (item.kind === 'collection') item.sections.forEach((s) => { if (s.selected) add(C[s.name]); });
      else add(C[item.name]);
    });
    const TC = S.substrateTurnContent || {};
    const positions = ((dm && dm.spans) || []).map((s) => s.start_token || 0);
    const maxEnd = Math.max(1, ...positions);
    const here = node && node.start_token != null ? node.start_token : maxEnd;
    const complete = here >= maxEnd;
    const noThink = !!(G && G.no_think && S.effortLevel === 0);
    const msg = (role, content, open, withNoThink, isSummary) => {
      const isUser = role === 'user';
      // Full framing (live turn / fallback): every turn opens `user_start` (a
      // summary has no user half but is still `user_start`-framed) and closes
      // `assistant_end`; intra markers are baked into the body.
      add(isUser || isSummary ? (G && G.user_start) : (G && G.assistant_start));
      if (isUser && withNoThink) add(G.no_think);
      add(content);
      if (!open) add(isSummary ? (G && G.assistant_end) : isUser ? (G && G.user_end) : (G && G.assistant_end));
    };
    // The WHOLE turn as one continuous string (full sealed token range, with the
    // intra-turn boundary baked in) — never split-and-re-glued. Inter-turn glue
    // comes from the spine. Falls back to the old halves only if `text` is absent.
    const turnInner = (t) => {
      const tc = TC[t.group + '::' + t.index] || {};
      if (tc.text != null) { add(tc.text); return; }
      if (t.kind && t.kind !== 'normal') { add(tc.assistant || tc.user || ''); return; }
      add(tc.user); add(G && G.user_end); add(G && G.assistant_start); add(tc.assistant);
    };
    const materialized = (node && node.materialized) || [];
    if (materialized.length) {
      // Truth: the copied text is the engine's injected spine verbatim — real
      // glue islands (which carry user_start / no_think / assistant_end) plus the
      // sealed turn bodies, in materialized order.
      materialized.forEach((p) => { if (p.kind === 'glue') add(p.text); else if (p.turn) turnInner(p.turn); });
    } else {
      // Pre-spine fallback: reconstruct the inter-turn glue around each
      // continuous full-turn body.
      const reglued = (t) => { add(G && G.user_start); turnInner(t); add(G && G.assistant_end); };
      (sel.turns || []).filter((t) => t.layer && t.layer !== 'dialogue').forEach(reglued);
      (sel.turns || []).filter((t) => (t.layer || 'dialogue') === 'dialogue' && t.index !== 4294967295).forEach(reglued);
    }
    // The live, in-flight turn as one continuous run: user_start (+ /no_think),
    // the user message, the baked role boundary, the assistant decoded-so-far,
    // and assistant_end once complete — matching the panel's single live card.
    if (um || dm) {
      add(G && G.user_start);
      if (noThink) add(G && G.no_think);
      add(um ? um.content : '');
      add(G && G.user_end);
      add(G && G.assistant_start);
      if (dm && dm.role === 'assistant' && (dm.content || '').length) {
        const cut = Math.max(0, Math.min(dm.content.length, Math.round(dm.content.length * here / maxEnd)));
        add(dm.content.slice(0, cut));
      }
      if (complete) add(G && G.assistant_end);
    }
    return out;
  }

  function buildSubstrate() {
    const node = S.substrateNode;
    const sel = (node && node.selection) || { system: [], turns: [] };
    const body = h('div', { class: 'zscroll', ref: (el) => { substrateEl = el; }, style: 'flex:1; min-height:0; overflow-y:auto; padding:13px 15px; background:#161412;' });

    const toggle = (mapKey, key) => {
      const m = Object.assign({}, S[mapKey]); m[key] = !m[key]; setState({ [mapKey]: m });
    };
    const chev = (open) => h('span', { class: 'zsub-chev' + (open ? ' open' : ''), style: 'flex-shrink:0; color:#a89b8a; font-size:10px; width:10px; text-align:center;' }, '▸');

    // One section row: chevron + dot + name + token count, dimmed when
    // provenance skipped it. Clicking expands it to show the authored content
    // (fetched on demand — never stored in the projection event). Content is
    // still loading until the fetch resolves → show a spinner, not stale text.
    const sectionRow = (s, gkey) => {
      const key = gkey + '::' + (s.name || '');
      const open = !!S.substrateExpanded[key];
      const row = h('div', { class: 'zsub-row', onClick: () => toggle('substrateExpanded', key), style: 'cursor:pointer; display:flex; align-items:center; gap:8px; padding:5px 11px 5px 11px; font-size:12px; ' + (s.selected ? 'color:#d8d2cc;' : 'color:#6a6258; opacity:0.6;') },
        chev(open),
        h('span', { style: 'width:6px; height:6px; border-radius:2px; flex-shrink:0; background:' + (s.selected ? '#6cb39a' : '#403b35') + ';' }),
        h('span', { style: 'flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:ui-monospace,monospace;' }, s.name || '(unnamed)'),
        s.selected ? null : h('span', { style: 'font-size:9.5px; color:#5a5652; letter-spacing:0.04em; flex-shrink:0;' }, 'SKIPPED'),
        h('span', { style: 'font-size:10.5px; color:#5a5652; font-family:ui-monospace,monospace; flex-shrink:0;' }, fmtTok(s.tokens) + ' tok'));
      const wrap = h('div', {}, row);
      if (open) {
        if (S.substrateContent == null) {
          wrap.appendChild(h('div', { style: 'display:flex; align-items:center; gap:10px; padding:11px 13px 12px 33px; font-size:11px; color:#8a8178; background:#141210; border-top:1px solid #221f1c;' },
            h('span', { class: 'zspin' }), 'loading content…'));
        } else {
          const txt = S.substrateContent[s.name] != null ? S.substrateContent[s.name] : '(no authored content for this section)';
          wrap.appendChild(h('pre', { style: 'margin:0; padding:8px 13px 10px 33px; font-size:11px; line-height:1.5; color:#bdb6ad; background:#141210; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,monospace; border-top:1px solid #221f1c;' }, txt));
        }
      }
      return wrap;
    };

    // A collapsible group card, collapsed by default. Clicking the header (which
    // highlights on hover and rotates its chevron) toggles its rows.
    const group = (title, sub, accent, gkey, rows) => {
      const open = !!S.substrateGroupOpen[gkey];
      const card = h('div', { style: 'border:1px solid #2e2b27; border-left:3px solid ' + accent + '; border-radius:8px; overflow:hidden; margin:7px 0; background:#1a1816;' },
        h('div', { class: 'zsub-hdr', onClick: () => toggle('substrateGroupOpen', gkey), style: 'cursor:pointer; display:flex; align-items:center; gap:9px; padding:9px 11px; background:#201d1b;' },
          chev(open),
          h('span', { style: 'font-family:ui-monospace,monospace; font-size:12px; color:#ece8e4; font-weight:650;' }, title),
          h('span', { style: 'margin-left:auto; font-size:10.5px; color:#7c736a; font-family:ui-monospace,monospace;' }, sub),
          h('span', { style: 'font-size:9.5px; color:#6a6258; letter-spacing:0.05em; flex-shrink:0;' }, open ? 'HIDE' : 'SHOW')));
      if (open) rows.forEach((r) => card.appendChild(r));
      return card;
    };

    // A glue row — structural template markers (system/tool block envelopes)
    // and the per-turn dialect framing — shown verbatim in materialized order.
    const G = S.substrateGlue;
    // Whitespace-only glue (e.g. the newline BETWEEN selected tools) would render
    // as a blank row; name it instead so the panel reads "newline" rather than
    // showing nothing. Visible markers stay verbatim (trailing newlines trimmed
    // for layout).
    const wsGlueLabel = (s) => {
      if (/^\n+$/.test(s)) return s.length === 1 ? 'newline' : s.length + ' newlines';
      if (/^\t+$/.test(s)) return s.length === 1 ? 'tab' : s.length + ' tabs';
      if (/^ +$/.test(s)) return s.length === 1 ? 'space' : s.length + ' spaces';
      return s.replace(/\t/g, '\\t').replace(/\n/g, '\\n'); // mixed whitespace → escapes
    };
    const glueRow = (text) => {
      const raw = text || '';
      const trimmed = raw.replace(/\n+$/, '');
      const wsOnly = raw !== '' && trimmed.trim() === '';
      const body = wsOnly
        ? h('span', { style: 'opacity:0.6; font-style:italic;' }, wsGlueLabel(raw))
        : trimmed;
      return h('div', { style: 'padding:3px 13px 3px 15px; font-size:10.5px; font-family:ui-monospace,monospace; color:#7d7468; letter-spacing:0.02em; white-space:pre-wrap; word-break:break-word;' },
        h('span', { style: 'color:#9a8f80; margin-right:6px;' }, '⟐'), body);
    };

    // System prompt in materialized order: the engine's structural glue rows
    // (incl. the markers that CLOSE the tool block and system block) interleaved
    // with collapsible content sections and the contributing collection — exactly
    // what the projection emitted. The whole thing is nested in ONE collapsible
    // card, COLLAPSED by default, so the panel opens focused on the conversation;
    // expand it to inspect the full system framing.
    const systemRows = [];
    let sysTokens = 0, sysSel = 0, sysTotal = 0;
    sel.system.forEach((item) => {
      if (item.kind === 'glue') {
        sysTokens += item.tokens || 0;
        systemRows.push(glueRow(item.content));
      } else if (item.kind === 'collection') {
        const picked = item.sections.filter((s) => s.selected).length;
        sysSel += picked; sysTotal += item.sections.length;
        item.sections.forEach((s) => { sysTokens += s.tokens || 0; });
        const gkey = 'col::' + item.name;
        systemRows.push(group(item.name, picked + ' / ' + item.sections.length + ' selected', '#6f9ed8', gkey, item.sections.map((s) => sectionRow(s, gkey))));
      } else {
        sysTokens += item.tokens || 0; sysSel++; sysTotal++;
        systemRows.push(sectionRow({ name: item.name, tokens: item.tokens, selected: true }, 'sys'));
      }
    });
    if (systemRows.length) {
      const secSub = sysTotal ? sysSel + '/' + sysTotal + ' sections' : 'framing';
      const sysSub = secSub + (sysTokens ? ' · ' + fmtTok(sysTokens) + ' tok' : '');
      body.appendChild(group('system prompt', sysSub, '#6f9ed8', 'system', systemRows));
    }

    // Verbatim body text in a pre-wrap block (preserves every space/newline).
    const bodyPre = (txt) => h('pre', { style: 'margin:0; padding:8px 13px 11px 13px; font-size:11px; line-height:1.5; color:#cdc6bd; background:#141210; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,monospace; border-top:1px solid #2e2b27;' }, txt);

    // Colorized turn body: a turn is one continuous string (user content, the
    // baked role boundary `user_end`/`assistant_start`, then assistant content).
    // Split on the dialect markers and tint each part — user purple, assistant
    // green, the boundary markers gray — so the roles are legible at a glance.
    const turnBody = (txt) => {
      let t = txt || '';
      const us = (G && G.user_start) || '', nt = (G && G.no_think) || '';
      const ue = (G && G.user_end) || '', as = (G && G.assistant_start) || '';
      // Peel a leading turn-opener glue (user_start, optional /no_think) so it
      // colors gray as glue, not purple as user content.
      let lead = '';
      if (us && t.startsWith(us)) { lead = us; t = t.slice(us.length); if (nt && t.startsWith(nt)) { lead += nt; t = t.slice(nt.length); } }
      let userPart = '', boundary = '', asstPart = t;
      const i = ue ? t.indexOf(ue) : -1;
      if (i !== -1) {
        userPart = t.slice(0, i);
        let bEnd = i + ue.length;
        const k = as ? t.indexOf(as, i) : -1;
        if (k !== -1) bEnd = k + as.length;
        boundary = t.slice(i, bEnd);
        asstPart = t.slice(bEnd);
      }
      const span = (s, color) => s ? h('span', { style: 'color:' + color + ';' }, s) : null;
      return h('pre', { style: 'margin:0; padding:8px 13px 11px 13px; font-size:11px; line-height:1.5; background:#141210; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,monospace; border-top:1px solid #2e2b27;' },
        span(lead, '#6a6258'), span(userPart, '#a99cd6'), span(boundary, '#6a6258'), span(asstPart, '#7fc6a4'));
    };

    // Render an expanded turn body from its segment-vector LAYOUT (the engine's
    // complete K/V description): each segment colored by role — user purple,
    // assistant green, thinking amber, glue gray — and ETHEREAL segments (glue /
    // thinking with no K/V: the spine-materialized prefix/suffix, a dropped
    // reasoning block) dimmed + italic so "recorded but not in this turn's K/V"
    // is visible at a glance.
    const segMarker = (m) => ({
      system_start: G && G.system_start, user_start: G && G.user_start,
      assistant_start: G && G.assistant_start, im_end: G && (G.user_end || G.assistant_end),
      no_think: G && G.no_think,
    }[m] || ('<' + m + '>'));
    // The turn's segment vector, rendered the SAME way the system prompt is:
    // boundary glue as flat `⟐` rows (so it reads identically to the system
    // framing) interleaved with the content blocks — user (purple), thinking
    // (amber), assistant (green). Ethereal segments (glue/thinking with no K/V:
    // the spine-materialized opener/closer, a dropped reasoning block) dim +
    // italicize so "recorded but not in this turn's K/V" reads at a glance.
    const segmentBody = (layout) => {
      const segs = (layout && layout.segments) || [];
      const wrap = h('div', { style: 'background:#141210; border-top:1px solid #2e2b27; padding:5px 0 7px 0;' });
      segs.forEach((s) => {
        const ethereal = s.kv == null;
        if (s.kind === 'glue') {
          const r = glueRow(segMarker(s.marker));
          // Ethereal glue (the turn's opener/closer, materialized by the spine)
          // stays legible — italic marks it as "not in this turn's own grid"
          // without washing the text out.
          if (ethereal) { r.style.opacity = '0.78'; r.style.fontStyle = 'italic'; }
          wrap.appendChild(r);
          return;
        }
        const color = s.kind === 'user' ? '#a99cd6' : s.kind === 'thinking' ? '#c9a14a' : '#7fc6a4';
        const text = s.text != null ? s.text : (s.kind === 'assistant' ? '∅' : '');
        wrap.appendChild(h('pre', { style: 'margin:0; padding:4px 13px 5px 26px; font-size:11px; line-height:1.5; color:' + color + '; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,monospace;' + (ethereal ? ' opacity:0.45; font-style:italic;' : '') }, text));
      });
      return wrap;
    };

    // One ChatML message as a collapsible card — shared by BOTH the memory tiers
    // and the dialogue so they look identical. Header: "<layer> · <role> message"
    // + token estimate, role-accented left border, clean body. The role markers
    // are flat glue rows OUTSIDE the card; the closer is omitted while
    // `opts.open` (a still-decoding assistant).
    // Per-card badges: FOREST KIND (a `SoT`/`SoS` summary node standing in for
    // the turns beneath it) and WHY the projection picked it (provenance /
    // coverage / recency / anchor, or recent / historical on the rule-based
    // path). Both render inline on the card header so the materialized view
    // shows, in place, when a slot holds a summary instead of the raw turn.
    const tagBadge = (txt, fg, bg) => h('span', { style: 'font-size:8.5px; font-weight:700; letter-spacing:0.04em; padding:1px 6px; border-radius:4px; white-space:nowrap; flex-shrink:0; color:' + fg + '; background:' + bg + ';' }, txt);
    const REASON_NAME = { hard_anchor: 'anchor', provenance_score: 'provenance', recency_decay: 'recency', coverage_fill: 'coverage', refill: 'refill', pending: 'pending', recent: 'recent', historical: 'historical' };
    const kindBadge = (k) => k === 'summary_of_summaries' ? tagBadge('SUMMARY · SoS', '#e8893c', 'rgba(232,137,60,0.18)')
      : k === 'summary_of_turns' ? tagBadge('SUMMARY · SoT', '#d8a23a', 'rgba(216,162,58,0.18)') : null;
    const reasonBadge = (r) => r ? tagBadge('why: ' + (REASON_NAME[r] || r), '#a99cd6', 'rgba(169,156,214,0.15)') : null;

    const pushMsg = (role, content, opts) => {
      opts = opts || {};
      const isUser = role === 'user';
      const isSummary = opts.kind && opts.kind !== 'normal';
      const accent = isSummary ? '#d8a23a' : isUser ? '#9b8fdf' : '#6cb39a';
      const exp = !!S.substrateExpanded[opts.key];
      // INTER-turn markers (user_start / no_think / assistant_end) are the real
      // boundary glue the assembler injects; when `spineGlue` is set they come
      // from the materialized spine (real Glue pieces) and are suppressed here.
      // INTRA-turn markers (user_end before the assistant half, assistant_start
      // opening it) are baked into the turn body and always shown in place. A
      // summary has no user half, so it is `user_start … assistant_end`-framed.
      // `noGlue`: the whole turn is one continuous card — inter-turn glue comes
      // from the materialized spine, intra-turn markers are baked into the body —
      // so the card emits NO glue rows itself.

    // so clicking one shows the decode PREFIX up to its `start_token` — the
    // content whose Q selected it. The decoded turn is never in its own

    // below, and the current user message carries index u32::MAX).

      h('div', { style: 'flex-shrink:0; display:flex; align-items:flex-start; gap:12px; padding:15px 17px; border-bottom:1px solid #2e2b27;' },

          h('div', { style: 'font-size:0.95rem; font-weight:650; color:#ece8e4;' }, 'Projection selection'),

  // Boot/reload state. `reloadPolling` is true while pollStatus owns the screen

  let lastStartedAt = null;

  // Server-authoritative sidebar sync (live only): pick up the titler's label,
  // archive changes from elsewhere, new/removed conversations. The mock has no
  // server to sync against, so this is a no-op there.
  function refreshConversationList() {
    if (window.ZEND_BACKEND_ACTIVE !== 'live') return;
    Promise.resolve(API.seedConversations(now)).then((list) => {
      if (!Array.isArray(list)) return;
      const serverIds = new Set(list.map((c) => String(c.id)));
      let mutated = false;

      // stream and a fresh local draft the user is still composing.
      S.conversations = S.conversations.filter((c) => {

  // Continuous status poll after ready: detect daemon restarts / model reloads
  // and keep the sidebar in sync.
  function periodicSync() {
    if (reloadPolling) return;   // a reload poll already owns the loading screen
    Promise.resolve(API.getStatus()).then((st) => {
      if (checkBuild(st)) return;   // build changed -> reloading
      if (!st || st.state !== 'ready') {
        // Daemon is mid-reload (restart / model reload). Drop back to the
        // loading overlay and hand off to pollStatus until it's ready again,
        // then re-init — previously this just returned and left the stale UI up
        // until the user pressed F5.
        reloadPolling = true;

        pollStatus();

    }).catch(() => {
      // Unreachable — daemon almost certainly restarting. Show the loading
      // overlay and poll until it returns.
      reloadPolling = true;
      S.boot = LOADING_BOOT('Reconnecting');
      S.loaded = {};
      render();
      pollStatus();
    });
  }

  render();      // loading overlay (S.boot starts in the loading state)
  reloadPolling = true;   // the initial model-load poll owns the loading screen
  pollStatus();
  setInterval(periodicSync, 5000);
})();
</script>
</body>
</html>
