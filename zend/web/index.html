  function copyFileView(e) { try { navigator.clipboard.writeText((S.fileView && S.fileView.content) || ''); } catch (_) {} flash(e.currentTarget, 'Copied', 'Copy'); }

  // The full materialized context as plain text, reconstructed by CONCATENATING
  // each piece's authored bytes in materialized order — glue markers, section
  // content, turn framing, decoded tail. No trimming and no inserted separators:
  // every separator is itself a materialized piece (dialect markers, and the
  // collection `member_glue` rows the engine emits BETWEEN selected members), so
  // splicing anything in (or stripping anything off) would corrupt the spacing.
  // Backs the projection panel's "Copy all".
  function substrateAllText(node) {
    const sel = (node && node.selection) || { system: [], turns: [] };
    const G = S.substrateGlue, C = S.substrateContent || {};
    const um = S.substrateUserMsg, dm = S.substrateMsg;
    let out = '';
    const add = (s) => { if (s != null) out += s; };
    (sel.system || []).forEach((item) => {
      if (item.kind === 'glue') add(item.content);
      else if (item.kind === 'collection') item.sections.forEach((s) => { if (s.selected) add(C[s.name]); });
      else add(C[item.name]);
    });
    const TC = S.substrateTurnContent || {};
    const positions = ((dm && dm.spans) || []).map((s) => s.start_token || 0);
    const maxEnd = Math.max(1, ...positions);
    const here = node && node.start_token != null ? node.start_token : maxEnd;
    const complete = here >= maxEnd;
    const noThink = !!(G && G.no_think && S.effortLevel === 0);
    const msg = (role, content, open, withNoThink, isSummary) => {
      const isUser = role === 'user';
      // Full framing (live turn / fallback): every turn opens `user_start` (a
      // summary has no user half but is still `user_start`-framed) and closes
      // `assistant_end`; intra markers are baked into the body.
      add(isUser || isSummary ? (G && G.user_start) : (G && G.assistant_start));
      if (isUser && withNoThink) add(G.no_think);
      add(content);
      if (!open) add(isSummary ? (G && G.assistant_end) : isUser ? (G && G.user_end) : (G && G.assistant_end));
    };
    // The WHOLE turn as one continuous string (full sealed token range, with the
    // intra-turn boundary baked in) — never split-and-re-glued. Inter-turn glue
    // comes from the spine. Falls back to the old halves only if `text` is absent.
    const turnInner = (t) => {
      const tc = TC[t.group + '::' + t.index] || {};
      if (tc.text != null) { add(tc.text); return; }
      if (t.kind && t.kind !== 'normal') { add(tc.assistant || tc.user || ''); return; }
      add(tc.user); add(G && G.user_end); add(G && G.assistant_start); add(tc.assistant);
    };
    const materialized = (node && node.materialized) || [];
    if (materialized.length) {
      // Truth: the copied text is the engine's injected spine verbatim — real
      // glue islands (which carry user_start / no_think / assistant_end) plus the
      // sealed turn bodies, in materialized order.
      materialized.forEach((p) => { if (p.kind === 'glue') add(p.text); else if (p.turn) turnInner(p.turn); });
    } else {
      // Pre-spine fallback: reconstruct the inter-turn glue around each
      // continuous full-turn body.
      const reglued = (t) => { add(G && G.user_start); turnInner(t); add(G && G.assistant_end); };
      (sel.turns || []).filter((t) => t.layer && t.layer !== 'dialogue').forEach(reglued);
      (sel.turns || []).filter((t) => (t.layer || 'dialogue') === 'dialogue' && t.index !== 4294967295).forEach(reglued);
    }
    // The live, in-flight turn as one continuous run: user_start (+ /no_think),
    // the user message, the baked role boundary, the assistant decoded-so-far,
    // and assistant_end once complete — matching the panel's single live card.
    if (um || dm) {
      add(G && G.user_start);
      if (noThink) add(G && G.no_think);
      add(um ? um.content : '');
      add(G && G.user_end);
      add(G && G.assistant_start);
      if (dm && dm.role === 'assistant' && (dm.content || '').length) {
        const cut = Math.max(0, Math.min(dm.content.length, Math.round(dm.content.length * here / maxEnd)));
        add(dm.content.slice(0, cut));
      }
      if (complete) add(G && G.assistant_end);
    }
    return out;
  }

  function buildSubstrate() {
    const node = S.substrateNode;
    const sel = (node && node.selection) || { system: [], turns: [] };
    const body = h('div', { class: 'zscroll', ref: (el) => { substrateEl = el; }, style: 'flex:1; min-height:0; overflow-y:auto; padding:13px 15px; background:#161412;' });

    const toggle = (mapKey, key) => {
      const m = Object.assign({}, S[mapKey]); m[key] = !m[key]; setState({ [mapKey]: m });
    };
    const chev = (open) => h('span', { class: 'zsub-chev' + (open ? ' open' : ''), style: 'flex-shrink:0; color:#a89b8a; font-size:10px; width:10px; text-align:center;' }, '▸');

    // One section row: chevron + dot + name + token count, dimmed when
    // provenance skipped it. Clicking expands it to show the authored content
    // (fetched on demand — never stored in the projection event). Content is
    // still loading until the fetch resolves → show a spinner, not stale text.
    const sectionRow = (s, gkey) => {
      const key = gkey + '::' + (s.name || '');
      const open = !!S.substrateExpanded[key];
      const row = h('div', { class: 'zsub-row', onClick: () => toggle('substrateExpanded', key), style: 'cursor:pointer; display:flex; align-items:center; gap:8px; padding:5px 11px 5px 11px; font-size:12px; ' + (s.selected ? 'color:#d8d2cc;' : 'color:#6a6258; opacity:0.6;') },
        chev(open),
        h('span', { style: 'width:6px; height:6px; border-radius:2px; flex-shrink:0; background:' + (s.selected ? '#6cb39a' : '#403b35') + ';' }),
        h('span', { style: 'flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:ui-monospace,monospace;' }, s.name || '(unnamed)'),
        s.selected ? null : h('span', { style: 'font-size:9.5px; color:#5a5652; letter-spacing:0.04em; flex-shrink:0;' }, 'SKIPPED'),
        // Belief score for a selected member — the provenance confidence that put
        // it in scope (the same `z × margin` value the substrate stamps). Only
        // shown when selected and non-zero; skipped/zero-belief rows stay clean.
        (s.selected && s.score) ? h('span', { style: 'font-size:10px; color:#6cb39a; font-family:ui-monospace,monospace; flex-shrink:0;' }, fmtScore(s.score)) : null,
        h('span', { style: 'font-size:10.5px; color:#5a5652; font-family:ui-monospace,monospace; flex-shrink:0;' }, fmtTok(s.tokens) + ' tok'));
      const wrap = h('div', {}, row);
      if (open) {
        if (S.substrateContent == null) {
          wrap.appendChild(h('div', { style: 'display:flex; align-items:center; gap:10px; padding:11px 13px 12px 33px; font-size:11px; color:#8a8178; background:#141210; border-top:1px solid #221f1c;' },
            h('span', { class: 'zspin' }), 'loading content…'));
        } else {
          const txt = S.substrateContent[s.name] != null ? S.substrateContent[s.name] : '(no authored content for this section)';
          wrap.appendChild(h('pre', { style: 'margin:0; padding:8px 13px 10px 33px; font-size:11px; line-height:1.5; color:#bdb6ad; background:#141210; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,monospace; border-top:1px solid #221f1c;' }, txt));
        }
      }
      return wrap;
    };

    // A collapsible group card, collapsed by default. Clicking the header (which
    // highlights on hover and rotates its chevron) toggles its rows.
    const group = (title, sub, accent, gkey, rows) => {
      const open = !!S.substrateGroupOpen[gkey];
      const card = h('div', { style: 'border:1px solid #2e2b27; border-left:3px solid ' + accent + '; border-radius:8px; overflow:hidden; margin:7px 0; background:#1a1816;' },
        h('div', { class: 'zsub-hdr', onClick: () => toggle('substrateGroupOpen', gkey), style: 'cursor:pointer; display:flex; align-items:center; gap:9px; padding:9px 11px; background:#201d1b;' },
          chev(open),
          h('span', { style: 'font-family:ui-monospace,monospace; font-size:12px; color:#ece8e4; font-weight:650;' }, title),
          h('span', { style: 'margin-left:auto; font-size:10.5px; color:#7c736a; font-family:ui-monospace,monospace;' }, sub),
          h('span', { style: 'font-size:9.5px; color:#6a6258; letter-spacing:0.05em; flex-shrink:0;' }, open ? 'HIDE' : 'SHOW')));
      if (open) rows.forEach((r) => card.appendChild(r));
      return card;
    };

    // A glue row — structural template markers (system/tool block envelopes)
    // and the per-turn dialect framing — shown verbatim in materialized order.
    const G = S.substrateGlue;
    // Whitespace-only glue (e.g. the newline BETWEEN selected tools) would render
    // as a blank row; name it instead so the panel reads "newline" rather than
    // showing nothing. Visible markers stay verbatim (trailing newlines trimmed
    // for layout).
    const wsGlueLabel = (s) => {
      if (/^\n+$/.test(s)) return s.length === 1 ? 'newline' : s.length + ' newlines';
      if (/^\t+$/.test(s)) return s.length === 1 ? 'tab' : s.length + ' tabs';
      if (/^ +$/.test(s)) return s.length === 1 ? 'space' : s.length + ' spaces';
      return s.replace(/\t/g, '\\t').replace(/\n/g, '\\n'); // mixed whitespace → escapes
    };
    const glueRow = (text) => {
      const raw = text || '';
      const trimmed = raw.replace(/\n+$/, '');
      const wsOnly = raw !== '' && trimmed.trim() === '';
      const body = wsOnly
        ? h('span', { style: 'opacity:0.6; font-style:italic;' }, wsGlueLabel(raw))
        : trimmed;
      return h('div', { style: 'padding:3px 13px 3px 15px; font-size:10.5px; font-family:ui-monospace,monospace; color:#7d7468; letter-spacing:0.02em; white-space:pre-wrap; word-break:break-word;' },
        h('span', { style: 'color:#9a8f80; margin-right:6px;' }, '⟐'), body);
    };

    // System prompt in materialized order: the engine's structural glue rows
    // (incl. the markers that CLOSE the tool block and system block) interleaved
    // with collapsible content sections and the contributing collection — exactly
    // what the projection emitted. The whole thing is nested in ONE collapsible
    // card, COLLAPSED by default, so the panel opens focused on the conversation;
    // expand it to inspect the full system framing.
    const systemRows = [];
    let sysTokens = 0, sysSel = 0, sysTotal = 0;
    sel.system.forEach((item) => {
      if (item.kind === 'glue') {
        sysTokens += item.tokens || 0;
        systemRows.push(glueRow(item.content));
      } else if (item.kind === 'collection') {
        const picked = item.sections.filter((s) => s.selected).length;
        sysSel += picked; sysTotal += item.sections.length;
        item.sections.forEach((s) => { sysTokens += s.tokens || 0; });
        const gkey = 'col::' + item.name;
        systemRows.push(group(item.name, picked + ' / ' + item.sections.length + ' selected', '#6f9ed8', gkey, item.sections.map((s) => sectionRow(s, gkey))));
      } else {
        sysTokens += item.tokens || 0; sysSel++; sysTotal++;
        systemRows.push(sectionRow({ name: item.name, tokens: item.tokens, selected: true }, 'sys'));
      }
    });
    if (systemRows.length) {
      const secSub = sysTotal ? sysSel + '/' + sysTotal + ' sections' : 'framing';
      const sysSub = secSub + (sysTokens ? ' · ' + fmtTok(sysTokens) + ' tok' : '');
      body.appendChild(group('system prompt', sysSub, '#6f9ed8', 'system', systemRows));
    }

    // Verbatim body text in a pre-wrap block (preserves every space/newline).
    const bodyPre = (txt) => h('pre', { style: 'margin:0; padding:8px 13px 11px 13px; font-size:11px; line-height:1.5; color:#cdc6bd; background:#141210; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,monospace; border-top:1px solid #2e2b27;' }, txt);

    // Colorized turn body: a turn is one continuous string (user content, the
    // baked role boundary `user_end`/`assistant_start`, then assistant content).
    // Split on the dialect markers and tint each part — user purple, assistant
    // green, the boundary markers gray — so the roles are legible at a glance.
    const turnBody = (txt) => {
      let t = txt || '';
      const us = (G && G.user_start) || '', nt = (G && G.no_think) || '';
      const ue = (G && G.user_end) || '', as = (G && G.assistant_start) || '';
      // Peel a leading turn-opener glue (user_start, optional /no_think) so it
      // colors gray as glue, not purple as user content.
      let lead = '';
      if (us && t.startsWith(us)) { lead = us; t = t.slice(us.length); if (nt && t.startsWith(nt)) { lead += nt; t = t.slice(nt.length); } }
      let userPart = '', boundary = '', asstPart = t;
      const i = ue ? t.indexOf(ue) : -1;
      if (i !== -1) {
        userPart = t.slice(0, i);
        let bEnd = i + ue.length;
        const k = as ? t.indexOf(as, i) : -1;
        if (k !== -1) bEnd = k + as.length;
        boundary = t.slice(i, bEnd);
        asstPart = t.slice(bEnd);
      }
      const span = (s, color) => s ? h('span', { style: 'color:' + color + ';' }, s) : null;
      return h('pre', { style: 'margin:0; padding:8px 13px 11px 13px; font-size:11px; line-height:1.5; background:#141210; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,monospace; border-top:1px solid #2e2b27;' },
        span(lead, '#6a6258'), span(userPart, '#a99cd6'), span(boundary, '#6a6258'), span(asstPart, '#7fc6a4'));
    };

    // Render an expanded turn body from its segment-vector LAYOUT (the engine's
    // complete K/V description): each segment colored by role — user purple,
    // assistant green, thinking amber, glue gray — and ETHEREAL segments (glue /
    // thinking with no K/V: the spine-materialized prefix/suffix, a dropped
    // reasoning block) dimmed + italic so "recorded but not in this turn's K/V"
    // is visible at a glance.
    const segMarker = (m) => ({
      system_start: G && G.system_start, user_start: G && G.user_start,
      assistant_start: G && G.assistant_start, im_end: G && (G.user_end || G.assistant_end),
      no_think: G && G.no_think,
    }[m] || ('<' + m + '>'));
    // The turn's segment vector, rendered the SAME way the system prompt is:
    // boundary glue as flat `⟐` rows (so it reads identically to the system
    // framing) interleaved with the content blocks — user (purple), thinking
    // (amber), assistant (green). Ethereal segments (glue/thinking with no K/V:
    // the spine-materialized opener/closer, a dropped reasoning block) dim +
    // italicize so "recorded but not in this turn's K/V" reads at a glance.
    const segmentBody = (layout) => {
      const segs = (layout && layout.segments) || [];
      const wrap = h('div', { style: 'background:#141210; border-top:1px solid #2e2b27; padding:5px 0 7px 0;' });
      segs.forEach((s) => {
        const ethereal = s.kv == null;
        if (s.kind === 'glue') {
          const r = glueRow(segMarker(s.marker));
          // Ethereal glue (the turn's opener/closer, materialized by the spine)
          // stays legible — italic marks it as "not in this turn's own grid"
          // without washing the text out.
          if (ethereal) { r.style.opacity = '0.78'; r.style.fontStyle = 'italic'; }
          wrap.appendChild(r);
          return;
        }
        const color = s.kind === 'user' ? '#a99cd6' : s.kind === 'thinking' ? '#c9a14a' : '#7fc6a4';
        const text = s.text != null ? s.text : (s.kind === 'assistant' ? '∅' : '');
        wrap.appendChild(h('pre', { style: 'margin:0; padding:4px 13px 5px 26px; font-size:11px; line-height:1.5; color:' + color + '; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,monospace;' + (ethereal ? ' opacity:0.45; font-style:italic;' : '') }, text));
      });
      return wrap;
    };

    // One ChatML message as a collapsible card — shared by BOTH the memory tiers
    // and the dialogue so they look identical. Header: "<layer> · <role> message"
    // + token estimate, role-accented left border, clean body. The role markers
    // are flat glue rows OUTSIDE the card; the closer is omitted while
    // `opts.open` (a still-decoding assistant).
    // Per-card badges: FOREST KIND (a `SoT`/`SoS` summary node standing in for
    // the turns beneath it) and WHY the projection picked it (provenance /
    // coverage / recency / anchor, or recent / historical on the rule-based
    // path). Both render inline on the card header so the materialized view
    // shows, in place, when a slot holds a summary instead of the raw turn.
    const tagBadge = (txt, fg, bg) => h('span', { style: 'font-size:8.5px; font-weight:700; letter-spacing:0.04em; padding:1px 6px; border-radius:4px; white-space:nowrap; flex-shrink:0; color:' + fg + '; background:' + bg + ';' }, txt);
    const REASON_NAME = { hard_anchor: 'anchor', provenance_score: 'provenance', recency_decay: 'recency', coverage_fill: 'coverage', refill: 'refill', pending: 'pending', recent: 'recent', historical: 'historical' };
    const kindBadge = (k) => k === 'summary_of_summaries' ? tagBadge('SUMMARY · SoS', '#e8893c', 'rgba(232,137,60,0.18)')
      : k === 'summary_of_turns' ? tagBadge('SUMMARY · SoT', '#d8a23a', 'rgba(216,162,58,0.18)') : null;
    const reasonBadge = (r) => r ? tagBadge('why: ' + (REASON_NAME[r] || r), '#a99cd6', 'rgba(169,156,214,0.15)') : null;

    const pushMsg = (role, content, opts) => {
      opts = opts || {};
      const isUser = role === 'user';
      const isSummary = opts.kind && opts.kind !== 'normal';
      const accent = isSummary ? '#d8a23a' : isUser ? '#9b8fdf' : '#6cb39a';
      const exp = !!S.substrateExpanded[opts.key];
      // INTER-turn markers (user_start / no_think / assistant_end) are the real
      // boundary glue the assembler injects; when `spineGlue` is set they come
      // from the materialized spine (real Glue pieces) and are suppressed here.
      // INTRA-turn markers (user_end before the assistant half, assistant_start
      // opening it) are baked into the turn body and always shown in place. A
      // summary has no user half, so it is `user_start … assistant_end`-framed.
      // `noGlue`: the whole turn is one continuous card — inter-turn glue comes
      // from the materialized spine, intra-turn markers are baked into the body —
      // so the card emits NO glue rows itself.
      const spine = !!opts.spineGlue;
      const noGlue = !!opts.noGlue;
      if (G && !noGlue) {
        const openInter = isUser || isSummary; // user_start (inter) vs assistant_start (intra)
        if (!(spine && openInter)) body.appendChild(glueRow(openInter ? G.user_start : G.assistant_start));
      }
      // `/no_think` glue after `user_start` (inter): prior turns pass their
      // recorded flag, the in-flight turn passes the live effort dial.
      if (isUser && opts.noThink && !spine && !noGlue && G && G.no_think) body.appendChild(glueRow(G.no_think));
      const tok = opts.tokens != null ? fmtTok(opts.tokens) : fmtTok(Math.max(1, Math.round((content || '').length / 4)));
      // A summary is its own thing; a full continuous turn is "turn"; otherwise a
      // single user/assistant half (fallback). `opts.label` overrides.
      const label = (opts.layer ? opts.layer + ' · ' : '') + (opts.label || (isSummary ? 'summary' : role + ' message')) + (opts.suffix || '');
      const wrap = h('div', { style: 'border:1px solid #2e2b27; border-left:3px solid ' + accent + '; border-radius:6px; overflow:hidden; margin:3px 0; background:#1a1816;' },
        h('div', { class: 'zsub-hdr', onClick: () => toggle('substrateExpanded', opts.key), style: 'cursor:pointer; display:flex; align-items:center; gap:8px; padding:7px 11px; background:#201d1b;' },
          chev(exp),
          h('span', { style: 'min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:ui-monospace,monospace; font-size:12px; color:#ece8e4; font-weight:600;' }, label),
          kindBadge(opts.kind),
          reasonBadge(opts.reason),
          h('span', { style: 'flex:1;' }),
          h('span', { style: 'font-size:10.5px; color:#7c736a; font-family:ui-monospace,monospace; flex-shrink:0;' }, tok + ' tokens')));
      if (exp) {
        // Truth-first: when the turn carries its stored segment vector, render it
        // verbatim (glue/user/thinking/assistant, real vs ethereal). Only when no
        // vector is present (a turn sealed before the layout existed) do we fall
        // back to colorized / plain body text.
        const hasSegs = opts.layout && opts.layout.segments && opts.layout.segments.length;
        wrap.appendChild(hasSegs ? segmentBody(opts.layout) : opts.colorize ? turnBody(content || '') : bodyPre(content || ''));
      }
      body.appendChild(wrap);
      if (G && !opts.open && !noGlue) {
        const closeInter = isSummary || !isUser; // assistant_end (inter) vs user_end (intra)
        if (!(spine && closeInter)) body.appendChild(glueRow(closeInter ? G.assistant_end : G.user_end));
      }
    };

    const targetLayer = S.substrateTargetLayer || 'dialogue';

    // Lower-layer memory tiers (repo_map, code_reading, …) projected into the
    // window — between the system prompt and the dialogue. Each turn renders as
    // two messages (user + assistant), identical in style to the conversation,
    // prefixed with the originating layer.
    const otherTurns = (sel.turns || []).filter((t) => t.layer && t.layer !== targetLayer)
      .slice().sort((a, b) => ((a.layer || '') + (a.group || '')).localeCompare((b.layer || '') + (b.group || '')) || (a.index || 0) - (b.index || 0));

    // The conversation is rendered from the engine's MATERIALIZED spine (the
    // `assemble_pieces` output carried on the event): real boundary-glue islands
    // interleaved with the sealed turns — memory tiers + dialogue, summaries in
    // place. This is the literal injected order/glue, not a reconstruction.
    const dm = S.substrateMsg, um = S.substrateUserMsg;
    // Projection events are POINTS: each `start_token` is the generated-token
    // position at which that projection was selected (SubmitTurn = 0). A
    // projection governs everything forward until the next event supersedes it,
    // so clicking one shows the decode PREFIX up to its `start_token` — the
    // content whose Q selected it. The decoded turn is never in its own
    // projection (not sealed during decode), so there is no self-inclusion.
    const positions = ((dm && dm.spans) || []).map((s) => s.start_token || 0);
    const maxEnd = Math.max(1, ...positions);
    const here = node && node.start_token != null ? node.start_token : maxEnd;

    // The sealed dialogue turns the projection actually selected (the live,
    // still-decoding turn is NOT one of them — it is rendered from `um`/`dm`
    // below, and the current user message carries index u32::MAX).
    const dialogueTurns = (sel.turns || []).filter((t) => (t.layer || targetLayer) === targetLayer && t.index !== 4294967295);
    const TCd = S.substrateTurnContent || {};
    // Render one materialized turn (memory tier or dialogue) as ONE card. Its body
    // (on expand) is the turn's stored segment vector — user / assistant / thinking
    // with boundary glue rendered INSIDE it (`segmentBody`) — falling back to
    // colorized text when a turn has no vector. `noGlue`: the card emits no glue
    // rows of its own; all glue lives inside the segment vector.
    const renderTurn = (t) => {
      const tc = TCd[t.group + '::' + t.index] || {};
      const isSummary = t.kind && t.kind !== 'normal';
      const full = tc.text != null ? tc.text
        : (isSummary ? (tc.assistant || tc.user || '') : ((tc.user || '') + (tc.assistant || '')));
      pushMsg('assistant', full, { layer: t.layer || targetLayer, key: 'conv::' + t.group + '::' + t.index, kind: t.kind, reason: t.reason, noGlue: true, colorize: true, layout: tc.layout, label: isSummary ? 'summary' : 'turn', tokens: t.tokens });
    };
    const materialized = (node && node.materialized) || [];
    if (materialized.length) {
      // Walk the injected spine for turn ORDER; each turn renders its own glue in
      // place. Every turn here is genuine attended CONTEXT — the turn being decoded
      // is drawn separately below as the decoded-turn card (from `um`/`dm`) and is
      // never in the spine, since projection events are emitted during decode
      // before the turn seals. So there is nothing to skip.
      materialized.forEach((p) => {
        if (p.kind === 'turn' && p.turn) renderTurn(p.turn);
      });
    } else {
      // Fallback for event records predating the materialized spine.
      otherTurns.forEach(renderTurn);
      dialogueTurns.forEach((t) => renderTurn({ ...t, layer: targetLayer }));
    }
    // The turn THIS event decoded — user prompt (the attended query) + the assistant
    // text that was actually IN SCOPE when provenance last selected, clipped there.
    // A mid-decode reprojection carries that point directly in `here`. The post-seal
    // "answer" event is stamped t=full, but its selection was computed from the
    // decode as of the LAST mid-decode re-scan — so for it we clip at that point
    // (or at nothing for a short turn that never re-scanned mid-decode), giving the
    // SAME clipped "decoding" view every other projection shows, never the whole
    // finished turn. Drawn below the attended context (it is this decode's output).
    if (um || dm) {
      // This projection is a point at `here` (its `start_token`): show the decode
      // PREFIX up to there — the content whose Q selected this context. The
      // SubmitTurn event (`here == 0`) clips to nothing, since the turn opens
      // against it before decoding a single token. `maxEnd` is the last
      // projection's position, so the char mapping is approximate past it.
      const clipTok = here;
      const clen = (dm && dm.content) ? dm.content.length : 0;
      const clipCut = Math.max(0, Math.min(clen, Math.round(clen * clipTok / maxEnd)));
      const scoped = (dm && dm.role === 'assistant') ? dm.content.slice(0, clipCut) : '';
      const liveNoThink = !!(G && G.no_think && S.effortLevel === 0);
      const lead = G ? (G.user_start + (liveNoThink && G.no_think ? G.no_think : '')) : '';
      const liveText = lead + (um ? um.content : '') + (G ? (G.user_end + G.assistant_start) : '') + scoped;
      pushMsg('assistant', liveText, { layer: targetLayer, key: 'conv::live', noGlue: true, colorize: true, label: 'turn', suffix: ' · decoding', open: true });
    }

    const empty = !sel.system.length && !(sel.turns || []).length && !um && !dm;
    const modal = h('div', { class: 'z-modal', onClick: (e) => e.stopPropagation(), style: 'width:min(880px,95%); max-height:86vh; display:flex; flex-direction:column; background:#1c1a18; border:1px solid #38342f; border-radius:14px; box-shadow:0 18px 60px rgba(0,0,0,0.6); overflow:hidden;' },
      h('div', { style: 'flex-shrink:0; display:flex; align-items:flex-start; gap:12px; padding:15px 17px; border-bottom:1px solid #2e2b27;' },
        h('div', { style: 'flex:1; min-width:0;' },
          h('div', { style: 'font-size:0.95rem; font-weight:650; color:#ece8e4;' }, 'Projection selection'),
          h('div', { style: 'font-size:0.73rem; color:#7c736a; font-family:ui-monospace,monospace; margin-top:3px; word-break:break-word;' }, !node ? '' : ((node.step || '') + ' · materialized ' + fmtTok(node.materialized_tokens) + ' / ' + fmtTok(node.substrate_tokens) + ' tokens' + (node._tps ? ' · ' + Math.round(node._tps) + ' t/s' : '')))),
        empty ? null : h('button', { onClick: (e) => copyText(substrateAllText(node), e.currentTarget, 'Copied', 'Copy all'), style: 'flex-shrink:0; font-size:0.74rem; color:#b8b2ac; background:#232120; border:1px solid #38342f; border-radius:7px; padding:5px 11px; cursor:pointer; font-family:inherit;' }, 'Copy all'),
        h('button', { onClick: () => setState({ substrateOpen: false }), style: closeBtnStyle() }, '×')),
      empty ? h('div', { style: 'flex:1; padding:30px; color:#7c736a; font-size:0.85rem; background:#161412;' }, 'No selection recorded for this projection.') : body);
    return h('div', { class: 'z-modal-ov', onClick: () => setState({ substrateOpen: false }), style: modalOvStyle(400) }, modal);
  }

  // ── logs pane ────────────────────────────────────────────────────────────
  function buildLogs() {
    const listEl = h('div', { class: 'zscroll-log', ref: (el) => { logEl = el; }, style: "flex:1; min-height:0; overflow-y:auto; font-family:'Cascadia Code','Fira Code','JetBrains Mono',Consolas,monospace; font-size:11px; line-height:1.55; padding:0.3rem 0;" });
    logs.forEach((l) => {
      const cc = logColors(l.level);
      listEl.appendChild(h('div', { style: 'display:grid; grid-template-columns:54px 42px 1fr; gap:0 0.4rem; padding:0.12rem 0.65rem; align-items:center; min-width:0;' },
        h('span', { style: 'color:#4a4540; white-space:nowrap; overflow:hidden; user-select:none; font-size:10px;' }, l.ts),
        h('span', { style: 'font-size:9px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; white-space:nowrap; padding:0.15em 0.4em; border-radius:3px; text-align:center; color:' + cc[0] + '; background:' + cc[1] + ';' }, l.level),
        h('span', { style: 'min-width:0; word-break:break-word; white-space:pre-wrap;', html: '<span style="color:#56504a;">' + esc(l.target) + '</span><span style="color:#2a2724;"> › </span><span style="color:#c0bbb6;">' + esc(l.msg) + '</span>' })));
    });
    return h('div', { class: 'z-logs', style: 'flex-shrink:0; width:' + S.logW + 'px; height:100%; display:flex; flex-direction:column; background:#0f0e0d; overflow:hidden;' },
      h('div', { style: 'flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0.9rem 0.75rem 0.75rem; border-bottom:1px solid #252220; background:#0f0e0d;' },
        h('span', { style: 'font-size:0.78rem; font-weight:650; color:#5a5450; letter-spacing:0.06em; text-transform:uppercase;' }, 'Logs'),
        h('div', { style: 'display:flex; align-items:center; gap:0.55rem;' },
          (function () {
            const st = (typeof window !== 'undefined' && window.__ZEND_LOG_WS__) || 'ok';
            const col = st === 'ok' ? '#34d399' : st === 'wait' ? '#d4a020' : '#e05555';
            const title = st === 'ok' ? 'connected' : st === 'wait' ? 'connecting…' : 'disconnected — reconnecting';
            return h('span', { title, style: 'width:7px; height:7px; border-radius:50%; background:' + col + '; box-shadow:0 0 5px ' + col + '66;' });
          })(),
          h('button', { onClick: () => { logs = []; renderLogsOnly(); }, style: 'font-size:0.68rem; color:#5a5652; background:none; border:1px solid #252220; border-radius:4px; padding:0.12rem 0.45rem; cursor:pointer; font-family:inherit;' }, 'Clear'),
          h('button', { onClick: () => setState({ logsOpen: false }), title: 'Hide logs', style: 'display:flex; align-items:center; gap:4px; font-size:0.68rem; color:#9a9490; background:none; border:1px solid #3a3530; border-radius:4px; padding:0.12rem 0.5rem; cursor:pointer; font-family:inherit;', html: '<svg viewBox="0 0 12 12" fill="none" style="width:9px;height:9px;"><path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>&nbsp;Hide</span>' }))),
      listEl);
  }
  function renderLogsOnly() {
    if (!S.logsOpen) return;
    const old = document.querySelector('.z-logs');
    if (!old || !old.parentNode) { render(); return; }
    if (logEl) logStick = nearBottom(logEl);
    old.parentNode.replaceChild(buildLogs(), old);  // buildLogs reassigns logEl via ref
    if (logStick) scrollLog();
  }

  // ── small shared bits ────────────────────────────────────────────────────
  function iconBtn(path, title, onClick, size) {
    const s = size || 27;
    return h('button', { title, onClick, style: 'width:' + s + 'px; height:' + s + 'px; border-radius:' + (s > 30 ? 8 : 6) + 'px; border:1px solid #334455; background:transparent; color:' + (s > 30 ? '#8ba0b6' : '#6a8098') + '; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;', html: '<svg viewBox="0 0 14 14" fill="none" style="width:' + Math.round(s * 0.45) + 'px;height:' + Math.round(s * 0.45) + 'px;"><path d="' + path + '" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>' });
  }
  function closeBtnStyle() { return 'flex-shrink:0; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-size:15px; color:#7c736a; background:none; border:1px solid #38342f; border-radius:7px; cursor:pointer; padding:0;'; }
  function modalOvStyle(z) { return 'position:fixed; inset:0; z-index:' + z + '; background:rgba(0,0,0,0.62); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; padding:40px;'; }
  function starLogo(sz, hole, rx) {
    rx = rx || 7.5;
    return '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 32 32" style="flex-shrink:0;display:block;"><rect width="32" height="32" rx="' + rx + '" fill="' + hole + '"/><path d="M16 2.5 C 16.4,9.8 22.2,15.6 29.5,16 C 22.2,16.4 16.4,22.2 16,29.5 C 15.6,22.2 9.8,16.4 2.5,16 C 9.8,15.6 15.6,9.8 16,2.5 Z" fill="#c98a3e"/><circle cx="16" cy="16" r="3.2" fill="' + hole + '" opacity="0.55"/></svg>';
  }
  function flash(btn, on, off) { if (btn) { btn.textContent = on; setTimeout(() => { btn.textContent = off; }, 1400); } }
  // Robust clipboard copy. navigator.clipboard.writeText rejects ASYNC (a bare
  // try/catch won't trap it and the button would lie "Copied"), so we await it
  // and fall back to a hidden-textarea execCommand. Flashes only on success.
  function copyText(text, btn, on, off) {
    const done = (ok) => { if (ok && btn) flash(btn, on || 'Copied', off || (btn.textContent || 'Copy')); };
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy'); document.body.removeChild(ta);
        return ok;
      } catch (_) { return false; }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => done(fallback()));
    } else {
      done(fallback());
    }
  }

  // ── startup / model-loading overlay (GET /v1/status) ─────────────────────
  function buildLoadingScreen(boot) {
    const ld = (boot && boot.loading) || { current: 'Loading model', progress: 0, completed: [] };
    const pct = Math.round((ld.progress || 0) * 100);
    const completed = (ld.completed || []).map((step) => h('li', {}, step));
    const card = h('div', { class: 'z-load-card' },
      h('div', { class: 'z-load-eyebrow' }, 'Starting up'),
      h('div', { class: 'z-load-row' },
        h('div', { class: 'z-spin' }),
        h('span', { class: 'z-load-cur' }, ld.current || 'Loading model')),
      h('div', { class: 'z-load-track' }, h('div', { class: 'z-load-bar', style: 'width:' + pct + '%;' })),
      completed.length ? h('ul', { class: 'z-load-list' }, completed) : null,
      h('div', { class: 'z-load-detail' }, (boot && boot.detail) || ''));
    return h('div', { style: 'position:fixed; inset:0; background:#1c1917; display:flex; align-items:center; justify-content:center; z-index:500;' }, card);
  }

  // ── global handlers ──────────────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (S.themeMenuOpen) setState({ themeMenuOpen: false });
    else if (S.openMenu) setState({ openMenu: null });
    else if (S.fileView) setState({ fileView: null });
    else if (S.substrateOpen) setState({ substrateOpen: false });
    else if (S.filesOpen) setState({ filesOpen: false });
  });
  // Keep focus in the composer when clicking inert chrome, but NEVER
  // suppress the default on interactive controls or on selectable text —
  // `preventDefault` on mousedown cancels the browser's text selection, so
  // suppressing it everywhere made chat/file content impossible to select
  // and copy.
  document.addEventListener('mousedown', (e) => {
    const t = e.target;
    if (t && t.closest && t.closest('textarea, input, select, [contenteditable], button, a, label, [data-act], .z-selectable')) return;
    e.preventDefault();
  });
  document.addEventListener('click', (e) => {
    const btn = e.target.closest && e.target.closest('.copy-btn');
    if (!btn) return;
    const cb = btn.closest('.code-block'); const code = cb && cb.querySelector('code');
    if (code) { try { navigator.clipboard.writeText(code.innerText); } catch (_) {} btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy'; }, 1600); }
  });
  document.addEventListener('toggle', (e) => {
    const det = e.target;
    if (det && det.classList && det.classList.contains('think-block')) {
      const turn = det.closest('[data-msg]');
      if (turn) { const key = S.activeId + ':' + turn.getAttribute('data-msg'); S.thinkOpen = Object.assign({}, S.thinkOpen, { [key]: det.open }); }
    }
    // No reposition needed: the bar gutter is align-self:stretch, so when a
    // think block expands/collapses the bars re-flow by CSS % automatically.
  }, true);
  window.addEventListener('resize', () => {
    const narrow = window.innerWidth < NARROW_W;
    const wide = window.innerWidth >= WIDE_W;
    if (narrow !== S.narrow || wide !== S.wide) setState({ narrow, wide });
  });

  // ── boot ─────────────────────────────────────────────────────────────────
  // Poll GET /v1/status until the daemon is ready (showing the loading overlay
  // while the model loads), then do the async-tolerant initial load: the mock
  // seeds synchronously, the live adapter fetches GET /v1/conversations. Either
  // way we pick an active conversation (prefer hydrated, else first) + hydrate.
  logUnsub = API.subscribeLogs((line) => addLog(line));

  function initConversations() {
    Promise.resolve(API.seedConversations(now)).then((list) => {
      S.conversations = list || [];
      const hashId = readHashConv();
      // Restore ONLY the conversation the user actually had open (carried in the
      // URL hash) — never auto-select one otherwise. A reload with nothing open,
      // or with everything archived, lands on the new-conversation home page
      // instead of jumping into some chat. The hash still has to point at a
      // *visible* conversation (respects the "show archived" toggle), which is also
      // how a daemon-rebuild auto-reload returns you to the chat you were in.
      const visible = (c) => !!c && (S.showArchived || !c.archived);
      const hashConv = hashId && S.conversations.find((c) => String(c.id) === String(hashId) && visible(c));
      S.activeId = hashConv ? hashConv.id : null;
      if (S.activeId) {
        const a = S.conversations.find((c) => c.id === S.activeId);
        S.loaded[S.activeId] = !!(a && a.history && a.history.length);
      }
      render();
      focusPrompt();
      if (S.activeId && !S.loaded[S.activeId]) hydrateIfNeeded(S.activeId);
      window.__ZEND_READY__ = true;
    }).catch((e) => {
      if (window.console) console.error('seedConversations failed', e);
      render();
      window.__ZEND_READY__ = true;
    });
  }

  // Boot/reload state. `reloadPolling` is true while pollStatus owns the screen
  // (initial load OR a detected daemon reload), so periodicSync stays out of the
  // way. `lastStartedAt` tracks the daemon's start stamp to detect restarts.
  let lastStartedAt = null;
  let reloadPolling = false;
  const LOADING_BOOT = (label) => ({ state: 'loading', detail: '', loading: { current: label, progress: 0, completed: [] } });

  function pollStatus() {
    Promise.resolve(API.getStatus()).then((st) => {
      checkBuild(st);   // capture the build id on first sighting
      if (st && st.state === 'ready') {
        reloadPolling = false;
        if (st.started_at_ms != null) lastStartedAt = st.started_at_ms;
        S.boot = null;
        initConversations();
      } else {
        S.boot = st || S.boot || LOADING_BOOT('Loading model');
        render();
        setTimeout(pollStatus, 1000);
      }
    }).catch(() => { S.boot = S.boot || LOADING_BOOT('Reconnecting'); render(); setTimeout(pollStatus, 1000); });
  }

  // Server-authoritative sidebar sync (live only): pick up the titler's label,
  // archive changes from elsewhere, new/removed conversations. The mock has no
  // server to sync against, so this is a no-op there.
  function refreshConversationList() {
    if (window.ZEND_BACKEND_ACTIVE !== 'live') return;
    Promise.resolve(API.seedConversations(now)).then((list) => {
      if (!Array.isArray(list)) return;
      const serverIds = new Set(list.map((c) => String(c.id)));
      let mutated = false;
      // Drop entries the server no longer knows about — but keep the in-flight
      // stream and a fresh local draft the user is still composing.
      S.conversations = S.conversations.filter((c) => {
        if (c.streaming || c.id === S.activeId) return true;
        if (!serverIds.has(String(c.id))) { delete S.loaded[c.id]; mutated = true; return false; }
        return true;
      });
      list.forEach((e) => {
        const ex = S.conversations.find((c) => String(c.id) === String(e.id));
        if (ex) {
          if (e.title && e.title !== ex.title) { ex.title = e.title; mutated = true; }   // titler is authoritative
          if (!!e.archived !== !!ex.archived) { ex.archived = !!e.archived; mutated = true; }
          if (e.updated_ms) ex.updated_ms = e.updated_ms;
        } else {
          S.conversations = S.conversations.concat([Object.assign({}, e, { history: e.history || [] })]);
          mutated = true;
        }
      });
      if (mutated) render();
    }).catch(() => {});
  }

  // Continuous status poll after ready: detect daemon restarts / model reloads
  // and keep the sidebar in sync.
  function periodicSync() {
    if (reloadPolling) return;   // a reload poll already owns the loading screen
    Promise.resolve(API.getStatus()).then((st) => {
      if (checkBuild(st)) return;   // build changed -> reloading
      if (!st || st.state !== 'ready') {
        // Daemon is mid-reload (restart / model reload). Drop back to the
        // loading overlay and hand off to pollStatus until it's ready again,
        // then re-init — previously this just returned and left the stale UI up
        // until the user pressed F5.
        reloadPolling = true;
        S.boot = st || LOADING_BOOT('Reloading model');
        S.loaded = {};
        render();
        pollStatus();
        return;
      }
      if (lastStartedAt !== null && st.started_at_ms && st.started_at_ms !== lastStartedAt) {
        lastStartedAt = st.started_at_ms;
        S.loaded = {};
        initConversations();   // daemon restarted — reload from scratch
      } else {
        if (st.started_at_ms) lastStartedAt = st.started_at_ms;
        refreshConversationList();
      }
    }).catch(() => {
      // Unreachable — daemon almost certainly restarting. Show the loading
      // overlay and poll until it returns.
      reloadPolling = true;
      S.boot = LOADING_BOOT('Reconnecting');
      S.loaded = {};
      render();
      pollStatus();
    });
  }

  render();      // loading overlay (S.boot starts in the loading state)
  reloadPolling = true;   // the initial model-load poll owns the loading screen
  pollStatus();
  setInterval(periodicSync, 5000);
})();
</script>
</body>
</html>
