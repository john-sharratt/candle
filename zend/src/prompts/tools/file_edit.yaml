category: Files
mandatory: true
description: 'Change an existing file of the named repo by one of its parts, leaving the rest exactly as it is. The file may be one this session created or one from the repository on disk — editing a project file copies it into the session first, so the version on disk is never modified. `file_read` shows every part of a file — a function, a type, a block of imports, a paragraph — as a fenced block whose fence names its four-character anchor and its scope (`part=r7Lm lines=120-134 scope="impl Cache > fn seal"`), with each of its lines numbered `+1`, `+2`, … in the part; name the part as `part` and say what to `do`. **To change lines of a part, name them by those numbers**: `from` (and `to`, for more than one) — `replace` them with `text`, `insert_before` or `insert_after` line `from` the lines `text`, or `delete` them. The numbers count from the part''s own first line, so an edit elsewhere never moves them and several edits from one read stay right. Without `from`, the edit is to the part whole: `replace` it with `text` (or, with `old`, replace just those words inside it), `insert_before` or `insert_after` it a new part `text`, `delete` it, or `move` it `before`/`after` the part `dest`; `through` extends a whole-part replace, delete or move over a run of consecutive parts. Write `text` as the lines are to stand, indentation included — never with anchors in it, and never with the `+N` numbers a read shows beside each line, which are not part of the file. Use for: changing a function body, adding a method after another, fixing a value in a config, removing dead code, reordering items. An anchor that no longer names a part — the file changed since it was read — is refused as stale; read it again and edit by the anchors it shows. Returns what was done and the parts it wrote under their new anchors, between the parts either side of them, so the next edit needs no read. It also lists the lines that changed — `-` for what was removed, `+` for what was written, `…` where unchanged lines lie between runs: a line listed there that you did not mean to change is a slip to fix with the next edit. Triggered by "change X to Y in the file", "update this function", "add this after", "remove that", "move this". For a new file, or rewriting most of one, use write.'
high_risk: false
parameters:
  $schema: http://json-schema.org/draft-07/schema#
  properties:
    repo:
      description: The repository the file belongs to. Required.
      minLength: 1
      type: string
    path:
      description: Path of the file to edit, relative to the repository — a project file, or one this session created (e.g. `src/main.rs`). Required.
      minLength: 1
      type: string
    part:
      description: The anchor of the part to change — the `part=` of its block in `file_read` (e.g. `r7Lm`). Required.
      maxLength: 4
      minLength: 4
      type: string
    do:
      description: What to do there — `replace`, `insert_before` or `insert_after`, `delete`, or `move`. Required.
      enum:
      - replace
      - insert_before
      - insert_after
      - delete
      - move
      type: string
    from:
      description: For replace, the inserts and delete — the first line of the part the edit covers, `+N` as the read numbers it beside the line (e.g. `+3`). Leave it out to edit the part whole.
      pattern: '\+[1-9][0-9]?'
      type: string
    to:
      description: For replace and delete with `from` — the last line of the part covered, `+N`; left out, `from` alone.
      pattern: '\+[1-9][0-9]?'
      type: string
    old:
      description: For a whole-part replace only — words inside the part to change, which must occur in it exactly once. With `old`, only those words are replaced by `text`.
      type:
      - string
      - 'null'
    text:
      description: For replace, insert_before and insert_after — the new text, its indentation included — the lines `from` through `to` as they are to stand, the words replacing `old`, or the whole part. Not given for delete or move.
      type:
      - string
      - 'null'
    through:
      description: For a whole-part replace, delete or move — the anchor of the last part of a run of consecutive parts, so the edit covers `part` through `through`.
      type:
      - string
      - 'null'
    dest:
      description: For move — the anchor of the part to move it beside.
      type:
      - string
      - 'null'
    where:
      description: For move — `before` or `after` `dest`.
      enum:
      - before
      - after
      type: string
  required:
  - repo
  - path
  - part
  - do
  title: EditRequest
  type: object
