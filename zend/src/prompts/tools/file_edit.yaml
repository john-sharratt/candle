name: file_edit
questions:
- bump the version in Cargo.toml from 0.9.1 to 0.10.0
- change the log level from info to debug in that file
- replace the hardcoded localhost with an env lookup
- set retries to 5 where it currently says 3
- can you fix just that one line without touching the rest
- what's the smallest change that corrects this constant
- could you swap the deprecated call for the new one in place
- is it enough to change the default, or does the caller need it too
- the timeout is too aggressive and it's flaking in CI
- this typo is in the generated docs and I want it gone
- we renamed the field upstream and this file still uses the old name
- the endpoint moved, point it at the new host
- patch that line
- one-line fix in the config
- tweak that value
- s/old/new/ in the file
- change the port from 8080 to 9090 in the config
- replace that function name throughout the file
- fix the typo in the header comment of main.rs
- update the version string in Cargo.toml
- swap out that one line in the script
- edit the README to correct the install command
- patch this file so the timeout is 30 seconds
- rename the variable in that source file
- add a method right after the existing list function
- insert an import below the others at the top
- delete the stale commented-out block in utils
category: Files
description: 'Replace one piece of text in an existing file of the named repo with another. The file may be one this session created or one from the repository on disk — editing a project file copies it into the session first, so the version on disk is never modified. `old_text` is the text to change, copied from the file exactly as it stands — whole lines, with enough of the lines around it to occur only once, and without the line numbers `file_read` shows; `new_text` is what takes its place, empty to delete it. Text quoted at the wrong indentation is still found, and the new text is re-indented to the file''s. Text that occurs more than once is refused unless `replace_all` is set; an edit whose result is already in the file is reported as already applied, so re-sending it is safe. Use for: changing a value in a config, updating a function body, adding a method after an existing one, fixing a typo. Triggered by "change X to Y in the file", "update these lines", "fix the value of", "add this after". Returns the repo, the path, how many occurrences were replaced, whether it was already applied, how the text was matched, and the new byte count. For full rewrites use write.'
high_risk: false
parameters:
  $schema: http://json-schema.org/draft-07/schema#
  properties:
    repo:
      description: The repository the file belongs to. Required.
      minLength: 1
      type: string
    path:
      description: Path of the file to edit, relative to the repository — a project file, or one this session created (e.g. `src/main.rs`). Required.
      minLength: 1
      type: string
    old_text:
      description: The text to replace, copied from the file exactly as it stands — whole lines, with enough of the lines around it that it occurs only once. Without the line numbers `file_read` shows. Required.
      minLength: 1
      type: string
    new_text:
      description: The text that takes its place. Empty to delete `old_text`. Required.
      type: string
    replace_all:
      default: false
      description: Replace every occurrence of `old_text` instead of requiring exactly one. Optional; defaults to false.
      type: boolean
  required:
  - repo
  - path
  - old_text
  - new_text
  title: EditRequest
  type: object
examples:
- in Cargo.toml change the line `version = "0.1.0"` to `version = "0.2.0"`<|im_end|>
- in src/config.rs replace the string `localhost` with `0.0.0.0`<|im_end|>
- update the port from 8080 to 9090 in config.toml<|im_end|>
- rename the function fetch_user to load_user everywhere in src/utils.rs<|im_end|>
- I'm not sure that last edit went through — make sure retries is 30 in config/limits.toml<|im_end|>
- fix the typo `recieve` to `receive` in src/handlers/mod.rs<|im_end|>
- drop the leftover debug println in src/pipeline.rs<|im_end|>
- add .env to .gitignore<|im_end|>
- add a len() method after is_empty() in src/queue.rs<|im_end|>
