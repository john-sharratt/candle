name: git_status
questions:
- what have I changed but not committed yet
- is the working tree clean in that repo
- which branch am I on right now
- show me the uncommitted changes
- what files are staged for the next commit
- are there any untracked files lying around
- did I leave anything uncommitted before switching
- what would go into my next commit
- do I have unsaved work in this repository
- is there anything dirty in the checkout
- which files did I modify since the last commit
- summarise the state of my working copy
- what is the current checked-out branch and commit
- anything outstanding in the repo
- have I staged that fix or not
- tell me whether this repo has pending edits
- did that file get deleted or is it just unstaged
- what is sitting in the index right now
- am I on main or a feature branch
- check if it is safe to switch branches
- how far ahead of its upstream is my branch
- do I have commits I have not pushed yet
- is my checkout behind origin
category: Git
description: 'Report what is uncommitted in a repository''s working tree: which files were modified, added, deleted, renamed or left untracked, and which of those changes are staged. Also names the branch currently checked out, the commit it sits on, and — as `upstream` — what that branch tracks and how many commits it is `ahead` and `behind`, so "how far ahead am I" and "do I have unpushed commits" are READ here; when the branch tracks nothing, `no_upstream` names the git_log call that counts it instead. A path can carry two states — `staged` (what differs between the last commit and the index) and `unstaged` (what differs between the index and the file on disk) — because a file can be both at once, staged and then edited again; a side with no change is left out. A `counts` block comes back with every reply — `staged`, `unstaged`, `untracked`, `unmerged` — so "how many have I changed" is READ off those totals rather than counted from the listing, and `clean` says outright whether there is anything at all. Use for "what have I changed", "is this repo clean", "what branch am I on", or to see what would go into the next commit. The changed paths page, 80 a page, and `page` is required: pass 0 to start, then the reply''s `paging.next_page` for the next; a page past the end returns the last one rather than nothing. Reads only: it stages nothing, commits nothing and changes nothing on disk.'
high_risk: false
parameters:
  $schema: http://json-schema.org/draft-07/schema#
  properties:
    page:
      description: Zero-based page of changed paths, 80 a page. Required — pass 0 to start. Pass the reply's `paging.next_page` back here for the following page; a page past the end returns the last one.
      format: uint32
      minimum: 0.0
      type: integer
    repo:
      description: The repository to inspect. Required.
      minLength: 1
      type: string
  required:
  - repo
  - page
  title: StatusRequest
  type: object
examples:
- what have I changed in the candle repo<|im_end|>
- is the working tree clean<|im_end|>
- which branch am I on<|im_end|>
- show me anything uncommitted before I switch branches<|im_end|>
- are there untracked files in mind<|im_end|>
- what is staged for the next commit<|im_end|>
- did I already stage that change to the config<|im_end|>
- give me a summary of the repo state<|im_end|>
- how far ahead of its upstream is the current branch in candle<|im_end|>
