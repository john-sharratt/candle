name: git_show
questions:
- show me what that commit changed
- which files differ between main and my branch
- show me Cargo.toml as the release tag has it
- who last changed line 40 of that source file
- what did this file look like before the rename
- print the config as it was two commits ago
- give me the diff for the most recent commit
- list the files that commit touched
- what is in the src directory on that branch
- show the changed lines with a few lines of context
- annotate that function with who wrote each line
- compare the feature branch against main file by file
- what did the previous commit do
- read that file as the release branch holds it
- did anything get renamed between those revisions
- show me the hunks for that fix so I can port it
- what files does the tag add compared to the one before
- blame the top of that header file
- what was the content of the manifest at that commit
- list the entries of the docs folder in that revision
- which commit last touched each line of this function
- who wrote the header comment in that file
- attribute the lines of this config to the people who wrote them
- whose change is that block of code from
category: Git
description: 'Show repository content at, or between, revisions — five views, picked by `what`: what a commit changed (`changes`, `patch`), what a file or directory held (`file`, `tree`), and who last changed each line of a file (`blame`). In detail: `changes` lists the files that differ, with how each changed; `patch` gives the changed lines hunk by hunk; `file` returns a file''s full contents as that revision holds them; `tree` lists a directory''s entries; `blame` attributes each line of a file to the commit that last changed it, following it back through renames. `rev` chooses the revision and defaults to HEAD — the LAST COMMIT, not the files on disk — and for `changes` and `patch` `from` defaults to `rev`''s first parent, so those two show what one commit did; give `from` to compare two branches or tags instead. A root commit is shown against the empty tree, so everything in it reads as an addition. `path` names the file for `file` and `blame` or the directory for `tree`; `paths` narrows `changes` and `patch`. The first page of `changes` and `patch` also carries the commit''s full message, which git_log does not. Everything pages, from 1, and `page` is required — pass 1 to start, then the reply''s `paging.next_page` for the next; a page past the end returns the last one rather than nothing. Use for "show me that commit", "what exactly did this change", "show me this file as of that tag", "who wrote this line", "what is in that directory". For the file as it stands on disk right now, uncommitted edits included, use file_read. Reads only.'
high_risk: false
parameters:
  $schema: http://json-schema.org/draft-07/schema#
  definitions:
    RevArg:
      description: 'A revision. `kind` picks the form and `name` carries its value.'
      properties:
        back:
          description: For `parent` only — how many commits back. Defaults to 1.
          format: uint32
          minimum: 0.0
          type: integer
        kind:
          description: 'Which form: `head` (your own commit — the branch you are on as your files have it — needs no name), `branch`, `tag`, `ref` (a full refs/… name), `commit` (a full object id), `remote_branch` (a remote-tracking branch written the way it is spoken of — `origin/main`), `upstream` (what `name` tracks, or what the branch you are on tracks when `name` is omitted — the form for "how far ahead of my upstream am I"), or `parent` (an ancestor of `name`, which is how to say "the previous commit" without holding its id).'
          enum:
          - head
          - branch
          - tag
          - ref
          - commit
          - remote_branch
          - upstream
          - parent
          type: string
        name:
          description: The branch or tag's short name, a full `refs/…` name, a commit id, or a remote branch as `origin/main` — whichever `kind` calls for. For `parent`, the revision to count back from, and for `upstream`, the branch whose upstream is meant; both default to your own commit. Omit for `head`.
          type: string
      required:
      - kind
      type: object
    ShowWhat:
      description: 'Which view to return: `changes` (which files differ), `patch` (the changed lines), `file` (a file''s contents at the revision), `tree` (a directory listing), `blame` (per-line attribution).'
      enum:
      - changes
      - patch
      - file
      - tree
      - blame
      type: string
  properties:
    context:
      description: Unchanged lines around each change, for `patch` (0–25). Defaults to 3.
      format: uint32
      maximum: 25.0
      minimum: 0.0
      type: integer
    from:
      allOf:
      - $ref: '#/definitions/RevArg'
      description: The older side, for `changes` and `patch`. Leave it out for `rev`'s first parent, so those modes show what one commit did.
    page:
      description: Page to return, from 1. Required in every mode — pass 1 to start. Pass the reply's `paging.next_page` back here for the following page; a page past the end returns the last one.
      format: uint32
      minimum: 1.0
      type: integer
    path:
      description: The file for `file` and `blame`, or the directory for `tree` (an empty string is the repository root). Ignored by `changes` and `patch`, which take `paths`.
      type: string
    paths:
      description: Limit `changes` and `patch` to these repository-relative paths.
      items:
        type: string
      type: array
    repo:
      description: The repository to read. Required.
      minLength: 1
      type: string
    rev:
      allOf:
      - $ref: '#/definitions/RevArg'
      description: The revision to read, or the newer side of a comparison. Leave it out for the branch you are on — its last commit, not your uncommitted changes.
    what:
      allOf:
      - $ref: '#/definitions/ShowWhat'
      description: Which view to return. Required.
  required:
  - repo
  - what
  - page
  title: ShowRequest
  type: object
examples:
- |-
  look at how the last commit did it and do the same here<|im_end|>
  <|im_start|>assistant
  <|projection|><think>
  A commit that did the same job is the best guide. `patch` gives its changed lines and, on the first page, its full message. `rev` left out is the branch I am on.<|projection|>
  </think>

  <tool_call>
  <|projection|>{"name": "git_show", "arguments": {"repo": "app", "what": "patch", "page": 1}}
  </tool_call><|projection|>
- |-
  what was that function like before the regression<|im_end|>
  <|im_start|>assistant
  <|projection|><think>
  file_read gives the file as it stands now. I want it as of the commit before, and `parent` says that without an id, so git_show with `what` set to file.<|projection|>
  </think>

  <tool_call>
  <|projection|>{"name": "git_show", "arguments": {"repo": "candle", "what": "file", "path": "zend/src/session.rs", "rev": {"kind": "parent"}, "page": 1}}
  </tool_call><|projection|>
- |-
  list what is in that folder on origin's main<|im_end|>
  <|im_start|>assistant
  <|projection|><think>
  file_list reads my own files. For the folder as origin's branch holds it, git_show with `what` set to tree at that remote branch.<|projection|>
  </think>

  <tool_call>
  <|projection|>{"name": "git_show", "arguments": {"repo": "candle", "what": "tree", "path": "web/content", "rev": {"kind": "remote_branch", "name": "origin/main"}, "page": 1}}
  </tool_call><|projection|>
- |-
  which files did my branch change compared with main<|im_end|>
  <|im_start|>assistant
  <|projection|><think>
  `changes` with `from` set to main compares the two and lists each file that differs, which is what I need before I write this up.<|projection|>
  </think>

  <tool_call>
  <|projection|>{"name": "git_show", "arguments": {"repo": "app", "what": "changes", "from": {"kind": "branch", "name": "main"}, "page": 1}}
  </tool_call><|projection|>
- |-
  who wrote this block and why<|im_end|>
  <|im_start|>assistant
  <|projection|><think>
  `blame` attributes each line to the commit that last changed it, and that commit's message will say why. It needs the file in `path`.<|projection|>
  </think>

  <tool_call>
  <|projection|>{"name": "git_show", "arguments": {"repo": "app", "what": "blame", "path": "src/config.rs", "page": 1}}
  </tool_call><|projection|>
