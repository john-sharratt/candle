category: Credentials
description: 'Save a new credential — SSH key, password, API token, TOTP secret, database login, or remote-filesystem auth — to the encrypted credential store for later use by session and security tools. Supported types: ssh_key, ssh_password, telnet_password, http_bearer, http_basic, http_header, totp_secret, sql_password, remote_fs_password, tls_client_cert, signing_key. Triggered by "save this key", "remember this password", "store my credentials for", "add a credential called", "set up auth for". Returns the credential ID and name. Use cred_list to find existing credentials; credential_delete to revoke. Note: secrets passed here enter conversation history.'
high_risk: true
parameters:
  $schema: http://json-schema.org/draft-07/schema#
  definitions:
    CredType:
      description: Credential type.
      enum:
      - ssh_key
      - ssh_password
      - telnet_password
      - http_bearer
      - http_basic
      - http_header
      - totp_secret
      - sql_password
      - remote_fs_password
      - tls_client_cert
      - signing_key
      type: string
  properties:
    default_database:
      description: Default database name (for sql_password).
      type:
      - string
      - 'null'
    default_host:
      description: Default host this credential connects to, if any.
      type:
      - string
      - 'null'
    default_port:
      description: Default port this credential connects to, if any.
      format: uint16
      minimum: 0.0
      type:
      - integer
      - 'null'
    domain:
      description: Authentication domain (e.g. SMB/AD domain for remote_fs_password).
      type:
      - string
      - 'null'
    header_name:
      description: HTTP header name (e.g. "X-API-Key"). Required for type http_header.
      type:
      - string
      - 'null'
    name:
      description: Unique friendly name to store and later reference this credential by.
      minLength: 1
      type: string
    passphrase:
      description: Passphrase protecting an encrypted `ssh_key`, if any.
      type:
      - string
      - 'null'
    secret:
      description: 'The secret material: API token, password, base32 TOTP seed, or PEM key block.'
      minLength: 1
      type: string
    type:
      allOf:
      - $ref: '#/definitions/CredType'
      description: 'Credential type. Infer it from the secret: an API token (e.g. one starting `sk-`, `ghp_`, `sk_live_`, `xoxb-`) is `http_bearer`; an SSH PEM/OpenSSH private key is `ssh_key`; a PEM signing key is `signing_key`; a base32 2FA seed is `totp_secret`; a DB login is `sql_password`.'
      minItems: 1
      minLength: 1
    username:
      description: Login name. Required for ssh_key, ssh_password, telnet_password, http_basic, sql_password, and remote_fs_password.
      type:
      - string
      - 'null'
  required:
  - name
  - secret
  - type
  title: SaveRequest
  type: object
