name: file_read
questions:
- show me lines 120 through 180 of candle-nn/src/kv_cache/chunked/compress.rs
- print the opening of candle-kernels/build.rs where the archive groups are registered
- the panic points at line 512, show me the code around it
- show me that file from line 900 onward
- I only need the impl block, not the whole two-thousand-line module
- give me a window around line 47 so I can see the surrounding context
- continue from where that excerpt stopped
- something matched at line 214, show me the function it belongs to
- what do lines 598 to 630 actually do
- open src/lib.rs but only the top where the modules are declared
- that excerpt cut off mid-function, show me the next stretch
- skip ahead to line 300 and read from there
- cat zend/src/session.rs
- print docs/kv_tier_migration.md
- open the Dockerfile so I can check the base image
- show me what's in .gitignore
- what version is pinned in the lockfile
- checking whether my earlier edit actually landed
- read it
- print that file's contents
- show me the contents of src/main.rs
- read that config file for me
- what's in README.md
- read back the notes file from this session
category: Files
mandatory: true
description: 'Read a file, one page at a time. Resolves against this session''s edits first, then falls through to the repository on disk, so real project files can be read directly. Use for: reading a source file from the project, looking at what was previously written, inspecting a file the user uploaded into the chat, checking the current state of a draft after edits. The repo, the path within it, and the page are all required; pages count from 1, and page 1 is the top of the file — a short file''s whole content. The file comes back in its parts — each function, type, block of imports or paragraph under a four-character anchor and, for code, its scope path (`r7Lm| impl Cache > fn seal`), then its lines exactly as they are — whole parts, up to 200 lines a page; `file_edit` names a part by its anchor. The page sits in a fenced block whose opening fence names the file, the page, how many pages there are, and the file''s length — `rust file=candle/src/lib.rs page=2 pages=5 lines=940` — and which ends naming the next page to read, `end of candle/src/lib.rs page 2 of 5 — next: page=3`, or saying it was the last, `end of candle/src/lib.rs page 5 of 5 — the last page`. There is no need to find a file''s length before reading it: read page 1 and its fence reports it. To read where an error, a stack trace or a line number points, pass that `line` and the page holding it comes back. To find the code worth reading, use file_grep, whose hits name the part and the page they are on, rather than paging a large file looking for it. For remote filesystems use remote_fs_session_get to download first, then file_read. **This reads the file as it stands on disk right now, uncommitted edits included.** For the file as a COMMIT, BRANCH or TAG holds it — "show me this file as of that commit", "what did it look like on the release branch" — use git_show with `what: file`. **A repository''s `.git/` folder is refused outright**: for branches, tags, remotes or counts of them use git_refs, for history git_log, and for a file at a revision git_show — never `.git/packed-refs`, `.git/refs/…` or `.git/config`, which are a database rather than text and give wrong answers when read as files.'
parameters:
  $schema: http://json-schema.org/draft-07/schema#
  properties:
    repo:
      description: The repository the file belongs to. Required.
      minLength: 1
      type: string
    path:
      description: Path of the file to read, relative to the repository — a project file, or one this session created (e.g. `src/main.rs`). Required.
      minLength: 1
      type: string
    page:
      description: Page of the file to return, from 1; a page is whole parts of the file, up to 200 lines of them. Required — pass 1 for the top of the file. Its fence names how many pages there are and the next one to read, or says it is the last. A page past the end returns the last one.
      format: uint32
      minimum: 1.0
      type: integer
    line:
      description: A line number, from 1 — an error's, a stack trace's — to read the page holding it instead of `page`. Optional.
      format: uint32
      minimum: 1.0
      type:
      - integer
      - 'null'
  required:
  - repo
  - path
  - page
  title: ReadRequest
  type: object
