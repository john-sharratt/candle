name: file_read
questions:
- show me lines 120 through 180 of candle-nn/src/kv_cache/chunked/compress.rs
- print the opening of candle-kernels/build.rs where the archive groups are registered
- the panic points at line 512, show me the code around it
- show me that file from line 900 onward
- I only need the impl block, not the whole two-thousand-line module
- give me a window around line 47 so I can see the surrounding context
- continue from where that excerpt stopped
- something matched at line 214, show me the function it belongs to
- what do lines 598 to 630 actually do
- open src/lib.rs but only the top where the modules are declared
- that excerpt cut off mid-function, show me the next stretch
- skip ahead to line 300 and read from there
- cat zend/src/session.rs
- print docs/kv_tier_migration.md
- open the Dockerfile so I can check the base image
- show me what's in .gitignore
- what version is pinned in the lockfile
- checking whether my earlier edit actually landed
- read it
- print that file's contents
- show me the contents of src/main.rs
- read that config file for me
- what's in README.md
- read back the notes file from this session
- what functions are in that file
- give me an outline of the module
- show me that part again
category: Files
mandatory: true
description: 'Read a file: one part, a run of lines, or the list of its parts. Resolves against this session''s edits first, then falls through to the repository on disk, so real project files can be read directly. Name the repo, the path within it, and exactly one of `part`, `lines` or `list`. `part` is one part by its anchor — a hit''s `part`, a list entry''s, an edit''s answer''s. `lines` is a line number or a range of them, `84` or `120-180`: the whole parts those lines touch, up to 200 lines, from the part holding the first; a read of one line says which part and line of it that is (`line 84 is part=KehT +30`). `list` is a page of the list of the file''s parts, from 1, one line each (`part=KehT lines=55-101 impl Act > fn summary`) — and a short file comes back whole, so `list: 1` reads it. Each part — a function, a type, a block of imports, a paragraph — is a fenced block whose fence names the file, the part''s anchor, the file''s lines it holds and its scope: `rust file=candle/npcd/src/engine/act.rs part=KehT lines=55-101 scope="impl Act > fn summary"`. Its lines follow exactly as they are, each behind its number in the part from `+1` — the number is not part of the file; `file_edit` names a part by its anchor. A read of lines ends naming the next range to read, `end of candle/src/lib.rs lines 1-198 of 940 — next: lines=199-391`, or saying it was the end of the file. There is no need to find a file''s length first. To read where an error or a stack trace points, pass its line as `lines`. To find the code worth reading, use file_grep, whose hits name their part, rather than reading a large file through looking for it. For remote filesystems use remote_fs_session_get to download first, then file_read. **This reads the file as it stands on disk right now, uncommitted edits included.** For the file as a COMMIT, BRANCH or TAG holds it — "show me this file as of that commit", "what did it look like on the release branch" — use git_show with `what: file`. **A repository''s `.git/` folder is refused outright**: for branches, tags, remotes or counts of them use git_refs, for history git_log, and for a file at a revision git_show — never `.git/packed-refs`, `.git/refs/…` or `.git/config`, which are a database rather than text and give wrong answers when read as files.'
parameters:
  $schema: http://json-schema.org/draft-07/schema#
  properties:
    repo:
      description: The repository the file belongs to. Required.
      minLength: 1
      type: string
    path:
      description: Path of the file to read, relative to the repository — a project file, or one this session created (e.g. `src/main.rs`). Required.
      minLength: 1
      type: string
    part:
      description: One part, by its four-character anchor — the `part=` of its block, a `file_grep` hit's `part`, a list entry's (e.g. `KehT`). One of `part`, `lines`, `list`.
      pattern: '[A-Za-z0-9_-]{4}'
      type: string
    lines:
      description: Lines of the file, from 1 — one, `84`, or a range, `120-180` — read as the whole parts they touch, up to 200 lines. One of `part`, `lines`, `list`.
      pattern: '[1-9][0-9]{0,6}(-[1-9][0-9]{0,6})?'
      type: string
    list:
      description: A page of the list of the file's parts, from 1 — `1` to start; a short file comes back whole. One of `part`, `lines`, `list`.
      format: uint32
      minimum: 1.0
      type: integer
  required:
  - repo
  - path
  oneOf:
  - required:
    - part
  - required:
    - lines
  - required:
    - list
  title: ReadRequest
  type: object
