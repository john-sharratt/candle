name: file_image
questions:
- resize logo.png to 64 by 64
- make a favicon from icon-source.png
- generate the icon sizes for the site
- make thumbnails of this picture
- convert banner.png to webp
- turn the logo into a jpg
- make a 512 and a 192 icon from the source art
- I need a favicon.ico with 16 and 32 pixel sizes
- crop the screenshot to the top left corner and shrink it
- shrink the picture to half its size
- this image is too big, make it 800 wide
- make a double-size copy of the logo for high density screens
- regenerate the gallery thumbnails
- scale the sprite up to 256
- produce a 32x32 version of the icon
- convert this ico source to a real ico file
- make a smaller copy of the hero image
- save the logo as a webp as well
- resize the image
- make it smaller
- is there a way to resize a png here
- cut a square out of this photo and make an avatar of it
- make every size we need from this one picture
- I want the transparent background kept when you resize it
category: Files
description: 'Make resized copies of a picture in the repository, keeping its transparency: PNG, JPEG, WebP or a multi-size ICO, cropped first if you say so. The copies are among your uncommitted changes. The picture may be in another repository (`source_repo`), which is how a picture gets from one repository into another. Use for: an icon set, a favicon, thumbnails, converting a picture to another format. Triggered by "resize the image", "make a favicon", "generate the icon sizes", "convert to webp". Returns the picture''s size and each copy''s path, bytes and size. A copy whose shape differs from the picture''s is refused: crop first.'
high_risk: false
parameters:
  $schema: http://json-schema.org/draft-07/schema#
  properties:
    repo:
      description: The repository the picture belongs to. Required.
      minLength: 1
      type: string
    path:
      description: 'Path of the picture to copy from, relative to the repository: PNG, JPEG, WebP, GIF, BMP or TIFF. Required.'
      minLength: 1
      type: string
    source_repo:
      description: The repository `path` is in, when it is not `repo`, which is how a picture gets from one repository into another. The copies always go in `repo`. Written last, after `outputs`. Optional.
      minLength: 1
      type: string
    crop:
      allOf:
      - $ref: '#/definitions/Crop'
      description: The part of the picture to use; all of it when left out. Use it when a copy's shape differs from the picture's. Optional.
    outputs:
      description: The copies to make. Required.
      type: array
      minItems: 1
      maxItems: 32
      items:
        $ref: '#/definitions/ImageOutput'
  definitions:
    Crop:
      description: The part of the picture to use.
      type: object
      properties:
        x:
          description: Left edge, in pixels.
          type: integer
          minimum: 0
        y:
          description: Top edge, in pixels.
          type: integer
          minimum: 0
        width:
          description: Its width in pixels.
          type: integer
          minimum: 1
        height:
          description: Its height in pixels.
          type: integer
          minimum: 1
      required:
      - x
      - y
      - width
      - height
    ImageOutput:
      description: One copy to make.
      type: object
      properties:
        path:
          description: 'Where the copy goes, relative to the repository. Its extension picks the format: .png, .jpg, .webp or .ico. Required.'
          minLength: 1
          type: string
        width:
          description: Its width in pixels. Required.
          type: integer
          minimum: 0
        height:
          description: Its height in pixels. Required.
          type: integer
          minimum: 0
        ico_sizes:
          description: For an .ico, the square sizes it holds, width and height aside; 16, 32 and 48 when left out. Each at most 256.
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 256
      required:
      - path
      - width
      - height
  required:
  - repo
  - path
  - outputs
  title: ImageRequest
  type: object
examples:
- |-
  put a small copy of the art from the design repo into the site repo<|im_end|>
  <|im_start|>assistant
  <|projection|><think>
  The picture is in design and the copy belongs in the site repository. file_image reads from source_repo and writes into repo, so nothing has to be copied by hand. Calls write repo, path and outputs first, and source_repo goes last, after outputs closes.<|projection|>
  </think>

  <tool_call>
  <|projection|>{"name": "file_image", "arguments": {"repo": "site", "path": "art/source.png", "outputs": [{"path": "images/source-128.png", "width": 128, "height": 128}], "source_repo": "design"}}
  </tool_call><|projection|>
- |-
  resize logo.png to 64 by 64<|im_end|>
  <|im_start|>assistant
  <|projection|><think>
  Okay, the user wants a 64 by 64 copy of logo.png, without naming a repository — the workspace's generic app repository is where this goes. There's a file_image tool that takes repo, path and outputs.<|projection|> Overwriting the picture itself is not what was asked for, so the copy gets its own name.
  </think>

  <tool_call>
  <|projection|>{"name": "file_image", "arguments": {"repo": "app", "path": "logo.png", "outputs": [{"path": "logo-64.png", "width": 64, "height": 64}]}}
  </tool_call><|projection|>
- |-
  make a favicon from icon-source.png<|im_end|>
  <|im_start|>assistant
  <|projection|><think>
  A favicon is an .ico holding the small sizes, and file_image writes one from the extension of the output path, without naming a repository — the workspace's generic app repository is where this goes.<|projection|> The default sizes of 16, 32 and 48 are the usual ones, so the width and height of the output are zero.
  </think>

  <tool_call>
  <|projection|>{"name": "file_image", "arguments": {"repo": "app", "path": "icon-source.png", "outputs": [{"path": "favicon.ico", "width": 0, "height": 0}]}}
  </tool_call><|projection|>
- |-
  generate the 192 and 512 icons from art/source.png in the candle repo<|im_end|>
  <|im_start|>assistant
  <|projection|><think>
  Two square copies of one picture go in one call: file_image takes a list of outputs, in the candle repository.<|projection|>
  </think>

  <tool_call>
  <|projection|>{"name": "file_image", "arguments": {"repo": "candle", "path": "art/source.png", "outputs": [{"path": "art/icon-192.png", "width": 192, "height": 192}, {"path": "art/icon-512.png", "width": 512, "height": 512}]}}
  </tool_call><|projection|>
