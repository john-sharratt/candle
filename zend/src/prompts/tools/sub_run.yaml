name: sub_run
questions:
- spawn one agent per crate to audit them in parallel
- delegate the schema analysis to a nested agent with its own context
- have a verifier check my draft findings against the files they cite
- fan this out across three sub-agents and collect the results
- would this go faster split across agents
- can a sub-agent handle the search while you keep working
- should this be one agent or several
- what part of this could another agent take
- this is too big for one context window
- the research half is independent of the implementation half
- I want the exploration done without polluting this conversation
- parallelising the boring part of the sweep
- spawn a sub-agent
- delegate this
- fan it out
- run a child agent on it
- spawn a sub-agent to handle the research half of this
- delegate this subtask to a nested agent
- split this into parallel agents, one per component
- run a separate agent loop on that part of the problem
- start a part that adversarially re-checks every claim before I answer
- decompose this task and farm the pieces out
- start a child agent with its own context for this
- delegate the migration analysis to another agent
category: Subagent
description: 'Start a part of your task as a conversation of its own and wait for it to end: one file of twelve to review, one crate of three to research, or a verifier that checks your draft findings against the files they cite before you answer. The part starts with your journals and your thread''s, not your turns, so state its task in full. Several sub_run calls in one round run at once. Returns the part''s journal entry and its address, which you cite in your own answer.'
high_risk: true
parameters:
  $schema: http://json-schema.org/draft-07/schema#
  properties:
    name:
      description: What the part is for, as a kebab-case slug of at most 40 characters — `verify-findings`, `read-parser` — never a number. Calling again with a name this task already used returns that part rather than starting another.
      maxLength: 40
      minLength: 1
      type: string
    prompt:
      description: 'The part''s task, stated in full: it shares your journals, not your turns. End it by asking for the final response''s shape.'
      minLength: 1
      type: string
  required:
  - name
  - prompt
  title: Request
  type: object
examples:
- spawn a subagent to research the best Rust logging crate and report back<|im_end|>
- delegate finding every TODO comment under the src directory to a subagent<|im_end|>
- have a subagent investigate why the build is failing<|im_end|>
- before you answer, start a verifier that checks each of your findings against the lines it cites<|im_end|>
- review these three files in parallel, one part per file<|im_end|>
- delegate writing the unit tests for the parser module to a subagent<|im_end|>
- have a subagent research the top three Rust web frameworks and recommend one for a REST API<|im_end|>
- spawn an agent to trace where this config value is read across the repo<|im_end|>
