[package]
name = "zend"
version = "0.1.0"
edition = "2021"
description = "Zen Code daemon — persistent AI coding assistant"

[[bin]]
name = "zend"
path = "src/main.rs"

[lib]
name = "zend"
path = "src/lib.rs"

[dependencies]
anyhow     = { workspace = true }
clap       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

axum         = { version = "0.7", features = ["macros", "ws", "multipart"] }
tower-http   = { version = "0.5" }
tokio        = { version = "1",   features = ["full"] }
futures      = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
include_dir  = { version = "0.7" }
mime_guess   = { version = "2" }
reqwest      = { version = "0.12", features = ["stream"] }

candle              = { workspace = true, features = ["cuda"] }
candle-conversation = { path = "../candle-conversation", features = ["hub"] }
zend-tools          = { path = "../zend-tools" }
regex               = "1"
sysinfo             = { version = "0.31", default-features = false, features = ["system"] }
tokenizers          = { workspace = true }

# Workspace scanning + scope-aware carving (Phase 1 & 2 ingestion).
# `ignore` is ripgrep's git-aware file walker; tree-sitter provides the
# per-language CSTs used by the carver.  Grammars are direct deps so each
# can be pinned independently as the language ecosystem moves.
ignore                  = "0.4"
notify                  = "6"
sha2                    = "0.10"
#
# `tree-sitter` sets `links = "tree-sitter"`, so exactly ONE version may exist
# in the whole workspace — which makes this pin a workspace-wide decision rather
# than zend's alone. It was 0.22, and that pin is what blocked `npcd` from using
# `yamlpatch` (which needs 0.26) to save an authored file without destroying its
# comments. Bumping it here is what unblocks that.
#
# The grammars moved to `LANGUAGE`, a `LanguageFn` constant, in place of the old
# `language()` function — see `parsers/tree_sitter_util.rs`.
tree-sitter             = "0.26"
tree-sitter-rust        = "0.24"
tree-sitter-python      = "0.25"
tree-sitter-typescript  = "0.23"
tree-sitter-javascript  = "0.25"
tree-sitter-go          = "0.25"
tree-sitter-c           = "0.24"
tree-sitter-cpp         = "0.23"
tree-sitter-java        = "0.23"
tree-sitter-ruby        = "0.23"
tree-sitter-php         = "0.24"
tree-sitter-bash        = "0.25"
tree-sitter-html        = "0.23"
tree-sitter-css         = "0.25"

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
rayon = { workspace = true }
half = { workspace = true }
candle-nn = { workspace = true }
# GUI/API integration harness (zend/tests/gui_api_harness.rs): boots the real
# axum router model-less and drives it over HTTP. These mirror the runtime deps
# so the test crate can construct the server + issue requests itself.
tokio        = { version = "1", features = ["full"] }
axum         = { version = "0.7", features = ["ws"] }
reqwest      = { version = "0.12", features = ["json", "multipart"] }
serde_json   = { workspace = true }
tokio-tungstenite = "0.23"
futures-util = "0.3"

[features]
default = []
# Enable to run GPU-backed integration tests (needs CUDA + GGUF model on disk).
cuda = []
# Zero-cost scoped timing of the projection / reproject hot path. Forwards to
# candle-conversation; emits an aggregated breakdown under
# `candle_conversation::scheduler::profile`.
profile = ["candle-conversation/profile"]
