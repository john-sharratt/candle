[package]
name = "zend"
version = "0.1.0"
edition = "2021"
description = "Zen Code daemon — persistent AI coding assistant"

[[bin]]
name = "zend"
path = "src/main.rs"

[lib]
name = "zend"
path = "src/lib.rs"

[dependencies]
anyhow     = { workspace = true }
base64     = { workspace = true }
clap       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

axum         = { version = "0.7", features = ["macros", "ws", "multipart"] }
tokio        = { version = "1",   features = ["full"] }
futures      = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
# The built-in tool catalog's definitions and the web UI, compiled in
# (`tool_def`, `tenant::WEB`).
include_dir  = { version = "0.7" }
# The process zend runs in: logging, the model, the HTTP server, the shared
# endpoints (`docs/shared_model_host.md`). zend is one of its tenants.
host         = { path = "../host" }
# How each route is dispatched under a cluster, and the passthrough key the
# gateway routes a conversation by (`docs/replicated_substrate.md` §5.2).
cluster      = { path = "../cluster" }
# With `--cluster`, commands and pushes go to agents (`docs/replicated_substrate.md` §11.5).
agent        = { path = "../agent" }
substrate-git = { path = "../substrate-git", features = ["member"] }
# A conversation's files kept as file events (`docs/zend_vfs_events.md`).
store-events = { path = "../store-events" }
# The gateway's own types, where zend reads them: who a caller is
# (`web::auth`) and how a file goes on the wire (`web::asset` — entity tag,
# conditional answer, gzip, cache tier), one implementation shared with the
# gateway and the host.
web          = { path = "../web" }
# The MCP server zend's tools are served on, at `/v1/mcp` (`docs/mcp_app.md`):
# the protocol and its sessions, written once and shared with npcd and the
# aggregator in front of both.
mcp-server   = { path = "../mcp-server" }
reqwest      = { version = "0.12", features = ["stream"] }
# The query strings the operations tools send up to a gateway.
url          = "2"

candle              = { workspace = true, features = ["cuda"] }
candle-conversation = { path = "../candle-conversation", features = ["hub"] }
zend-tools          = { path = "../zend-tools" }
zend-vfs            = { path = "../zend-vfs" }
# A file as the anchored parts `file_read` shows: what a page holds, so the
# ingest records how many pages a file reads as.
doc-units           = { path = "../doc-units" }
# A dialogue's working journal — entries, their check, the write grammar, the
# draft — shared with npcd (`docs/zend_journal.md`).
journal-core        = { path = "../journal-core" }
regex               = "1"
tokenizers          = { workspace = true }

# Workspace scanning: `ignore` is ripgrep's git-aware file walker. The
# per-language syntax trees code is carved by live in `doc-units`.
ignore                  = "0.4"
sha2                    = "0.10"
thiserror               = { workspace = true }

[build-dependencies]
embed-watch = { path = "../embed-watch" }

[dev-dependencies]
# `test-helpers` on top of the runtime features: the behavioural test catalogue
# (`docs/recurrent_state_behavioural_tests.md`) asserts on a conversation's
# recurrent MEMORY, which is otherwise visible only through the record a seal
# writes — too coarse for a continuity oracle and impossible for a leak test.
candle-conversation = { path = "../candle-conversation", features = ["hub", "test-helpers"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
rayon = { workspace = true }
half = { workspace = true }
candle-nn = { workspace = true }
# GUI/API integration harness (zend/tests/gui_api_harness.rs): boots the real
# axum router model-less and drives it over HTTP. These mirror the runtime deps
# so the test crate can construct the server + issue requests itself.
tokio        = { version = "1", features = ["full"] }
axum         = { version = "0.7", features = ["ws"] }
reqwest      = { version = "0.12", features = ["json", "multipart"] }
serde_json   = { workspace = true }
tokio-tungstenite = "0.23"
futures-util = "0.3"
# `atexit`, so `tools_integration`'s shared daemon is shut down when its test
# binary ends — libtest has no hook after the last test.
libc = "0.2"

[features]
default = []
# Enable to run GPU-backed integration tests (needs CUDA + GGUF model on disk).
cuda = []
# Zero-cost scoped timing of the projection / reproject hot path. Forwards to
# candle-conversation; emits an aggregated breakdown under
# `candle_conversation::scheduler::profile`.
profile = ["candle-conversation/profile", "host/profile"]
# `Tensor::assert` / `QTensor::assert` — one launch per assert site, no sync and
# no allocation. A debugging session, not a default: the launches are real work.
tensor-assert = ["candle-conversation/tensor-assert"]
# Name the call sites that allocate from the CUDA driver during a wave — see
# `candle::forbidden_alloc`. Diagnostic; the daemon logs one report per wave
# window that finds anything.
forbidden_allocations = ["candle-conversation/forbidden_allocations"]
