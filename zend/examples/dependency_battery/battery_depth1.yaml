# The depth-1 battery: the knowledge base's sealed reading, on the production
# path, over what an ingest at `max_depth: 1` holds — the workspace
# repositories' root files (docs/placed_section_layout.md §7). Asked with the
# production arm (C1) alone, against `--repo` the candle checkout; another
# repository's file is named from it (`../yenbot/Cargo.toml`).
#
#   direct         — one file answers it, and the question names it
#   transitive     — two files answer it together; neither named by its file
#                    name where the answer turns on telling them apart
#   architectural  — the seed's documents, the knowledge base's mandatory files
#
# Every expected item was read from the file it names, as the cluster's
# checkout holds it — what the knowledge base ingests — not a local working
# tree, which may be behind it; the format is `battery.yaml`'s.

categories: { direct: 15, transitive: 3, architectural: 6 }

questions:
  # ── Direct ────────────────────────────────────────────────────────────────
  - id: k01
    category: direct
    question: >-
      In the yenbot repository's Cargo.toml, which version of serde is declared, and which feature does it enable?
    expect: ["1.0.228", "derive"]
    files: [../yenbot/Cargo.toml]
    names_file: true

  - id: k02
    category: direct
    question: >-
      Which version of serde does the candle workspace's Cargo.toml declare?
    expect: ["1.0.171"]
    files: [Cargo.toml]
