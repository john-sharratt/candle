# The dependency battery of docs/unbounded_agents.md §9.12: 128 questions,
# 43 direct, 43 transitive and 42 architectural, committed before the first run.
#
# Every question has an answer the source settles. `expect` lists what a
# correct answer must name — a file, an identifier or a value — each checked
# against the repository when the battery was written; `a|b` accepts either
# spelling. Matching is case-insensitive and on substrings, so a path
# (`candle-conversation/src/provenance/scan.rs`) names `scan.rs`. No expected
# item is spelled in its own question.
#
#   direct         — one hop: where a function is defined, and what calls it.
#                    Generated from the source by rule, so their selection
#                    carries no judgement (`direct.rs`; `dependency_battery
#                    direct --repo <candle>` prints them).
#   transitive     — a chain of three or more hops through the code
#   architectural  — an assumption several components share with no single
#                    call path between them
#
# `files` are the repository files that answer the question — what retrieval
# should place in the conversation for the answer to be read rather than
# remembered. `names_file` says whether the question names one of them (its
# file name, or a distinctive stem); the split is fixed here, before any run,
# and `battery.rs` checks each flag against its text.

