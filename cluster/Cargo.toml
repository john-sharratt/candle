[package]
name = "cluster"
version = "0.1.0"
edition = "2021"
description = "The cluster socket: frames, handshake, multiplexed streams and delivery bookkeeping (docs/replicated_substrate.md §3–§4)"
build = "build.rs"

# No candle and no CUDA: the gateway links this crate, and record bytes stay
# opaque to it.
[dependencies]
# Paxos keeps several maps keyed by short byte strings, each touched for every
# frame; SipHash dominated them.
ahash       = { workspace = true }
applied-set = { path = "../applied-set" }
# The vote journal's per-half checksum.
crc32fast   = "1.5"
# A WebSocket is a `Sink + Stream`; the pipe adapter splits it.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac        = "0.12"
http        = "1"
# The gateway matches request paths against a member's dispatch table with the
# matcher axum itself uses, so a pattern means the same on both sides.
matchit     = "0.7"
serde_json  = { workspace = true }
sha2        = "0.10"
rand        = { workspace = true }
# The status page's data, as JSON.
serde       = { workspace = true }
# A member's `CAPACITY`: cores, load and free memory (§5.3, §11.2).
sysinfo     = { version = "0.31", default-features = false, features = ["system"] }
thiserror   = { workspace = true }
tokio       = { version = "1", features = ["sync", "rt", "time", "macros", "io-util"] }
# A member's socket. No TLS and no connector here: the host that dials picks
# its own, and the gateway's socket is axum's.
tokio-tungstenite = { version = "0.24", default-features = false }
# A member's replication reports cut-offs, rejoins and quiet catch-ups.
tracing     = { workspace = true }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
# The consensus harness's budget is the engine's cost, so it is timed on the
# thread's CPU clock: a wall clock also counts what else the machine is running.
cpu-time = "1"
tempfile = { workspace = true }
# `test-util` for `#[tokio::test(start_paused = true)]`: the backoff and
# keep-alive schedules are asserted on a paused clock.
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros", "io-util", "test-util"] }
