[build]
rustflags = ["-C", "target-cpu=native"]

[alias]
nt = "nextest run"
nti = "nextest run --run-ignored all"
# Reclaim the generations cargo never collects. Every CUDA test binary carries
# its own ~900 MB copy of the kernel archive, so a rebuild leaves tens of GB of
# superseded artifacts behind; cargo has no post-build hook to do this itself.
# `cargo prune -- --dry-run` reports without deleting.
prune = "run -q -p target-prune --"

[target.wasm32-unknown-unknown]
rustflags = [
    "-C",
    "target-feature=+simd128",
    "--cfg",
    'getrandom_backend="wasm_js"',
]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-feature=-avx,-avx2"]

# The cluster ships one binary to every member, so an x86-64 build targets a
# CPU level every member has, never the one it happened to be built on: a
# `native` build from a Core Ultra used instructions the i7-10700K lacks, and
# died at start on it with an illegal instruction (0xc000001d). x86-64-v2 is
# SSE4.2 and POPCNT. Everything wider — AVX/F16C (`candle_core::cpu::avx`),
# AVX2/FMA (`candle_core::quantized::avx`), AVX-512 VPOPCNTDQ (the provenance
# scorer), AVX-VNNI and AVX-512 (`expert_lre::cpu_pool::kernel`) — is compiled
# with its own `target_feature` and chosen at runtime.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]
